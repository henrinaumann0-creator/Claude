    const hit = raycast(world, this.x, this.y, this.z, dx, dy, dz, step);
    if (hit && SOLID[hit.id]) {
      this.x += dx * hit.dist; this.y += dy * hit.dist; this.z += dz * hit.dist;
      this.stuck = true; this.age = 0;
      if (hit.id === B.tnt) { world.setBlock(hit.x, hit.y, hit.z, 0); Game.primeTNT(hit.x, hit.y, hit.z, 4); }
      Sound.play('arrowhit', this.x, this.y, this.z);
    } else { this.x += this.vx * dt; this.y += this.vy * dt; this.z += this.vz * dt; }
    this.mesh.position.set(this.x, this.y, this.z);
    this.mesh.lookAt(this.x + dx, this.y + dy, this.z + dz);
    if (this.y < -64) this.remove();
  }
  remove() { this.dead = true; Renderer.entityGroup.remove(this.mesh); disposeTree(this.mesh); }
}

// ─── Primed TNT ───────────────────────────────────────────────────────────
// ─── Ender Dragon (boss) ──────────────────────────────────────────────────
// Circles the island, periodically dives at the player, heals from End
// crystals (beam), deals contact damage; on death it builds the exit portal.
// STUB: perching on the exit portal, dragon breath/fireballs and block breaking.
class EnderDragon extends Mob {
  constructor(x, y, z) {
    super('ender_dragon', x, y, z);
    this.state = 'circle'; this.angle = 0; this.stateTime = 0; this.contactCd = 0; this.healCd = 0;
    this.beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineBasicMaterial({ color: 0xff80ff }));
    this.beam.visible = false; this.beam.frustumCulled = false;
    Renderer.entityGroup.add(this.beam);
    this.target = [0, 80, 0];
  }
  think(world, player) {
    if (this.deathTime >= 0) return;
    this.stateTime += TICK; this.contactCd -= TICK; this.healCd -= TICK;
    this.invul = Math.max(0, this.invul - TICK);
    const survival = !player.creative && !player.dead;
    if (this.state === 'circle') {
      this.angle += TICK * 0.35;
      this.target = [Math.cos(this.angle) * 45, 78 + Math.sin(this.angle * 3) * 6, Math.sin(this.angle) * 45];
      if (survival && this.stateTime > 10 + Math.random() * 8 && Math.hypot(player.x, player.z) < 120) { this.state = 'dive'; this.stateTime = 0; Sound.play('dragon', this.x, this.y, this.z); }
    } else if (this.state === 'dive') {
      this.target = [player.x, player.y + 1, player.z];
      if (this.stateTime > 5 || Math.hypot(player.x - this.x, player.y - this.y, player.z - this.z) < 3) { this.state = 'climb'; this.stateTime = 0; }
    } else if (this.state === 'climb') {
      this.target = [this.x + Math.sin(this.yaw) * 20, 95, this.z + Math.cos(this.yaw) * 20];
      if (this.stateTime > 3) { this.state = 'circle'; this.stateTime = 0; this.angle = Math.atan2(this.z, this.x); }
    }
    // Contact damage + knockback.
    if (survival && this.contactCd <= 0 && Math.hypot(player.x - this.x, player.y + 1 - (this.y + 1.5), player.z - this.z) < 4.5) {
      this.contactCd = 1; player.hurt(8, 'dragon', this); player.vy = 10;
    }
    // Healing from the nearest living End crystal.
    let crystal = null, cd = 48;
    for (const e of Game.entities) if (e instanceof Mob && e.T.crystal && !e.dead && e.deathTime < 0) { const d = this.distTo(e); if (d < cd) { cd = d; crystal = e; } }
    this.healCrystal = crystal;
    if (crystal && this.healCd <= 0 && this.health < this.maxHealth) { this.healCd = 0.5; this.health = Math.min(this.maxHealth, this.health + 1); }
  }
  hurt(amount, source, from) {
    if (source === 'explosion') amount *= 0.5;
    const r = super.hurt(amount, source, null);
    if (r && this.state === 'circle' && Math.random() < 0.3) { this.state = 'climb'; this.stateTime = 0; }
    return r;
  }
  die() {
    this.deathTime = 0;
    Sound.play('dragon', this.x, this.y, this.z);
  }
  update(dt, world, player) {
    if (this.deathTime >= 0) {
      this.deathTime += dt;
      this.y += dt * 2;
      Renderer.emit(this.x + (Math.random() - 0.5) * 6, this.y + Math.random() * 3, this.z + (Math.random() - 0.5) * 6, 6, [1, 0.8, 1], 1, 4, -2, 1);
      this.mesh.position.set(this.x, this.y, this.z);
      if (this.deathTime > 4) {
        this.remove();
        Game.onDragonKilled();
      }
      return;
    }
    const [tx, ty, tz] = this.target;
    const dx = tx - this.x, dy = ty - this.y, dz = tz - this.z, l = Math.hypot(dx, dy, dz) || 1;
    const sp = this.state === 'dive' ? 20 : 14;
    const k = 1 - Math.exp(-1.6 * dt);
    this.vx += (dx / l * sp - this.vx) * k; this.vy += (dy / l * sp - this.vy) * k; this.vz += (dz / l * sp - this.vz) * k;
    this.x += this.vx * dt; this.y += this.vy * dt; this.z += this.vz * dt;
    this.targetYaw = Math.atan2(this.vx, this.vz);
    let dyaw = this.targetYaw - this.yaw;
    while (dyaw > Math.PI) dyaw -= Math.PI * 2;
    while (dyaw < -Math.PI) dyaw += Math.PI * 2;
    this.yaw += dyaw * Math.min(1, dt * 3);
    this.walk += dt * 4;
    const [wl, wr] = this.model.wings;
    wl.rotation.z = Math.sin(this.walk) * 0.7; wr.rotation.z = -Math.sin(this.walk) * 0.7;
    this.model.tail.forEach((t, i) => (t.position.x = Math.sin(this.walk * 0.5 - i * 0.6) * 0.4 * i));
    this.mesh.position.set(this.x, this.y, this.z);
    this.mesh.rotation.set(-clamp(this.vy / sp, -0.6, 0.6) * 0.6, this.yaw, 0);
    for (const m of this.mats) { m.color.setScalar(0.9); if (m.emissive) m.emissive.setRGB(this.hurtTime > 0 ? 0.6 : 0, 0, 0); }
    this.hurtTime = Math.max(0, this.hurtTime - dt);
    if (this.hpBar) this.hpBar.visible = false; // the boss bar is used instead
    const c = this.healCrystal;
    this.beam.visible = !!c && this.health < this.maxHealth;
    if (this.beam.visible) { const pos = this.beam.geometry.attributes.position; pos.setXYZ(0, c.x, c.y + 1, c.z); pos.setXYZ(1, this.x, this.y + 1.5, this.z); pos.needsUpdate = true; }
  }
  remove() { super.remove(); Renderer.entityGroup.remove(this.beam); this.beam.geometry.dispose(); this.beam.material.dispose(); }
}

// ─── Fireballs (ghasts: big & explosive, blazes: small & incendiary) ─────
class Fireball {
  constructor(x, y, z, vx, vy, vz, owner, big) {
    this.x = x; this.y = y; this.z = z; this.vx = vx; this.vy = vy; this.vz = vz; this.owner = owner; this.big = big;
    this.age = 0; this.dead = false;
    const sz = big ? 0.9 : 0.35;
    this.mesh = new THREE.Mesh(sharedBox(sz, sz, sz), new THREE.MeshBasicMaterial({ color: big ? 0xff7a1a : 0xffb020 }));
    Renderer.entityGroup.add(this.mesh);
    this.r = sz / 2;
  }
  /** Punching a ghast fireball sends it back. */
  deflect(dir) { const sp = Math.hypot(this.vx, this.vy, this.vz); this.vx = dir[0] * sp; this.vy = dir[1] * sp; this.vz = dir[2] * sp; this.owner = 'player'; }
  update(dt, world, player) {
    this.age += dt;
    if (this.age > 12) { this.remove(); return; }
    const sp = Math.hypot(this.vx, this.vy, this.vz), step = sp * dt;
    if (sp < 1e-6) return;
    const dx = this.vx / sp, dy = this.vy / sp, dz = this.vz / sp;
    const targets = this.owner === 'player' ? Game.entities.filter((e) => e instanceof Mob && e.deathTime < 0) : [player];
    let hitEnt = null;
    for (const e of targets) {
      const bb = e.aabb();
      const r = rayBox(this.x, this.y, this.z, dx, dy, dz, [bb[0] - this.r, bb[1] - this.r, bb[2] - this.r, bb[3] + this.r, bb[4] + this.r, bb[5] + this.r]);
      if (r && r.t <= step) { hitEnt = e; break; }
    }
    const hit = hitEnt ? null : raycast(world, this.x, this.y, this.z, dx, dy, dz, step);
    if (hitEnt || (hit && SOLID[hit.id])) {
      if (hit) { this.x += dx * hit.dist; this.y += dy * hit.dist; this.z += dz * hit.dist; }
      if (this.big) {
        Explosion.explode(world, this.x, this.y, this.z, 1.2, null);
        for (let i = 0; i < 6; i++) {
          const fx = Math.floor(this.x + (Math.random() - 0.5) * 4), fy = Math.floor(this.y + (Math.random() - 0.5) * 2), fz = Math.floor(this.z + (Math.random() - 0.5) * 4);
          if (world.getBlock(fx, fy, fz) === 0 && SOLID[world.getBlock(fx, fy - 1, fz)]) { world.setBlock(fx, fy, fz, B.fire); world.schedule(fx, fy, fz, 30); }
        }
      } else {
        if (hitEnt) { hitEnt.hurt(5, this.owner === 'player' ? 'player' : 'fire', { x: this.x - dx, z: this.z - dz, knockback: 2 }); hitEnt.fire = Math.max(hitEnt.fire || 0, 5); }
        else if (hit) {
          const fx = hit.x + DIRS[hit.d][0], fy = hit.y + DIRS[hit.d][1], fz = hit.z + DIRS[hit.d][2];
          if (world.getBlock(fx, fy, fz) === 0) { world.setBlock(fx, fy, fz, B.fire); world.schedule(fx, fy, fz, 30); Game.remeshNear(fx, fz); }
        }
        Renderer.emit(this.x, this.y, this.z, 8, [1, 0.6, 0.1], 0.3, 2, 2, 0.4);
      }
      this.remove(); return;
    }
    this.x += this.vx * dt; this.y += this.vy * dt; this.z += this.vz * dt;
    this.mesh.position.set(this.x, this.y, this.z);
    this.mesh.rotation.x += dt * 5; this.mesh.rotation.y += dt * 4;
    if (Math.random() < 0.6) Renderer.emit(this.x, this.y, this.z, 1, [0.4, 0.4, 0.4], 0.2, 0.3, -1, 0.6);
  }
  remove() { this.dead = true; Renderer.entityGroup.remove(this.mesh); disposeTree(this.mesh); }
}

// ─── Thrown ender pearls & Eyes of Ender ─────────────────────────────────
class ThrownItem {
  constructor(kind, x, y, z, vx, vy, vz, target) {
    this.kind = kind; this.x = x; this.y = y; this.z = z; this.vx = vx; this.vy = vy; this.vz = vz; this.target = target;
    this.age = 0; this.dead = false; this.y0 = y;
    this.mesh = Renderer.itemMesh(kind === 'pearl' ? I.ender_pearl : I.ender_eye, 0.25);
    Renderer.entityGroup.add(this.mesh);
  }
  update(dt, world, player) {
    this.age += dt;
    if (this.kind === 'eye') {
      // Flies towards the nearest stronghold, then hovers and drops (or shatters).
      if (this.age < 1.6 && this.target) {
        const dx = this.target[0] - this.x, dz = this.target[2] - this.z, l = Math.hypot(dx, dz) || 1;
        this.x += dx / l * 9 * dt; this.z += dz / l * 9 * dt; this.y += (this.y0 + 3 - this.y) * dt * 2;
      }
      Renderer.emit(this.x, this.y, this.z, 1, [0.6, 0.3, 0.9], 0.2, 0.3, 0, 0.6);
      if (this.age > 2.4) {
        if (Math.random() < 0.8) Game.dropItem(this.x, this.y, this.z, mkStack(I.ender_eye, 1), 0, 1, 0);
        else { Renderer.emit(this.x, this.y, this.z, 16, [0.3, 0.8, 0.5], 0.5, 2, 5, 0.8); Sound.play('break', this.x, this.y, this.z, 'glass'); }
        this.remove(); return;
      }
    } else {
      this.vy -= 18 * dt;
      const sp = Math.hypot(this.vx, this.vy, this.vz) || 1e-6, step = sp * dt;
      const dx = this.vx / sp, dy = this.vy / sp, dz = this.vz / sp;
      const hit = raycast(world, this.x, this.y, this.z, dx, dy, dz, step);
      let mobHit = null;
      for (const e of Game.entities) if (e instanceof Mob && e.deathTime < 0) { const r = rayBox(this.x, this.y, this.z, dx, dy, dz, e.aabb()); if (r && r.t <= step) mobHit = e; }
      if ((hit && SOLID[hit.id]) || mobHit || this.y < -60) {
        let tx = this.x, ty = this.y, tz = this.z;
        if (hit && !mobHit) { tx = hit.x + 0.5 + DIRS[hit.d][0] * 0.8; ty = hit.y + (hit.d === 2 ? 1 : DIRS[hit.d][1]); tz = hit.z + 0.5 + DIRS[hit.d][2] * 0.8; }
        if (mobHit) mobHit.hurt(0.5, 'player', { x: this.x, z: this.z, knockback: 2 });
        if (this.y > -60 && !player.dead) {
          Renderer.emit(player.x, player.y + 1, player.z, 16, [0.4, 0.9, 0.8], 0.8, 2, 0, 0.8);
          player.x = tx; player.y = ty; player.z = tz; player.vx = player.vy = player.vz = 0; player.fallDist = 0;
          while (player.y < HEIGHT - 2 && Physics.collides(world, player.aabb())) player.y += 1;
          player.invul = 0; player.hurt(5, 'fall');
          Sound.play('ender', player.x, player.y, player.z);
        }
        this.remove(); return;
      }
      this.x += this.vx * dt; this.y += this.vy * dt; this.z += this.vz * dt;
    }
    this.mesh.position.set(this.x, this.y, this.z);
    this.mesh.rotation.y += dt * 4;
  }
  remove() { this.dead = true; Renderer.entityGroup.remove(this.mesh); disposeTree(this.mesh); }
}

class PrimedTNT extends Entity {
  constructor(x, y, z, fuse = 4) {
    super(x + 0.5, y, z + 0.5);
    this.w = 0.98; this.h = 0.98; this.fuse = fuse; this.stepHeight = 0;
    this.vy = 3; this.vx = (Math.random() - 0.5) * 1.2; this.vz = (Math.random() - 0.5) * 1.2;
    this.mesh = new THREE.Mesh(Renderer.blockItemGeometry(B.tnt), new THREE.MeshLambertMaterial({ map: Tex.atlasTexture, emissive: 0x000000 }));
    Renderer.entityGroup.add(this.mesh);
    Sound.play('fuse', x, y, z);
  }
  update(dt, world) {
    this.fuse -= dt;
    const f = this.onGround ? Math.pow(0.01, dt) : 1;
    this.vx *= f; this.vz *= f;
    this.physics(dt, world);
    this.mesh.position.set(this.x, this.y + 0.49, this.z);
    const flash = Math.floor(this.fuse * 5) % 2 === 0;
    this.mesh.material.emissive.setScalar(flash ? 0.6 : 0);
    const s = this.fuse < 0.4 ? 1 + (0.4 - this.fuse) * 0.5 : 1;
    this.mesh.scale.setScalar(s);
    if (Math.random() < 0.5) Renderer.emit(this.x, this.y + 1.1, this.z, 1, [0.5, 0.5, 0.5], 0.1, 0.5, -1, 0.6);
    if (this.fuse <= 0) { this.remove(); Explosion.explode(world, this.x, this.y + 0.5, this.z, 4, this); }
  }
  remove() { this.dead = true; Renderer.entityGroup.remove(this.mesh); disposeTree(this.mesh); }
}

// ═══════════════════════════════════════════════════════════════════════════
// §11 WORLD SYSTEMS
// ═══════════════════════════════════════════════════════════════════════════

// ─── Explosions (TNT, creepers) ───────────────────────────────────────────
const Explosion = {
  explode(world, x, y, z, power, source) {
    Sound.play('explode', x, y, z);
    Renderer.emit(x, y, z, 60, [0.85, 0.85, 0.85], power * 0.8, 6, -1, 1.2);
    Renderer.emit(x, y, z, 25, [1, 0.7, 0.3], power * 0.5, 8, 2, 0.5);
    const r = Math.ceil(power) + 1;
    const cx = Math.floor(x), cy = Math.floor(y), cz = Math.floor(z);
    const rng = Math.random;
    for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) for (let dz = -r; dz <= r; dz++) {
      const bx = cx + dx, by = cy + dy, bz = cz + dz;
      if (by <= 0 || by >= HEIGHT) continue;
      const d = Math.hypot(bx + 0.5 - x, by + 0.5 - y, bz + 0.5 - z);
      const id = world.getBlock(bx, by, bz);
      if (!id || FLUID[id]) continue;
      const def = BLOCKS[id];
      const resist = def.blastProof || def.hardness < 0 ? 999 : Math.min(3, def.hardness * 0.3);
      if (d > power * (0.7 + rng() * 0.5) - resist) continue;
      if (id === B.tnt) { world.setBlock(bx, by, bz, 0); Game.primeTNT(bx, by, bz, 0.5 + rng()); continue; }
      const meta = world.getMeta(bx, by, bz);
      world.setBlock(bx, by, bz, 0);
      if (rng() < 1 / power) Game.dropBlockItems(world, bx, by, bz, id, meta, null);
    }
    // Damage + knockback.
    const hurtOne = (e, isPlayer) => {
      const ex = e.x, ey = e.y + e.h / 2, ez = e.z;
      const d = Math.hypot(ex - x, ey - y, ez - z);
      if (d > power * 2) return;
      const impact = 1 - d / (power * 2);
      const dmg = Math.floor((impact * impact + impact) / 2 * 8 * power + 1);
      const l = d || 1;
      e.vx += (ex - x) / l * impact * 14; e.vy += impact * 9; e.vz += (ez - z) / l * impact * 14; e.knockTime = 0.4;
      if (isPlayer) e.hurt(dmg, 'explosion');
      else if (e.hurt) e.hurt(dmg, 'explosion');
    };
    hurtOne(Game.player, true);
    for (const e of Game.entities) if (e instanceof Mob && e !== source) hurtOne(e, false);
  },
};

// ─── Fluids: cellular flow for water and lava ─────────────────────────────
// meta bits 0-2 = level (0 source … 7 thinnest), bit 3 = falling column.
const Fluids = {
  canFlowInto(world, x, y, z, fluid, level) {
    if (y < 0 || y >= HEIGHT) return false;
    const id = world.getBlock(x, y, z);
    if (id === 0) return true;
    if (FLUID[id] === fluid) { const m = world.getMeta(x, y, z); return (m & 7) !== 0 && (m & 8) === 0 && (m & 7) > level; }
    if (FLUID[id]) return true; // the other fluid: reaction handled by caller
    const def = BLOCKS[id];
    return !def.solid && (def.plant || def.replaceable || id === B.torch || id === B.redstone_wire || id === B.redstone_torch || id === B.unlit_redstone_torch || id === B.lever || id === B.stone_button || id === B.repeater || id === B.powered_repeater || id === B.ladder && false);
  },
  /** Put fluid in a cell, washing away plants and reacting lava/water. */
  flowInto(world, x, y, z, fluidId, meta) {
    const cur = world.getBlock(x, y, z);
    const f = FLUID[fluidId];
    if (FLUID[cur] && FLUID[cur] !== f) {
      // Lava meets water.
      if (f === 1) world.setBlock(x, y, z, (world.getMeta(x, y, z) & 7) === 0 ? B.obsidian : B.cobblestone);
      else world.setBlock(x, y, z, B.stone);
      Sound.play('fizz', x, y, z);
      Renderer.emit(x + 0.5, y + 1, z + 0.5, 8, [0.8, 0.8, 0.8], 0.6, 1.5, -2, 1);
      return;
    }
    if (cur && !FLUID[cur]) Game.dropBlockItems(world, x, y, z, cur, world.getMeta(x, y, z), null);
    world.setBlock(x, y, z, fluidId, meta);
  },
  update(world, x, y, z) {
    const id = world.getBlock(x, y, z);
    const f = FLUID[id];
    if (!f) return;
    const water = f === 1;
    const drop = water ? 1 : (world.dim === 'nether' ? 1 : 2);
    let meta = world.getMeta(x, y, z);
    let level = meta & 7, falling = (meta & 8) !== 0;
    // Lava touching water hardens.
    if (!water) {
      for (let d = 0; d < 6; d++) {
        if (d === 3) continue;
        if (FLUID[world.getBlock(x + DIRS[d][0], y + DIRS[d][1], z + DIRS[d][2])] === 1) {
          world.setBlock(x, y, z, level === 0 && !falling ? B.obsidian : B.cobblestone);
          Sound.play('fizz', x, y, z);
          return;
        }
      }
    }
    if (level !== 0 || falling) {
      // Re-derive this cell's level from its neighbours.
      let newLevel = 99, newFalling = false, sources = 0;
      if (FLUID[world.getBlock(x, y + 1, z)] === f) { newFalling = true; newLevel = 1; }
      for (const d of [0, 1, 4, 5]) {
        const nx = x + DIRS[d][0], nz = z + DIRS[d][2];
        if (FLUID[world.getBlock(nx, y, nz)] !== f) continue;
        const nm = world.getMeta(nx, y, nz);
        const nl = (nm & 8) ? 0 : nm & 7;
        if ((nm & 7) === 0 && !(nm & 8)) sources++;
        newLevel = Math.min(newLevel, nl + drop);
      }
      if (water && sources >= 2) {
        const below = world.getBlock(x, y - 1, z);
        if (OPAQUE[below] || (FLUID[below] === 1 && (world.getMeta(x, y - 1, z) & 7) === 0)) { newLevel = 0; newFalling = false; }
      }
      if (newLevel > 7 && !newFalling) { world.setBlock(x, y, z, 0); return; }
      const nm = newFalling ? 8 | Math.min(7, newLevel) : newLevel;
      if (nm !== meta) { world.setBlock(x, y, z, id, nm); meta = nm; level = nm & 7; falling = (nm & 8) !== 0; }
    }
    // Spread: down first, otherwise sideways.
    const belowId = world.getBlock(x, y - 1, z);
    if (y > 0 && (this.canFlowInto(world, x, y - 1, z, f, 0) || (FLUID[belowId] === f && (world.getMeta(x, y - 1, z) & 7) !== 0 && !(world.getMeta(x, y - 1, z) & 8)))) {
      if (FLUID[belowId] !== f || !(world.getMeta(x, y - 1, z) & 8)) this.flowInto(world, x, y - 1, z, id, 8 | Math.max(1, level));
      if (level !== 0 || falling) return;
    }
    const next = (falling ? 0 : level) + drop;
    if (next > 7) return;
    if (FLUID[belowId] === f && !(level === 0 && !falling)) return;
    for (const d of [0, 1, 4, 5]) {
      const nx = x + DIRS[d][0], nz = z + DIRS[d][2];
      if (this.canFlowInto(world, nx, y, nz, f, next)) this.flowInto(world, nx, y, nz, id, next);
    }
  },
};

// ─── Scheduled & random block ticks ───────────────────────────────────────
const Ticks = {
  processScheduled(world) {
    const due = [];
    for (const [k, t] of world.scheduled) { if (t <= world.tick) { due.push(k); if (due.length >= 600) break; } }
    for (const k of due) {
      world.scheduled.delete(k);
      const y = k % 128, rest = (k - y) / 128;
      const z = (rest % 2097152) - 1048576, x = Math.floor(rest / 2097152) - 1048576;
      if (!world.isLoaded(x, z)) continue;
      this.scheduledTick(world, x, y, z);
    }
  },
  scheduledTick(world, x, y, z) {
    const id = world.getBlock(x, y, z);
    if (!id) return;
    const def = BLOCKS[id];
    if (def.fluid) { Fluids.update(world, x, y, z); return; }
    if (def.gravity) {
      const below = world.getBlock(x, y - 1, z);
      if (y > 0 && (below === 0 || FLUID[below] || REPLACEABLE[below])) {
        const meta = world.getMeta(x, y, z);
        world.setBlock(x, y, z, 0);
        if (below && !FLUID[below]) Game.dropBlockItems(world, x, y - 1, z, below, 0, null);
        world.setBlock(x, y - 1, z, id, meta);
      }
      return;
    }
    if (id === B.fire) { this.fireTick(world, x, y, z); return; }
    if (id === B.stone_button && (world.getMeta(x, y, z) & 8)) { world.setMeta(x, y, z, world.getMeta(x, y, z) & 7); Sound.play('click', x, y, z); return; }
    if (id === B.nether_portal) { if (!Portals.valid(world, x, y, z)) world.setBlock(x, y, z, 0); return; }
    if (!Blocks.hasSupport(world, x, y, z, id)) Game.breakBlockNatural(world, x, y, z);
  },
  fireTick(world, x, y, z) {
    const below = world.getBlock(x, y - 1, z);
    const eternal = below === B.netherrack;
    const rng = Math.random;
    let age = world.getMeta(x, y, z);
    const flammableAt = (bx, by, bz) => { const b = world.getBlock(bx, by, bz); return b && BLOCKS[b].flammable; };
    let fuel = false;
    for (let d = 0; d < 6; d++) if (flammableAt(x + DIRS[d][0], y + DIRS[d][1], z + DIRS[d][2])) fuel = true;
    if (!eternal) {
      if (Game.weather.raining && world.hasSky && world.getSky(x, y, z) >= 14) { world.setBlock(x, y, z, 0); return; }
      if (!fuel && !SOLID[below]) { world.setBlock(x, y, z, 0); return; }
      if (!fuel && age > 3) { world.setBlock(x, y, z, 0); return; }
      if (age >= 15 && rng() < 0.25) { world.setBlock(x, y, z, 0); return; }
      age = Math.min(15, age + 1 + Math.floor(rng() * 2));
      world.setMeta(x, y, z, age, { update: false, record: false });
      // Burn neighbours.
      for (let d = 0; d < 6; d++) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1], nz = z + DIRS[d][2];
        if (!flammableAt(nx, ny, nz) || rng() > 0.2) continue;
        const b = world.getBlock(nx, ny, nz);
        if (b === B.tnt) { world.setBlock(nx, ny, nz, 0); Game.primeTNT(nx, ny, nz, 1 + rng()); continue; }
        world.setBlock(nx, ny, nz, rng() < 0.6 ? B.fire : 0);
        if (world.getBlock(nx, ny, nz) === B.fire) world.schedule(nx, ny, nz, 30 + Math.floor(rng() * 10));
      }
      // Spread to nearby air next to flammable blocks.
      for (let i = 0; i < 2; i++) {
        const nx = x + Math.floor(rng() * 3) - 1, ny = y + Math.floor(rng() * 4) - 1, nz = z + Math.floor(rng() * 3) - 1;
        if (world.getBlock(nx, ny, nz) !== 0) continue;
        let adj = false;
        for (let d = 0; d < 6; d++) if (flammableAt(nx + DIRS[d][0], ny + DIRS[d][1], nz + DIRS[d][2])) adj = true;
        if (adj && rng() < 0.35) { world.setBlock(nx, ny, nz, B.fire); world.schedule(nx, ny, nz, 30 + Math.floor(rng() * 10)); }
      }
    }
    world.schedule(x, y, z, 30 + Math.floor(rng() * 10));
  },
  /** Random ticks: crops, saplings, grass spread, farmland, leaves decay, cane/cactus, lava fire. */
  random(world, player, daylight) {
    const pcx = Math.floor(player.x) >> 4, pcz = Math.floor(player.z) >> 4, R = Math.min(5, SETTINGS.renderDistance);
    const rng = Math.random;
    for (let cz = pcz - R; cz <= pcz + R; cz++) for (let cx = pcx - R; cx <= pcx + R; cx++) {
      const ch = world.getChunk(cx, cz);
      if (!ch || ch.state < CH_LIT) continue;
      for (let k = 0; k < 14; k++) {
        const i = Math.floor(rng() * CHUNK_VOL);
        const id = ch.blocks[i];
        if (!id) continue;
        const x = cx * 16 + (i & 15), y = i >> 8, z = cz * 16 + ((i >> 4) & 15);
        this.randomTick(world, x, y, z, id, ch.meta[i], daylight, rng);
      }
    }
  },
  randomTick(world, x, y, z, id, meta, daylight, rng) {
    const light = () => Math.max(world.getSky(x, y + 1, z) * Math.max(0.5, daylight), world.getBlockLight(x, y + 1, z));
    switch (id) {
      case B.nether_wart: if (meta < 3 && rng() < 0.3) world.setMeta(x, y, z, meta + 1); break;
      case B.wheat: if (meta < 7 && light() >= 9 && rng() < (world.getMeta(x, y - 1, z) > 0 ? 0.35 : 0.15)) world.setMeta(x, y, z, meta + 1); break;
      case B.oak_sapling: case B.birch_sapling: case B.spruce_sapling:
        if (light() >= 9 && rng() < 0.15) Game.growTree(world, x, y, z, id === B.birch_sapling ? 'birch' : id === B.spruce_sapling ? 'spruce' : 'oak');
        break;
      case B.farmland: {
        let wet = false;
        for (let dx = -4; dx <= 4 && !wet; dx++) for (let dz = -4; dz <= 4 && !wet; dz++) for (let dy = 0; dy <= 1; dy++) if (FLUID[world.getBlock(x + dx, y + dy, z + dz)] === 1) { wet = true; break; }
        if (wet || (Game.weather.raining && world.getSky(x, y + 1, z) >= 15)) { if (meta !== 7) world.setMeta(x, y, z, 7); }
        else if (meta > 0) world.setMeta(x, y, z, meta - 1);
        else if (world.getBlock(x, y + 1, z) !== B.wheat) world.setBlock(x, y, z, B.dirt);
        break;
      }
      case B.grass_block: {
        const above = world.getBlock(x, y + 1, z);
        if (OPAQUE[above] || FLUID[above]) { world.setBlock(x, y, z, B.dirt); break; }
        for (let i = 0; i < 2; i++) {
          const nx = x + Math.floor(rng() * 3) - 1, ny = y + Math.floor(rng() * 5) - 3, nz = z + Math.floor(rng() * 3) - 1;
          if (world.getBlock(nx, ny, nz) === B.dirt && !OPAQUE[world.getBlock(nx, ny + 1, nz)] && !FLUID[world.getBlock(nx, ny + 1, nz)] && world.getSky(nx, ny + 1, nz) >= 9) world.setBlock(nx, ny, nz, B.grass_block);
        }
        break;
      }
      case B.sugar_cane: case B.cactus: {
        if (world.getBlock(x, y + 1, z) !== 0 || rng() > 0.2) break;
        let h = 1; while (world.getBlock(x, y - h, z) === id) h++;
        if (h < 3) world.setBlock(x, y + 1, z, id);
        break;
      }
      case B.oak_leaves: case B.birch_leaves: case B.spruce_leaves: {
        if (meta & 1) break; // player placed
        let found = false;
        for (let dx = -4; dx <= 4 && !found; dx++) for (let dy = -4; dy <= 4 && !found; dy++) for (let dz = -4; dz <= 4 && !found; dz++) {
          const b = world.getBlock(x + dx, y + dy, z + dz);
          if (b === B.oak_log || b === B.birch_log || b === B.spruce_log) found = true;
        }
        if (!found) Game.breakBlockNatural(world, x, y, z);
        break;
      }
      case B.lava:
        if (world.dim === 'overworld' && rng() < 0.3) {
          const nx = x + Math.floor(rng() * 3) - 1, ny = y + 1 + Math.floor(rng() * 2), nz = z + Math.floor(rng() * 3) - 1;
          if (world.getBlock(nx, ny, nz) === 0) for (let d = 0; d < 6; d++) {
            const b = world.getBlock(nx + DIRS[d][0], ny + DIRS[d][1], nz + DIRS[d][2]);
            if (b && BLOCKS[b].flammable) { world.setBlock(nx, ny, nz, B.fire); world.schedule(nx, ny, nz, 20); break; }
          }
        }
        break;
      case B.ice: if (world.getBlockLight(x, y + 1, z) > 11) world.setBlock(x, y, z, B.water); break;
    }
  },
};

// ─── Tile entities: furnaces & spawners ───────────────────────────────────
const TileEntities = {
  tick(world, player) {
    for (const [k, t] of world.tiles) {
      if (t.type !== 'furnace' && t.type !== 'spawner' && t.type !== 'brewing') continue;
      const [x, y, z] = parsePosKey(k);
      if (!world.isLoaded(x, z)) continue;
      if (t.type === 'furnace') this.furnace(world, t, x, y, z);
      else if (t.type === 'brewing') this.brewing(world, t, x, y, z);
      else this.spawner(world, t, x, y, z, player);
    }
  },
  furnace(world, t, x, y, z) {
    const res = t.input && SMELTING[t.input.id];
    const canSmelt = !!res && (!t.output || (t.output.id === res && t.output.count < maxStack(res)));
    if (t.burn > 0) t.burn -= TICK;
    if (t.burn <= 0 && canSmelt && t.fuel && FUEL[t.fuel.id]) {
      t.burn = t.burnMax = FUEL[t.fuel.id];
      if (t.fuel.id === I.lava_bucket) t.fuel = mkStack(I.bucket, 1);
      else if (--t.fuel.count <= 0) t.fuel = null;
      UI.dirty = true;
    }
    if (t.burn > 0 && canSmelt) {
      t.cook = (t.cook || 0) + TICK;
      if (t.cook >= SMELT_TIME) {
        t.cook = 0;
        if (--t.input.count <= 0) t.input = null;
        if (t.output) t.output.count++; else t.output = mkStack(res, 1);
        UI.dirty = true;
      }
    } else t.cook = Math.max(0, (t.cook || 0) - TICK * 2);
    const lit = t.burn > 0;
    const id = world.getBlock(x, y, z);
    if (lit && id === B.furnace) world.setBlock(x, y, z, B.lit_furnace, world.getMeta(x, y, z));
    else if (!lit && id === B.lit_furnace) world.setBlock(x, y, z, B.furnace, world.getMeta(x, y, z));
  },
  /** Brewing: 20 s per batch, blaze powder fuels 20 batches. */
  brewing(world, t, x, y, z) {
    const ing = t.ingredient;
    const can = !!ing && t.bottles.some((b) => b && BREWING[b.id] && BREWING[b.id][ing.id]);
    if (can && t.fuelUses <= 0 && t.fuel && t.fuel.id === I.blaze_powder) { t.fuelUses = 20; if (--t.fuel.count <= 0) t.fuel = null; UI.dirty = true; }
    if (can && t.fuelUses > 0) {
      t.time += TICK;
      if (t.time >= 20) {
        t.time = 0; t.fuelUses--;
        for (let i = 0; i < 3; i++) { const b = t.bottles[i]; if (b && BREWING[b.id] && BREWING[b.id][ing.id]) t.bottles[i] = mkStack(BREWING[b.id][ing.id], 1); }
        if (--ing.count <= 0) t.ingredient = null;
        Sound.play('fizz', x, y, z); UI.dirty = true;
      }
    } else t.time = 0;
  },
  spawner(world, t, x, y, z, player) {
    if (Math.hypot(player.x - x, player.y - y, player.z - z) > 16 || player.creative) return;
    if (Math.random() < 0.1) Renderer.emit(x + 0.5, y + 0.5, z + 0.5, 1, [0.9, 0.3, 0.1], 0.8, 0.5, -1, 0.5);
    t.delay = (t.delay || 200) - 1;
    if (t.delay > 0) return;
    t.delay = 200 + Math.floor(Math.random() * 600);
    let near = 0;
    for (const e of Game.entities) if (e instanceof Mob && e.type === t.mob && Math.abs(e.x - x) < 9 && Math.abs(e.z - z) < 9) near++;
    for (let i = 0; i < 4 && near < 6; i++) {
      const sx = x + Math.floor(Math.random() * 9) - 4, sz = z + Math.floor(Math.random() * 9) - 4, sy = y + Math.floor(Math.random() * 3) - 1;
      if (Path.standable(world, sx, sy, sz)) { Game.spawnMob(t.mob, sx + 0.5, sy, sz + 0.5); near++; Renderer.emit(sx + 0.5, sy + 1, sz + 0.5, 12, [0.4, 0.4, 0.4], 1, 1, -1, 0.8); }
    }
  },
};

// ─── Redstone ─────────────────────────────────────────────────────────────
// Simplified model: each tick with changes we recompute the whole loaded
// network. Sources: lever, button, redstone torch, redstone block, powered
// repeater. Wire power falls off by 1 per block. Consumers: lamps, doors,
// TNT, pistons, repeaters and redstone torches (inverters).
// STUB: dust connection shapes (always drawn as '+'), repeater delay settings,
// comparators, observers, sticky pistons and quasi-connectivity.
const Redstone = {
  doorState: new Map(),
  update(world) {
    if (!world.redstoneDirty) return;
    world.redstoneDirty = false;
    const comps = [];
    for (const k of world.redstone) {
      const [x, y, z] = parsePosKey(k);
      if (!world.isLoaded(x, z)) continue;
      const id = world.getBlock(x, y, z);
      if (!id) { world.redstone.delete(k); continue; }
      comps.push([x, y, z, id, world.getMeta(x, y, z)]);
    }
    if (!comps.length) return;
    const strong = new Set();
    const K = posKey;
    for (const [x, y, z, id, m] of comps) {
      if ((id === B.lever || id === B.stone_button) && (m & 8)) { const d = OPPOSITE[m & 7]; strong.add(K(x + DIRS[d][0], y + DIRS[d][1], z + DIRS[d][2])); }
      else if (id === B.redstone_torch) strong.add(K(x, y + 1, z));
      else if (id === B.powered_repeater) { const d = FACING_TO_D[m & 3]; strong.add(K(x + DIRS[d][0], y, z + DIRS[d][2])); }
    }
    /** Power a source block at (sx,sy,sz) sends into neighbour (tx,ty,tz). */
    const sourceInto = (sx, sy, sz, tx, ty, tz) => {
      const id = world.getBlock(sx, sy, sz), m = world.getMeta(sx, sy, sz);
      if (id === B.redstone_block) return 15;
      if ((id === B.lever || id === B.stone_button) && (m & 8)) return 15;
      if (id === B.redstone_torch) {
        const d = OPPOSITE[m & 7];
        return (sx + DIRS[d][0] === tx && sy + DIRS[d][1] === ty && sz + DIRS[d][2] === tz) ? 0 : 15;
      }
      if (id === B.powered_repeater) { const d = FACING_TO_D[m & 3]; return (sx + DIRS[d][0] === tx && sz + DIRS[d][2] === tz && sy === ty) ? 15 : 0; }
      if (OPAQUE[id] && strong.has(K(sx, sy, sz))) return 15;
      return 0;
    };
    // Wire flood fill.
    const power = new Map();
    const q = [];
    for (const [x, y, z, id] of comps) {
      if (id !== B.redstone_wire) continue;
      power.set(K(x, y, z), 0);
      let p = 0;
      for (let d = 0; d < 6; d++) p = Math.max(p, sourceInto(x + DIRS[d][0], y + DIRS[d][1], z + DIRS[d][2], x, y, z));
      if (p > 0) { power.set(K(x, y, z), p); q.push([x, y, z, p]); }
    }
    while (q.length) {
      const [x, y, z, p] = q.shift();
      if (p <= 1) continue;
      for (const d of [0, 1, 4, 5]) {
        const nx = x + DIRS[d][0], nz = z + DIRS[d][2];
        const cands = [[nx, y, nz]];
        if (!OPAQUE[world.getBlock(x, y + 1, z)]) cands.push([nx, y + 1, nz]);
        if (!OPAQUE[world.getBlock(nx, y, nz)]) cands.push([nx, y - 1, nz]);
        for (const [cx, cy, cz] of cands) {
          const k = K(cx, cy, cz);
          if (!power.has(k)) continue;
          if (power.get(k) < p - 1) { power.set(k, p - 1); q.push([cx, cy, cz, p - 1]); }
        }
      }
    }
    let changed = false;
    for (const [k, p] of power) {
      const [x, y, z] = parsePosKey(k);
      if ((world.getMeta(x, y, z) & 15) !== p) world.setBlock(x, y, z, B.redstone_wire, p, { update: false, record: false });
    }
    const wireAt = (x, y, z) => power.get(K(x, y, z)) || 0;
    /** Is a solid block weakly powered (by wire on top / wire beside it / strong)? */
    const blockPowered = (x, y, z) => {
      if (strong.has(K(x, y, z))) return true;
      if (!OPAQUE[world.getBlock(x, y, z)]) return false;
      if (wireAt(x, y + 1, z) > 0) return true;
      for (const d of [0, 1, 4, 5]) if (wireAt(x + DIRS[d][0], y, z + DIRS[d][2]) > 0) return true;
      return false;
    };
    /** Is a component at (x,y,z) receiving power from any side? */
    const powered = (x, y, z) => {
      for (let d = 0; d < 6; d++) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1], nz = z + DIRS[d][2];
        if (wireAt(nx, ny, nz) > 0 && d !== 3) return true;
        if (sourceInto(nx, ny, nz, x, y, z) > 0) return true;
        if (OPAQUE[world.getBlock(nx, ny, nz)] && blockPowered(nx, ny, nz)) return true;
      }
      return false;
    };
    for (const [x, y, z, id, m] of comps) {
      switch (id) {
        case B.redstone_lamp: if (powered(x, y, z)) { world.setBlock(x, y, z, B.lit_redstone_lamp); changed = true; } break;
        case B.lit_redstone_lamp: if (!powered(x, y, z)) { world.setBlock(x, y, z, B.redstone_lamp); changed = true; } break;
        case B.tnt: if (powered(x, y, z)) { world.setBlock(x, y, z, 0); Game.primeTNT(x, y, z, 4); } break;
        case B.oak_door: {
          if (m & 8) break;
          const pw = powered(x, y, z) || powered(x, y + 1, z);
          const k = K(x, y, z);
          const prev = this.doorState.get(k);
          this.doorState.set(k, pw);
          if (prev !== undefined && prev !== pw && ((m & 4) !== 0) !== pw) Game.toggleDoor(world, x, y, z, pw);
          break;
        }
        case B.piston: {
          const pw = powered(x, y, z), ext = (m & 8) !== 0;
          if (pw && !ext) { if (this.extend(world, x, y, z, m & 7)) changed = true; }
          else if (!pw && ext) { this.retract(world, x, y, z, m & 7); changed = true; }
          break;
        }
        case B.repeater: case B.powered_repeater: {
          const d = FACING_TO_D[m & 3], bx = x - DIRS[d][0], bz = z - DIRS[d][2];
          const input = wireAt(bx, y, bz) > 0 || sourceInto(bx, y, bz, x, y, z) > 0 || (OPAQUE[world.getBlock(bx, y, bz)] && blockPowered(bx, y, bz));
          const want = input ? B.powered_repeater : B.repeater;
          if (want !== id) { world.setBlock(x, y, z, want, m, { update: false }); changed = true; }
          break;
        }
        case B.redstone_torch: case B.unlit_redstone_torch: {
          const d = OPPOSITE[m & 7];
          const ax = x + DIRS[d][0], ay = y + DIRS[d][1], az = z + DIRS[d][2];
          const off = blockPowered(ax, ay, az) && !(strong.has(K(ax, ay, az)) && id === B.redstone_torch && ay === y + 1);
          const want = off ? B.unlit_redstone_torch : B.redstone_torch;
          if (want !== id) { world.setBlock(x, y, z, want, m, { update: false }); changed = true; }
          break;
        }
      }
    }
    if (changed) world.redstoneDirty = true;
  },
  extend(world, x, y, z, f) {
    const [dx, dy, dz] = DIRS[f];
    const line = [];
    let end = -1;
    for (let i = 1; i <= 13; i++) {
      const px = x + dx * i, py = y + dy * i, pz = z + dz * i;
      if (py < 0 || py >= HEIGHT) return false;
      const id = world.getBlock(px, py, pz);
      if (id === 0 || FLUID[id] || REPLACEABLE[id] || BLOCKS[id].plant) { end = i; break; }
      const def = BLOCKS[id];
      if (def.hardness < 0 || def.blastProof || id === B.piston_head || (id === B.piston && (world.getMeta(px, py, pz) & 8)) || world.tiles.has(posKey(px, py, pz)) || i > 12) return false;
      line.push([id, world.getMeta(px, py, pz)]);
    }
    if (end < 0) return false;
    const ex = x + dx * end, ey = y + dy * end, ez = z + dz * end;
    const eid = world.getBlock(ex, ey, ez);
    if (eid && !FLUID[eid]) Game.dropBlockItems(world, ex, ey, ez, eid, world.getMeta(ex, ey, ez), null);
    for (let j = line.length; j >= 1; j--) world.setBlock(x + dx * (j + 1), y + dy * (j + 1), z + dz * (j + 1), line[j - 1][0], line[j - 1][1]);
    world.setBlock(x + dx, y + dy, z + dz, B.piston_head, f);
    world.setBlock(x, y, z, B.piston, f | 8, { update: false });
    Sound.play('piston', x, y, z);
    return true;
  },
  retract(world, x, y, z, f) {
    const hx = x + DIRS[f][0], hy = y + DIRS[f][1], hz = z + DIRS[f][2];
    if (world.getBlock(hx, hy, hz) === B.piston_head) world.setBlock(hx, hy, hz, 0);
    world.setBlock(x, y, z, B.piston, f, { update: false });
    Sound.play('piston', x, y, z);
  },
};

// ─── Nether portals & dimension travel ────────────────────────────────────
const Portals = {
  empty(world, x, y, z) { const b = world.getBlock(x, y, z); return b === 0 || b === B.fire; },
  /** Try to light a portal whose interior contains (x,y,z). */
  tryLight(world, x, y, z) {
    for (const axis of [0, 1]) {
      const ax = axis === 0 ? [1, 0] : [0, 1];
      let by = y;
      while (by > y - 3 && this.empty(world, x, by - 1, z)) by--;
      if (world.getBlock(x, by - 1, z) !== B.obsidian) continue;
      let lx = x, lz = z, n = 0;
      while (this.empty(world, lx - ax[0], by, lz - ax[1]) && n < 21) { lx -= ax[0]; lz -= ax[1]; n++; }
      if (world.getBlock(lx - ax[0], by, lz - ax[1]) !== B.obsidian) continue;
      let w = 0;
      while (w < 22 && this.empty(world, lx + ax[0] * w, by, lz + ax[1] * w)) w++;
      if (w < 2 || w > 21 || world.getBlock(lx + ax[0] * w, by, lz + ax[1] * w) !== B.obsidian) continue;
      let h = 0;
      while (h < 22 && this.empty(world, lx, by + h, lz)) h++;
      if (h < 3 || h > 21) continue;
      let ok = true;
      for (let i = -1; i <= w && ok; i++) for (let j = -1; j <= h && ok; j++) {
        const px = lx + ax[0] * i, pz = lz + ax[1] * i, py = by + j;
        const edgeX = i === -1 || i === w, edgeY = j === -1 || j === h;
        if (edgeX && edgeY) continue; // corners optional
        if (edgeX || edgeY) { if (world.getBlock(px, py, pz) !== B.obsidian) ok = false; }
        else if (!this.empty(world, px, py, pz)) ok = false;
      }
      if (!ok) continue;
      for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) world.setBlock(lx + ax[0] * i, by + j, lz + ax[1] * i, B.nether_portal, axis, { update: false });
      Sound.play('portal', x, y, z);
      return true;
    }
    return false;
  },
  valid(world, x, y, z) {
    const axis = world.getMeta(x, y, z) & 1;
    const ok = (b) => b === B.nether_portal || b === B.obsidian;
    const h = axis === 0 ? [[1, 0], [-1, 0]] : [[0, 1], [0, -1]];
    for (const [dx, dz] of h) if (!ok(world.getBlock(x + dx, y, z + dz))) return false;
    return ok(world.getBlock(x, y + 1, z)) && ok(world.getBlock(x, y - 1, z));
  },
  /** Complete end-portal frame ring (12 frames with eyes) → fill the 3×3 centre. */
  tryActivateEnd(world, x, y, z) {
    for (let cx = x - 2; cx <= x + 2; cx++) for (let cz = z - 2; cz <= z + 2; cz++) {
      let ok = true;
      for (let dx = -2; dx <= 2 && ok; dx++) for (let dz = -2; dz <= 2 && ok; dz++) {
        if ((Math.abs(dx) === 2) === (Math.abs(dz) === 2)) continue;
        if (world.getBlock(cx + dx, y, cz + dz) !== B.end_portal_frame || !(world.getMeta(cx + dx, y, cz + dz) & 4)) ok = false;
      }
      if (!ok) continue;
      for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) world.setBlock(cx + dx, y, cz + dz, B.end_portal, 0, { update: false });
      Sound.play('portal', cx, y, cz);
      chat('The End portal has opened!', '#c8f');
      return true;
    }
    return false;
  },
  /** Overworld → End (onto an obsidian platform) or End → Overworld spawn. */
  travelEnd(player) {
    if (Game.world.dim === 'end') {
      Game.switchDimension('overworld', (w) => {
        Game.forceLoad(w, player.spawn[0], player.spawn[2], 1);
        const pos = player.spawn.slice();
        const tmp = { x: pos[0], y: pos[1], z: pos[2], w: 0.6, h: 1.8, aabb: Entity.prototype.aabb };
        while (tmp.y < HEIGHT - 2 && Physics.collides(w, tmp.aabb())) tmp.y += 1;
        return [tmp.x, tmp.y, tmp.z];
      });
      if (Game.world.dragonKilledMsg) chat('Thanks for playing!', '#c8f');
      return;
    }
    Game.switchDimension('end', (w) => {
      // Obsidian arrival platform out in the void, facing the island.
      const PX = 120;
      Game.forceLoad(w, PX, 0, 1);
      for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
        w.setBlock(PX + dx, 48, dz, B.obsidian);
        for (let dy = 1; dy <= 3; dy++) w.setBlock(PX + dx, 48 + dy, dz, 0);
      }
      Game.player.yaw = Math.PI / 2; Game.player.pitch = 0.15;
      return [PX + 0.5, 49, 0.5];
    });
    if (!Game.world.dragonKilled) Game.spawnDragon();
    chat('Entering The End…', '#c8f');
  },
  /** Teleport the player to the other dimension, finding or building a portal. */
  travel(player) {
    const from = Game.world;
    const to = from.dim === 'nether' ? 'overworld' : 'nether';
    const s = to === 'nether' ? 1 / 8 : 8;
    const tx = Math.floor(player.x * s), tz = Math.floor(player.z * s);
    Game.switchDimension(to, (w) => {
      Game.forceLoad(w, tx, tz, 2);
      // Look for an existing portal nearby.
      for (let r = 0; r <= 12; r++) for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
        if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
        for (let y = 1; y < HEIGHT - 1; y++) if (w.getBlock(tx + dx, y, tz + dz) === B.nether_portal && w.getBlock(tx + dx, y - 1, tz + dz) !== B.nether_portal) {
          return [tx + dx + 0.5, y, tz + dz + 0.5];
        }
      }
      // Build a new one: find a floor with head room, else make a platform.
      let py = -1;
      const top = to === 'nether' ? 100 : 110;
      for (let y = top; y > 8 && py < 0; y--) {
        let good = true;
        for (let i = -1; i <= 4 && good; i++) for (let k = -1; k <= 1 && good; k++) {
          if (!SOLID[w.getBlock(tx + i, y - 1, tz + k)] || FLUID[w.getBlock(tx + i, y - 1, tz + k)]) good = false;
          for (let j = 0; j < 5 && good; j++) if (w.getBlock(tx + i, y + j, tz + k) !== 0) good = false;
        }
        if (good) py = y;
      }
      if (py < 0) py = to === 'nether' ? 70 : Math.max(SEA_LEVEL + 2, w.topY(tx, tz) + 1);
      for (let i = -1; i <= 4; i++) for (let k = -1; k <= 1; k++) {
        w.setBlock(tx + i, py - 1, tz + k, B.obsidian);
        for (let j = 0; j < 5; j++) w.setBlock(tx + i, py + j, tz + k, 0);
      }
      for (let i = 0; i < 4; i++) for (let j = 0; j < 5; j++) {
        const frame = i === 0 || i === 3 || j === 0 || j === 4;
        w.setBlock(tx + i, py - 1 + j, tz, frame ? B.obsidian : B.nether_portal, frame ? 0 : 0, { update: false });
      }
      return [tx + 1.5, py, tz + 0.5];
    });
  },
};

// ─── Weather ──────────────────────────────────────────────────────────────
const Weather = {
  tick(state) {
    state.timer -= TICK;
    if (state.timer <= 0) {
      state.raining = !state.raining;
      state.timer = state.raining ? 120 + Math.random() * 360 : 300 + Math.random() * 900;
      if (state.raining) chat('It started to rain…', '#9cf');
    }
    state.strength += ((state.raining ? 1 : 0) - state.strength) * 0.01;
    // STUB: thunderstorms, lightning bolts and snow layer accumulation.
  },
  kind(world, player) {
    if (!world.hasSky) return 'none';
    const ch = world.chunkAt(Math.floor(player.x) >> 4, Math.floor(player.z) >> 4);
    if (!ch) return 'none';
    const b = ch.biome[(Math.floor(player.z) & 15) * 16 + (Math.floor(player.x) & 15)];
    const k = BIOME_PRECIP[b];
    if (k === 'rain' && player.y > 100) return 'snow';
    return k;
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// §12 SOUND — tiny procedural WebAudio synth (no audio files).
// Every game event calls Sound.play(name, x, y, z); swap this module for
// sample playback to use real sounds (STUB: pack sounds/*.ogg are ignored).
// ═══════════════════════════════════════════════════════════════════════════
const Sound = {
  ctx: null, master: null, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  noise(dur, freq, q, vol, type = 'bandpass', delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random()); src.stop(t + dur + 0.02);
  },
  tone(f0, f1, dur, vol, type = 'square', delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  MAT: { stone: [1800, 1.2], wood: [700, 2], grass: [1100, 0.6], gravel: [500, 0.8], sand: [2600, 0.5], glass: [3200, 3], wool: [350, 0.7], snow: [1500, 0.4], metal: [2400, 6] },
  material(id) { return (BLOCKS[id] && BLOCKS[id].sound) || 'stone'; },
  play(name, x, y, z, mat) {
    if (!this.ctx || SETTINGS.volume <= 0) return;
    const p = Game.player;
    let vol = SETTINGS.volume;
    if (p && x !== undefined) { const d = Math.hypot(p.x - x, p.y - y, p.z - z); vol *= Math.max(0, 1 - d / 28); }
    if (!(vol >= 0.01)) return; // also rejects NaN
    this.master.gain.value = 1;
    const M = this.MAT[mat] || this.MAT.stone;
    switch (name) {
      case 'dig': this.noise(0.09, M[0], M[1], vol * 0.25); break;
      case 'break': this.noise(0.22, M[0] * 0.8, M[1], vol * 0.45); if (mat === 'glass') this.tone(2400, 1200, 0.15, vol * 0.1, 'triangle'); break;
      case 'place': this.noise(0.12, M[0] * 0.9, M[1], vol * 0.4); break;
      case 'step': this.noise(0.07, M[0] * 0.7, M[1], vol * 0.12); break;
      case 'hurt': this.tone(420, 160, 0.18, vol * 0.25, 'sawtooth'); break;
      case 'mobhurt': this.tone(260, 120, 0.2, vol * 0.2, 'sawtooth'); break;
      case 'animalhurt': this.tone(700, 300, 0.15, vol * 0.2, 'square'); break;
      case 'death': this.tone(300, 60, 0.5, vol * 0.25, 'sawtooth'); break;
      case 'pop': this.tone(900, 1500, 0.06, vol * 0.18, 'sine'); break;
      case 'click': this.tone(1500, 1400, 0.03, vol * 0.2, 'square'); break;
      case 'eat': for (let i = 0; i < 3; i++) this.noise(0.06, 900, 1, vol * 0.3, 'bandpass', i * 0.12); break;
      case 'burp': this.tone(180, 90, 0.25, vol * 0.25, 'sawtooth'); break;
      case 'explode': this.noise(1.4, 180, 0.4, vol * 0.9, 'lowpass'); this.tone(90, 30, 0.8, vol * 0.5, 'sine'); break;
      case 'fuse': this.noise(0.8, 4000, 0.5, vol * 0.2, 'highpass'); break;
      case 'hiss': this.noise(1.2, 5000, 0.4, vol * 0.25, 'highpass'); break;
      case 'fizz': this.noise(0.5, 4500, 0.6, vol * 0.3, 'highpass'); break;
      case 'splash': this.noise(0.4, 1200, 0.5, vol * 0.4, 'lowpass'); break;
      case 'bow': this.tone(260, 520, 0.12, vol * 0.2, 'triangle'); break;
      case 'arrowhit': this.noise(0.08, 1500, 2, vol * 0.3); break;
      case 'door': this.noise(0.18, 500, 1.5, vol * 0.45); break;
      case 'piston': this.noise(0.15, 300, 1, vol * 0.4); this.tone(200, 120, 0.1, vol * 0.15, 'square'); break;
      case 'portal': this.tone(200, 800, 1.2, vol * 0.15, 'sine'); this.tone(203, 790, 1.2, vol * 0.15, 'sine'); break;
      case 'levelup': this.tone(660, 990, 0.25, vol * 0.2, 'triangle'); break;
      case 'oink': this.tone(300, 220, 0.18, vol * 0.25, 'sawtooth'); break;
      case 'moo': this.tone(150, 110, 0.6, vol * 0.25, 'sawtooth'); break;
      case 'baa': this.tone(420, 380, 0.4, vol * 0.2, 'square'); break;
      case 'cluck': this.tone(900, 700, 0.06, vol * 0.2, 'square'); this.tone(900, 700, 0.06, vol * 0.2, 'square', 0.1); break;
      case 'groan': this.tone(120, 80, 0.8, vol * 0.2, 'sawtooth'); break;
      case 'rattle': for (let i = 0; i < 4; i++) this.noise(0.04, 2500, 3, vol * 0.2, 'bandpass', i * 0.07); break;
      case 'hmm': this.tone(220, 180, 0.3, vol * 0.2, 'triangle'); break;
      case 'ghast': this.tone(700, 420, 0.7, vol * 0.25, 'sine'); this.tone(760, 380, 0.7, vol * 0.2, 'triangle'); break;
      case 'blaze': this.noise(0.6, 600, 0.6, vol * 0.3, 'lowpass'); break;
      case 'ender': this.tone(300, 900, 0.35, vol * 0.2, 'sine'); this.tone(900, 250, 0.35, vol * 0.15, 'sine', 0.1); break;
      case 'dragon': this.tone(90, 45, 1.6, vol * 0.5, 'sawtooth'); this.noise(1.4, 250, 0.5, vol * 0.4, 'lowpass'); break;
    }
  },
  stepAt(world, x, y, z) { this.play('step', x, y, z, this.material(world.getBlock(Math.floor(x), Math.floor(y), Math.floor(z)))); },
};

// ═══════════════════════════════════════════════════════════════════════════
// §13 INVENTORY, CRAFTING & CONTAINER SCREENS (DOM based)
// ---------------------------------------------------------------------------
// A screen is a list of "slot" objects {get, set, accept, output, group}.
// Mouse handling mirrors Minecraft: left click picks up / places / swaps /
// merges, right click splits or places one, shift-click quick-moves, and a
// press-drag-release onto another slot moves a stack. Number keys while
// hovering swap with the hotbar.
// ═══════════════════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const UI = {
  screen: null, cursor: null, dirty: true, slots: [], craft: null, craftW: 0, dragFrom: null, hover: null, tab: 'inv',

  slotEl(slot) {
    const el = document.createElement('div');
    el.className = 'slot';
    el.innerHTML = '<img class="px" alt=""><span class="cnt"></span><div class="dur hidden"><div></div></div>';
    el.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); Sound.init(); this.click(slot, e.button, e.shiftKey); this.render(); });
    el.addEventListener('mouseup', (e) => {
      if (e.button === 0 && this.dragFrom && this.dragFrom !== slot && this.cursor) { this.click(slot, 0, false); this.render(); }
      this.dragFrom = null;
    });
    el.addEventListener('mouseenter', () => { this.hover = slot; this.showTip(slot); });
    el.addEventListener('mouseleave', () => { if (this.hover === slot) this.hover = null; $('tooltip').classList.add('hidden'); });
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    slot.el = el;
    this.slots.push(slot);
    return el;
  },
  showTip(slot) {
    const s = slot.get();
    const tip = $('tooltip');
    if (!s) { tip.classList.add('hidden'); return; }
    const d = ITEMS[s.id];
    let t = d.display;
    if (d.durability) t += `  (${d.durability - (s.dmg || 0)}/${d.durability})`;
    if (d.food) t += `  +${d.food[0]} food`;
    if (d.tool && d.tool.type === 'sword') t += `  ${d.tool.dmg} dmg`;
    if (d.armor) t += `  +${d.armor.def} armor`;
    if (d.drink && d.drink.effect) t += `  (${titleCase(d.drink.effect[0])} ${Math.floor(d.drink.effect[1] / 60)}:${String(d.drink.effect[1] % 60).padStart(2, '0')})`;
    if (s.ench) t += '  [' + Object.entries(s.ench).map(([k, v]) => titleCase(k) + ' ' + ROMAN[v]).join(', ') + ']';
    tip.textContent = t; tip.classList.remove('hidden');
  },
  /** Fill a slot element's icon/count/durability. */
  paint(el, s) {
    const img = el.querySelector('img'), cnt = el.querySelector('.cnt'), dur = el.querySelector('.dur');
    img.classList.toggle('glint', !!(s && s.ench));
    if (!s) { img.style.visibility = 'hidden'; cnt.textContent = ''; dur.classList.add('hidden'); return; }
    const url = Tex.icon(s.id);
    if (img.getAttribute('src') !== url) img.src = url;
    img.style.visibility = 'visible';
    cnt.textContent = s.count > 1 ? s.count : '';
    const d = ITEMS[s.id];
    if (d.durability && s.dmg) {
      const f = 1 - s.dmg / d.durability;
      dur.classList.remove('hidden');
      dur.firstChild.style.width = (f * 100) + '%';
      dur.firstChild.style.background = `hsl(${f * 120},90%,45%)`;
    } else dur.classList.add('hidden');
  },
  render() {
    if (!this.screen) return;
    for (const s of this.slots) this.paint(s.el, s.get());
    const cs = $('cursorStack');
    if (this.cursor) {
      cs.classList.remove('hidden');
      cs.innerHTML = `<img class="px" src="${Tex.icon(this.cursor.id)}"><span class="cnt">${this.cursor.count > 1 ? this.cursor.count : ''}</span>`;
    } else cs.classList.add('hidden');
    if (this.screen.type === 'furnace') {
      const t = this.screen.tile;
      this.screen.flameEl.style.height = (t.burn > 0 ? clamp(t.burn / (t.burnMax || 1), 0, 1) * 100 : 0) + '%';
      this.screen.arrowEl.style.width = clamp((t.cook || 0) / SMELT_TIME, 0, 1) * 100 + '%';
    }
    if (this.screen.type === 'villager') this.renderTrades();
    if (this.screen.type === 'brewing') this.screen.brewEl.style.height = clamp(this.screen.tile.time / 20, 0, 1) * 100 + '%';
    if (this.screen.type === 'enchanting') this.renderEnchant();
    this.dirty = false;
  },
  /** Three deterministic enchant offers for an item (vanilla-like level costs). */
  enchOffers(stack) {
    const p = Game.player, rng = mulberry32(p.enchSeed ^ Math.imul(stack.id, 7919));
    const sh = Math.min(15, this.screen.shelves || 0);
    const base = 1 + Math.floor(rng() * 8) + Math.floor(sh / 2) + Math.floor(rng() * (sh + 1));
    const reqs = [Math.max(Math.floor(base / 3), 1), Math.floor(base * 2 / 3) + 1, Math.max(base, sh * 2)];
    const kinds = itemKinds(stack.id);
    const pool = Object.keys(ENCHANTS).filter((k) => ENCHANTS[k].kinds.some((x) => kinds.includes(x)));
    return reqs.map((req) => {
      const picks = {};
      const n = 1 + (rng() < req / 40 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        const name = pool[Math.floor(rng() * pool.length)], E = ENCHANTS[name];
        picks[name] = clamp(Math.ceil(req / 30 * E.max + rng() * 0.6), 1, E.max);
      }
      const first = Object.keys(picks)[0];
      return { req, picks, hint: titleCase(first) + ' ' + ROMAN[picks[first]] + (Object.keys(picks).length > 1 ? ' + …' : '') };
    });
  },
  renderEnchant() {
    const sc = this.screen, p = Game.player, item = this.ench[0], lap = this.ench[1];
    const key = (item ? item.id + ':' + (item.ench ? 1 : 0) : '-') + '|' + (lap ? lap.count : 0) + '|' + p.level + '|' + p.enchSeed;
    if (sc.optKey === key) return;
    sc.optKey = key;
    sc.opts.innerHTML = '';
    if (!item) { sc.opts.innerHTML = '<div style="width:300px;font-size:12px">Place a tool, weapon, bow or armor piece and lapis lazuli. More bookshelves around the table (2 blocks away) give stronger offers.</div>'; return; }
    this.enchOffers(item).forEach((o, i) => {
      const el = document.createElement('div'); el.className = 'enchOpt';
      const ok = p.creative || (p.level >= o.req && lap && lap.count >= i + 1);
      el.innerHTML = `<span>${o.hint}</span><span>Lv ${o.req} · ${i + 1} lapis</span>`;
      if (!ok) el.classList.add('off');
      el.onclick = () => {
        if (!ok || !this.ench[0]) return;
        this.ench[0].ench = Object.assign({}, o.picks);
        if (!p.creative) { p.level = Math.max(0, p.level - (i + 1)); lap.count -= i + 1; if (lap.count <= 0) this.ench[1] = null; }
        p.enchSeed = (Math.random() * 2 ** 31) | 0;
        Sound.play('levelup'); this.render();
      };
      sc.opts.appendChild(el);
    });
  },
  /** Player inventory slots (main 27 + hotbar 9). */
  playerSlots(container) {
    const p = Game.player;
    const wrap = document.createElement('div');
    const main = document.createElement('div'); main.className = 'grid'; main.style.gridTemplateColumns = 'repeat(9, var(--slot))';
    for (let i = 9; i < 36; i++) main.appendChild(this.slotEl({ get: () => p.inv[i], set: (s) => { p.inv[i] = s; }, accept: () => true, group: 'main', index: i }));
    const hot = document.createElement('div'); hot.className = 'grid'; hot.style.gridTemplateColumns = 'repeat(9, var(--slot))'; hot.style.marginTop = '8px';
    for (let i = 0; i < 9; i++) hot.appendChild(this.slotEl({ get: () => p.inv[i], set: (s) => { p.inv[i] = s; }, accept: () => true, group: 'hotbar', index: i }));
    wrap.appendChild(main); wrap.appendChild(hot);
    if (container) container.appendChild(wrap);
    return wrap;
  },
  craftGrid(w) {
    this.craft = new Array(w * w).fill(null); this.craftW = w;
    const row = document.createElement('div'); row.className = 'row';
    const g = document.createElement('div'); g.className = 'grid'; g.style.gridTemplateColumns = `repeat(${w}, var(--slot))`;
    for (let i = 0; i < w * w; i++) g.appendChild(this.slotEl({ get: () => this.craft[i], set: (s) => { this.craft[i] = s; }, accept: () => true, group: 'craft' }));
    const arrow = document.createElement('div'); arrow.className = 'arrow';
    const out = this.slotEl({ get: () => { const r = matchRecipe(this.craft, this.craftW); return r ? mkStack(r.out, r.count) : null; }, set: () => {}, accept: () => false, output: 'craft', group: 'result' });
    out.style.alignSelf = 'center';

  },
  /** Open a screen: 'inventory' | 'crafting' | 'furnace' | 'chest' | 'villager'. */
  open(type, ctx = {}) {
    this.close(true);
    this.slots = [];

    ov.addEventListener('contextmenu', (e) => e.preventDefault());

          b.onclick = () => { this.tab = k; this.open('inventory'); };

        const g = document.createElement('div'); g.className = 'creativeGrid';

        win.appendChild(g);
      } else {

          el.style.display = 'flex'; ac.appendChild(el);
        }
        const cw = document.createElement('div');
        const ch = document.createElement('h3'); ch.textContent = 'Crafting'; cw.appendChild(ch);
        cw.appendChild(this.craftGrid(2));
        top.appendChild(ac); top.appendChild(cw);
        win.appendChild(top);
        const sp = document.createElement('div'); sp.className = 'sp'; win.appendChild(sp);
      }
      h('Inventory');
      this.playerSlots(win);
    } else if (type === 'crafting') {
      h('Crafting Table');
      win.appendChild(this.craftGrid(3));
      const sp = document.createElement('div'); sp.className = 'sp'; win.appendChild(sp);
      h('Inventory');
      this.playerSlots(win);
    } else if (type === 'chest') {
      const t = ctx.tile;
      h(ctx.title || 'Chest');
      const g = document.createElement('div'); g.className = 'grid'; g.style.gridTemplateColumns = 'repeat(9, var(--slot))';
      for (let i = 0; i < 27; i++) g.appendChild(this.slotEl({ get: () => t.items[i], set: (s) => { t.items[i] = s; }, accept: () => true, group: 'container' }));
      win.appendChild(g);
      const sp = document.createElement('div'); sp.className = 'sp'; win.appendChild(sp);
      h('Inventory');
      this.playerSlots(win);
    } else if (type === 'furnace') {
      const t = ctx.tile;
      h('Furnace');
      const row = document.createElement('div'); row.className = 'row'; row.style.alignItems = 'center';
      const col = document.createElement('div');
      col.appendChild(this.slotEl({ get: () => t.input, set: (s) => { t.input = s; }, accept: () => true, group: 'container', role: 'input' }));
      const fl = document.createElement('div'); fl.className = 'flame'; const ff = document.createElement('div'); ff.className = 'fill'; fl.appendChild(ff); col.appendChild(fl);
      col.appendChild(this.slotEl({ get: () => t.fuel, set: (s) => { t.fuel = s; }, accept: (s) => !!FUEL[s.id], group: 'container', role: 'fuel' }));
      const ar = document.createElement('div'); ar.className = 'arrow'; const af = document.createElement('div'); af.className = 'fill'; ar.appendChild(af);
      const out = this.slotEl({ get: () => t.output, set: (s) => { t.output = s; }, accept: () => false, output: 'furnace', group: 'container' });
      row.appendChild(col); row.appendChild(ar); row.appendChild(out);
      win.appendChild(row);
      this.screen.flameEl = ff; this.screen.arrowEl = af;
      const sp = document.createElement('div'); sp.className = 'sp'; win.appendChild(sp);
      h('Inventory');
      this.playerSlots(win);
    } else if (type === 'brewing') {
      const t = ctx.tile;
      h('Brewing Stand  (fuel: blaze powder)');
      const row = document.createElement('div'); row.className = 'row'; row.style.alignItems = 'center'; row.style.gap = '8px';
      row.appendChild(this.slotEl({ get: () => t.fuel, set: (s) => { t.fuel = s; }, accept: (s) => s.id === I.blaze_powder, group: 'container', role: 'fuel' }));
      row.appendChild(this.slotEl({ get: () => t.ingredient, set: (s) => { t.ingredient = s; }, accept: (s) => BREW_INGREDIENTS.has(s.id), group: 'container', role: 'ingredient' }));
      const bar = document.createElement('div'); bar.className = 'brewBar'; const bf = document.createElement('div'); bf.className = 'fill'; bar.appendChild(bf);
      row.appendChild(bar);
      for (let i = 0; i < 3; i++) row.appendChild(this.slotEl({ get: () => t.bottles[i], set: (s) => { t.bottles[i] = s; }, accept: (s) => !!ITEMS[s.id].drink, group: 'container', role: 'bottle' }));
      win.appendChild(row);
      this.screen.brewEl = bf;
      const sp = document.createElement('div'); sp.className = 'sp'; win.appendChild(sp);
      h('Inventory');
      this.playerSlots(win);
    } else if (type === 'enchanting') {
      h(`Enchanting Table  (${ctx.shelves} bookshelves)`);
      this.ench = [null, null];
      const row = document.createElement('div'); row.className = 'row'; row.style.gap = '12px'; row.style.alignItems = 'flex-start';
      const col = document.createElement('div');
      col.appendChild(this.slotEl({ get: () => this.ench[0], set: (s) => { this.ench[0] = s; }, accept: (s) => itemKinds(s.id).length > 0 && !s.ench && s.count === 1, group: 'ench' }));
      col.appendChild(this.slotEl({ get: () => this.ench[1], set: (s) => { this.ench[1] = s; }, accept: (s) => s.id === I.lapis_lazuli, group: 'ench', role: 'lapis' }));
      const opts = document.createElement('div');
      row.appendChild(col); row.appendChild(opts);
      win.appendChild(row);
      this.screen.opts = opts;
      const sp = document.createElement('div'); sp.className = 'sp'; win.appendChild(sp);
      h('Inventory');
      this.playerSlots(win);
    } else if (type === 'villager') {
      h('Villager — trades');
      const list = document.createElement('div');
      this.screen.list = list; win.appendChild(list);
      const sp = document.createElement('div'); sp.className = 'sp'; win.appendChild(sp);
      h('Inventory');
      this.playerSlots(win);
    }
    root.appendChild(ov);
    if (document.pointerLockElement) document.exitPointerLock();
    this.render();
  },
  renderTrades() {
    const list = this.screen.list, p = Game.player;
    if (!list.children.length) {
      for (const tr of this.screen.trades) {
        const row = document.createElement('div'); row.className = 'trade';
        row.innerHTML = `<img class="px" width="32" height="32" src="${Tex.icon(I[tr[0]])}"> ×${tr[1]} &nbsp;→&nbsp; <img class="px" width="32" height="32" src="${Tex.icon(I[tr[2]])}"> ×${tr[3]} <span style="font-size:12px">${itemName(I[tr[2]])}</span>`;
        row.onclick = () => {
          if (p.count(I[tr[0]]) < tr[1] && !p.creative) { Sound.play('hmm'); return; }
          if (!p.creative) p.take(I[tr[0]], tr[1]);
          const left = p.give(I[tr[2]], tr[3]);
          if (left) Game.dropFromPlayer(mkStack(I[tr[2]], left));
          Sound.play('levelup'); this.render();
        };
        row.dataset.trade = tr.join(',');
        list.appendChild(row);
      }
    }
    [...list.children].forEach((row, i) => { const tr = this.screen.trades[i]; row.classList.toggle('off', !p.creative && p.count(I[tr[0]]) < tr[1]); });
  },
  close(silent) {
    const p = Game.player;
    const back = (s) => { if (!s || !p) return; const left = p.give(s.id, s.count, stackExtra(s)); if (left) Game.dropFromPlayer(Object.assign({}, s, { count: left })); };
    if (this.craft) for (const s of this.craft) back(s);
    if (this.ench) for (const s of this.ench) back(s);
    back(this.cursor);
    this.craft = null; this.cursor = null; this.ench = null;
    if (this.screen) { this.screen.ov.remove(); this.screen = null; }
    $('cursorStack').classList.add('hidden'); $('tooltip').classList.add('hidden');
    this.slots = [];
    if (!silent && Game.running && !Game.player.dead) Input.lock();
    UI.dirty = true;
  },
  /** Move a stack into a list of slots (merging first). Returns leftover stack or null. */
  moveInto(stack, targets) {
    for (const t of targets) {
      const s = t.get();
      if (s && sameItem(s, stack) && s.count < maxStack(s.id)) { const n = Math.min(maxStack(s.id) - s.count, stack.count); s.count += n; stack.count -= n; t.set(s); if (!stack.count) return null; }
    }
    for (const t of targets) if (!t.get() && t.accept(stack)) { t.set(stack); return null; }
    return stack;
  },
  quickMove(slot) {
    const s = slot.get(); if (!s) return;
    const g = (name) => this.slots.filter((x) => x.group === name);
    let targets;
    if (slot.group === 'container' || slot.group === 'craft' || slot.group === 'armor' || slot.group === 'ench') targets = [...g('hotbar'), ...g('main')];
    else if (ITEMS[s.id].armor && g('armor').length && !Game.player.armor[ITEMS[s.id].armor.slot]) targets = g('armor');
    else if (this.screen.type === 'chest') targets = g('container');
    else if (this.screen.type === 'brewing') targets = g('container').filter((x) => x.accept(s));
    else if (this.screen.type === 'enchanting') targets = g('ench').filter((x) => x.accept(s));
    else if (this.screen.type === 'furnace') targets = g('container').filter((x) => !x.output && (x.role === 'fuel' ? FUEL[s.id] && !SMELTING[s.id] : SMELTING[s.id]));
    else targets = slot.group === 'hotbar' ? g('main') : g('hotbar');
    if (!targets || !targets.length) targets = slot.group === 'hotbar' ? g('main') : g('hotbar');
    slot.set(null);
    const left = this.moveInto(s, targets);
    slot.set(left);
  },
  takeOutput(slot, shift, button) {
    if (slot.output === 'creative') {
      if (this.cursor) { this.cursor = null; return; }
      this.cursor = mkStack(slot.id, button === 2 ? 1 : maxStack(slot.id));
      if (shift) { Game.player.give(slot.id, maxStack(slot.id)); this.cursor = null; }
      return;
    }
    if (slot.output === 'furnace') {
      const s = slot.get(); if (!s) return;
      if (shift) { slot.set(this.moveInto(s, [...this.slots.filter((x) => x.group === 'hotbar'), ...this.slots.filter((x) => x.group === 'main')])); return; }
      if (!this.cursor) { this.cursor = s; slot.set(null); }
      else if (sameItem(this.cursor, s) && this.cursor.count + s.count <= maxStack(s.id)) { this.cursor.count += s.count; slot.set(null); }
      return;
    }
    // Crafting result.
    const craftOnce = () => {
      const r = matchRecipe(this.craft, this.craftW);
      if (!r) return null;
      for (let i = 0; i < this.craft.length; i++) {
        const c = this.craft[i];
        if (!c) continue;
        if (c.id === I.water_bucket || c.id === I.lava_bucket) this.craft[i] = mkStack(I.bucket, 1);
        else if (--c.count <= 0) this.craft[i] = null;
      }
      return mkStack(r.out, r.count);
    };
    if (shift) {
      const first = matchRecipe(this.craft, this.craftW);
      for (let n = 0; n < 64; n++) {
        const r = matchRecipe(this.craft, this.craftW);
        if (!r || r !== first) break;
        const res = craftOnce();
        const left = Game.player.give(res.id, res.count);
        if (left) { Game.dropFromPlayer(mkStack(res.id, left)); break; }
      }
      Sound.play('click');
      return;
    }
    const r = matchRecipe(this.craft, this.craftW);
    if (!r) return;
    if (this.cursor && (this.cursor.id !== r.out || this.cursor.count + r.count > maxStack(r.out) || ITEMS[r.out].durability)) return;
    const res = craftOnce();
    if (this.cursor) this.cursor.count += res.count; else this.cursor = res;
    Sound.play('click');
  },
  click(slot, button, shift) {
    if (slot.output) { this.takeOutput(slot, shift, button); UI.dirty = true; return; }
    if (shift) { this.quickMove(slot); UI.dirty = true; return; }
    const s = slot.get(), c = this.cursor;
    if (button === 0) {
      if (!c) { if (s) { this.cursor = s; slot.set(null); this.dragFrom = slot; } }
      else if (!s) { if (slot.accept(c)) { slot.set(c); this.cursor = null; } }
      else if (sameItem(s, c)) { const n = Math.min(maxStack(s.id) - s.count, c.count); s.count += n; c.count -= n; slot.set(s); if (!c.count) this.cursor = null; }
      else if (slot.accept(c)) { slot.set(c); this.cursor = s; }
    } else if (button === 2) {
      if (!c) { if (s) { const half = Math.ceil(s.count / 2); this.cursor = Object.assign({}, s, { count: half }); s.count -= half; slot.set(s.count ? s : null); } }
      else if (!s) { if (slot.accept(c)) { slot.set(Object.assign({}, c, { count: 1 })); c.count--; if (!c.count) this.cursor = null; } }
      else if (sameItem(s, c) && s.count < maxStack(s.id)) { s.count++; c.count--; slot.set(s); if (!c.count) this.cursor = null; }
    }
    UI.dirty = true;
  },
  /** Number key while hovering: swap with hotbar slot n. */
  hotkey(n) {
    const slot = this.hover;
    if (!slot || slot.output) return;
    const p = Game.player, s = slot.get(), h = p.inv[n];
    if (h && !slot.accept(h)) return;
    slot.set(h); p.inv[n] = s;
    this.render();
  },
};
