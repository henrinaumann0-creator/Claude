// §14 HUD
// ═══════════════════════════════════════════════════════════════════════════
const HUD = {
  init() {
    const hb = $('hotbar');
    hb.innerHTML = '';
    this.hot = [];
    for (let i = 0; i < 9; i++) {
      const el = document.createElement('div'); el.className = 'slot';
      el.innerHTML = '<img class="px" alt=""><span class="cnt"></span><div class="dur hidden"><div></div></div>';
      el.style.pointerEvents = 'none';
      hb.appendChild(el); this.hot.push(el);
    }
    const mk = (parent, n) => { const p = $(parent); p.innerHTML = ''; const a = []; for (let i = 0; i < n; i++) { const im = document.createElement('img'); im.className = 'px'; p.appendChild(im); a.push(im); } return a; };
    this.hearts = mk('hearts', 10); this.foods = mk('food', 10); this.airs = mk('air', 10); this.armors = mk('armorBar', 10);
    this.last = {};
    this.debugOn = true;
    this.fps = 0; this.frames = 0; this.fpsT = 0;
  },
  flashHurt() { const e = $('hurt'); e.style.opacity = '1'; setTimeout(() => (e.style.opacity = '0'), 180); },
  showItemName(s) {
    const e = $('itemName');
    e.textContent = s ? itemName(s.id) : '';
    e.style.opacity = s ? '1' : '0';
    clearTimeout(this.nameT); this.nameT = setTimeout(() => (e.style.opacity = '0'), 1800);
  },
  update(dt) {
    const p = Game.player, w = Game.world;
    this.frames++; this.fpsT += dt;
    if (this.fpsT >= 0.5) { this.fps = Math.round(this.frames / this.fpsT); this.frames = 0; this.fpsT = 0; }
    // Hotbar.
    if (UI.dirty || this.last.sel !== p.selected || this.last.tv !== Tex.version) {
      for (let i = 0; i < 9; i++) { UI.paint(this.hot[i], p.inv[i]); this.hot[i].classList.toggle('sel', i === p.selected); }
      if (this.last.sel !== p.selected) this.showItemName(p.held);
      this.last.sel = p.selected; this.last.tv = Tex.version;
      if (UI.screen) UI.render();
      UI.dirty = false;
    }
    const surv = Game.mode === 'survival';
    $('bars').style.visibility = surv ? 'visible' : 'hidden';
    $('xpbar').style.visibility = surv ? 'visible' : 'hidden';
    const U = Tex.extra.hudURL;
    const hp = Math.ceil(p.health), fd = p.food, air = Math.ceil(p.air / 30);
    if (this.last.hp !== hp || this.last.u !== U) {
      this.hearts.forEach((im, i) => { const v = hp - i * 2; im.src = v >= 2 ? U.heartFull : v === 1 ? U.heartHalf : U.heartEmpty; });
      this.last.hp = hp;
    }
    if (this.last.fd !== fd || this.last.u !== U) {
      this.foods.forEach((im, i) => { const v = fd - i * 2; im.src = v >= 2 ? U.foodFull : v === 1 ? U.foodHalf : U.foodEmpty; });
      this.last.fd = fd;
    }
    if (this.last.air !== air || this.last.u !== U) {
      this.airs.forEach((im, i) => { im.src = U.air; im.style.visibility = p.air < 300 && i < air ? 'visible' : 'hidden'; });
      this.last.air = air;
    }
    const ap = p.armorPoints();
    if (this.last.ap !== ap || this.last.u !== U) {
      this.armors.forEach((im, i) => { const v = ap - i * 2; im.src = v >= 2 ? U.armorFull : v === 1 ? U.armorHalf : U.armorEmpty; im.style.visibility = ap > 0 ? 'visible' : 'hidden'; });
      this.last.ap = ap;
    }
    if (this.frames === 0) {
      $('effects').innerHTML = Object.entries(p.effects).map(([k, e]) => `<div>${titleCase(k)}${e.amp ? ' ' + ROMAN[e.amp + 1] : ''} ${Math.floor(e.t / 60)}:${String(Math.floor(e.t % 60)).padStart(2, '0')}</div>`).join('');
    }
    this.last.u = U;
    const need = p.level < 16 ? 2 * p.level + 7 : 5 * p.level - 38;
    $('xpbar').firstChild.style.width = (p.xp / need * 100) + '%';
    // Overlays.
    $('underwater').style.opacity = p.eyeInWater ? '1' : '0';
    $('fireOverlay').style.opacity = p.fire > 0 && !p.creative ? '1' : '0';
    $('portalOverlay').style.opacity = String(clamp(p.portalTime / 4, 0, 0.9));
    // Attack cooldown indicator.
    const cd = Input.attackCooldown();
    $('cooldown').style.display = cd < 1 ? 'block' : 'none';
    $('cooldown').firstChild.style.width = (cd * 100) + '%';
    const dr = Game.dragon;
    $('bossbar').classList.toggle('hidden', !dr || dr.dead || Game.world.dim !== 'end');
    if (dr && !dr.dead) $('bossFill').style.width = clamp(dr.health / dr.maxHealth, 0, 1) * 100 + '%';
    $('modeTag').textContent = (Game.mode === 'creative' ? 'CREATIVE' : 'SURVIVAL') + (p.flying ? ' · flying' : '') + (w.dim === 'nether' ? ' · NETHER' : w.dim === 'end' ? ' · THE END' : '');
    // Debug (F3).
    const dbg = $('debug');
    dbg.style.display = this.debugOn ? 'block' : 'none';
    if (this.debugOn && this.frames === 0) {
      const bx = Math.floor(p.x), by = Math.floor(p.y), bz = Math.floor(p.z);
      const ch = w.chunkAt(bx >> 4, bz >> 4);
      const biome = ch ? BIOME_NAMES[ch.biome[(bz & 15) * 16 + (bx & 15)]] : '?';
      const t = (Game.time + 6000) % DAY_TICKS, hh = Math.floor(t / 1000), mm = Math.floor((t % 1000) / 1000 * 60);
      let meshed = 0; for (const c of w.chunks.values()) if (c.meshed) meshed++;
      const f = ['S', 'W', 'N', 'E'][Input.lookFacing()];
      dbg.textContent = `BlockCraft  ${this.fps} fps\n` +
        `XYZ: ${p.x.toFixed(2)} / ${p.y.toFixed(2)} / ${p.z.toFixed(2)}\n` +
        `Block: ${bx} ${by} ${bz}  Chunk: ${bx >> 4} ${bz >> 4}  Facing: ${f}\n` +
        `Biome: ${biome}  Dim: ${w.dim}\n` +
        `Time: Day ${Math.floor(Game.totalTicks / DAY_TICKS) + 1}, ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}${Game.weather.raining ? '  (rain)' : ''}\n` +
        `Light: sky ${w.getSky(bx, by + 1, bz)} block ${w.getBlockLight(bx, by + 1, bz)}\n` +
        `Chunks: ${meshed}/${w.chunks.size}  Entities: ${Game.entities.length}\n` +
        `Seed: ${w.seed}   [F3] hide`;
    }
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// §15 INPUT & INTERACTION — keyboard/mouse, mining, placing, using, combat
// ═══════════════════════════════════════════════════════════════════════════
const Input = {
  keys: new Set(), mouseL: false, mouseR: false, lastSpace: 0, lastW: 0, sprintTap: false,
  mining: null, useTimer: 0, eatTime: 0, bowTime: 0, swing: 0, target: null, targetMob: null, breakRepeat: 0,
  init() {
    const canvas = Renderer.gl.domElement;
    canvas.addEventListener('click', () => { if (Game.running && !UI.screen && !Game.player.dead) this.lock(); });
    document.addEventListener('pointerlockchange', () => {
      if (!document.pointerLockElement && Game.running && !UI.screen && !Game.player.dead && !Game.inCommand) Menus.pause(true);
    });
    document.addEventListener('mousemove', (e) => {
      if (UI.screen) { const cs = $('cursorStack'); cs.style.left = (e.clientX - 18) + 'px'; cs.style.top = (e.clientY - 18) + 'px'; const tip = $('tooltip'); tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY - 28) + 'px'; }
      if (!this.locked()) return;
      const p = Game.player, s = 0.0022 * SETTINGS.sensitivity;
      p.yaw -= e.movementX * s;
      p.pitch = clamp(p.pitch - e.movementY * s, -Math.PI / 2 + 0.01, Math.PI / 2 - 0.01);
    });
    document.addEventListener('mousedown', (e) => {
      Sound.init();
      if (!this.locked()) return;
      if (e.button === 0) { this.mouseL = true; this.onAttackPress(); }
      else if (e.button === 2) { this.mouseR = true; this.useTimer = 0; this.onUse(true); }
      else if (e.button === 1) { e.preventDefault(); this.pickBlock(); }
    });
    document.addEventListener('mouseup', (e) => {
      if (e.button === 0) { this.mouseL = false; this.mining = null; Renderer.showCrack(0, 0, 0, -1); }
      if (e.button === 2) { this.mouseR = false; this.releaseUse(); }
      UI.dragFrom = null;
    });
    document.addEventListener('contextmenu', (e) => { if (this.locked() || UI.screen) e.preventDefault(); });
    document.addEventListener('wheel', (e) => {
      if (!this.locked()) return;
      const p = Game.player;
      p.selected = (p.selected + (e.deltaY > 0 ? 1 : 8)) % 9;
      this.eatTime = 0; this.bowTime = 0;
    }, { passive: true });
    document.addEventListener('keydown', (e) => this.keyDown(e));
    document.addEventListener('keyup', (e) => { this.keys.delete(e.code); if (e.code === 'KeyW') this.sprintTap = false; });
    window.addEventListener('blur', () => { this.keys.clear(); this.mouseL = this.mouseR = false; });
  },
  locked() { return document.pointerLockElement === Renderer.gl.domElement; },
  lock() { try { const r = Renderer.gl.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* ignore */ } },
  state() {
    const k = this.keys, L = this.locked();
    return {
      forward: L && k.has('KeyW'), back: L && k.has('KeyS'), left: L && k.has('KeyA'), right: L && k.has('KeyD'),
      jump: L && k.has('Space'), sneak: L && (k.has('ShiftLeft') || k.has('ShiftRight')),
      sprint: L && (k.has('ControlLeft') || k.has('ControlRight') || this.sprintTap),
    };
  },
  keyDown(e) {
    if (!Game.running) return;
    const p = Game.player;
    if (e.code === 'F3') { e.preventDefault(); HUD.debugOn = !HUD.debugOn; return; }
    if (UI.screen) {
      if (e.code === 'KeyE' || e.code === 'Escape') { e.preventDefault(); UI.close(); }
      else if (/^Digit[1-9]$/.test(e.code)) UI.hotkey(+e.code.slice(5) - 1);
      return;
    }
    if (!this.locked()) return;
    this.keys.add(e.code);
    const now = performance.now();
    if (/^Digit[1-9]$/.test(e.code)) { p.selected = +e.code.slice(5) - 1; this.eatTime = 0; }
    switch (e.code) {
      case 'KeyE': UI.open('inventory'); break;
      case 'KeyQ': this.dropHeld(e.ctrlKey); break;
      case 'Space':
        if (!e.repeat) {
          if (p.creative && now - this.lastSpace < 300) { p.flying = !p.flying; p.vy = 0; chat(p.flying ? 'Flying enabled' : 'Flying disabled'); this.lastSpace = 0; }
          else this.lastSpace = now;
        }
        e.preventDefault();
        break;
      case 'KeyW': if (!e.repeat) { if (now - this.lastW < 280) this.sprintTap = true; this.lastW = now; } break;
      case 'F4': e.preventDefault(); Game.setMode(Game.mode === 'creative' ? 'survival' : 'creative'); break;
      case 'Slash': case 'KeyT': e.preventDefault(); Game.command(); break;
      case 'F1': e.preventDefault(); $('hud').classList.toggle('hidden'); break;
    }
  },
  lookDir() {
    const p = Game.player, cp = Math.cos(p.pitch);
    return [-Math.sin(p.yaw) * cp, Math.sin(p.pitch), -Math.cos(p.yaw) * cp];
  },
  /** Horizontal facing the player looks at: 0 south, 1 west, 2 north, 3 east. */
  lookFacing() {
    const p = Game.player, fx = -Math.sin(p.yaw), fz = -Math.cos(p.yaw);
    if (Math.abs(fx) > Math.abs(fz)) return fx > 0 ? 3 : 1;
    return fz > 0 ? 0 : 2;
  },
  attackCooldown() {
    const p = Game.player; if (!p) return 1;
    const t = toolOf(p.held);
    const cd = t && t.cooldown ? t.cooldown : 0.25;
    return clamp(p.attackTimer / cd, 0, 1);
  },
  /** Update targeted block/mob every frame. */
  updateTarget() {
    const p = Game.player, w = Game.world;
    const [dx, dy, dz] = this.lookDir();
    const ox = p.x, oy = p.y + p.eye, oz = p.z;
    const reach = p.creative ? 5 : 4.5;
    const hit = raycast(w, ox, oy, oz, dx, dy, dz, reach);
    let mob = null, md = hit ? hit.dist : reach;
    for (const e of Game.entities) {
      if (!(e instanceof Mob) || e.deathTime >= 0) continue;
      const r = rayBox(ox, oy, oz, dx, dy, dz, e.aabb());
      if (r && r.t < md) { md = r.t; mob = e; }
    }
    this.targetMob = mob;
    this.target = mob ? null : hit;
    Renderer.showSelection(this.target);
  },
  onAttackPress() {
    const p = Game.player;
    this.swing = 1;
    // Punch fireballs back.
    const [ldx, ldy, ldz] = this.lookDir();
    for (const e of Game.entities) {
      if (!(e instanceof Fireball) || e.dead) continue;
      const r = rayBox(p.x, p.y + p.eye, p.z, ldx, ldy, ldz, [e.x - 0.8, e.y - 0.8, e.z - 0.8, e.x + 0.8, e.y + 0.8, e.z + 0.8]);
      if (r && r.t < 4.5) { e.deflect([ldx, ldy, ldz]); Sound.play('arrowhit', e.x, e.y, e.z); return; }
    }
    if (this.targetMob) { Game.attack(this.targetMob); return; }
    if (this.target && p.creative) { Game.playerBreak(this.target.x, this.target.y, this.target.z); this.breakRepeat = 0.25; }
  },
  /** Mining progress while the left button is held (survival). */
  updateMining(dt) {
    const p = Game.player;
    if (!this.mouseL || !this.locked() || p.dead) { this.mining = null; Renderer.showCrack(0, 0, 0, -1); return; }
    this.swing = Math.max(this.swing, 0.6);
    const t = this.target;
    if (!t) { this.mining = null; Renderer.showCrack(0, 0, 0, -1); return; }
    if (p.creative) {
      this.breakRepeat -= dt;
      if (this.breakRepeat <= 0) { Game.playerBreak(t.x, t.y, t.z); this.breakRepeat = 0.25; }
      return;
    }
    const m = this.mining;
    if (!m || m.x !== t.x || m.y !== t.y || m.z !== t.z || m.id !== t.id) {
      this.mining = { x: t.x, y: t.y, z: t.z, id: t.id, progress: 0, sound: 0 };
      return;
    }
    const def = BLOCKS[t.id];
    let pen = 1;
    if (p.eyeInWater) pen *= 5;
    if (!p.onGround && !p.flying && !p.inWater && !p.onLadder) pen *= 5;
    const bt = breakTime(def, p.held, pen);
    m.progress += dt / bt;
    m.sound -= dt;
    if (m.sound <= 0) {
      m.sound = 0.22;
      Sound.play('dig', t.x, t.y, t.z, def.sound);
      const col = Tex.avgColor[Tex.blockTiles[t.id][2]] || [0.5, 0.5, 0.5];
      Renderer.emit(t.x + 0.5 + Math.random() * 0.2, t.y + 0.9, t.z + 0.5, 2, col, 0.9, 2, 12, 0.5);
    }
    p.addExhaustion(0.005 * dt);
    if (m.progress >= 1) { Game.playerBreak(t.x, t.y, t.z); this.mining = null; Renderer.showCrack(0, 0, 0, -1); }
    else Renderer.showCrack(t.x, t.y, t.z, Math.floor(m.progress * 10));
  },
  onUse(first) {
    const p = Game.player;
    if (p.dead) return;
    const held = p.held, hd = held && ITEMS[held.id];
    if (hd && ((hd.food && (p.food < 20 || p.creative)) || hd.drink) && !(this.target && Game.isInteractable(this.target.id) && !p.sneaking)) { this.eatTime = 0.0001; return; }
    if (hd && hd.use === 'bow') { this.bowTime = 0.0001; return; }
    Game.use(this.target, this.targetMob, first);
    this.swing = 1;
  },
  releaseUse() {
    const p = Game.player;
    if (this.bowTime > 0 && p.held && p.held.id === I.bow) Game.shootBow(this.bowTime);
    this.bowTime = 0; this.eatTime = 0;
  },
  updateUse(dt) {
    const p = Game.player;
    if (!this.mouseR || !this.locked() || p.dead) return;
    const held = p.held, hd = held && ITEMS[held.id];
    if (this.eatTime > 0) {
      if (!hd || !(hd.food || hd.drink)) { this.eatTime = 0; return; }
      this.eatTime += dt;
      if (Math.random() < 0.3) Renderer.emit(p.x - Math.sin(p.yaw) * 0.4, p.y + 1.4, p.z - Math.cos(p.yaw) * 0.4, 1, Tex.avgColor[0] ? [0.8, 0.6, 0.4] : [1, 1, 1], 0.2, 1.5, 10, 0.4);
      if (Math.floor(this.eatTime * 5) !== Math.floor((this.eatTime - dt) * 5)) Sound.play('eat', p.x, p.y, p.z);
      if (this.eatTime >= 1.6) { Game.eat(); this.eatTime = 0; }
      return;
    }
    if (this.bowTime > 0) { this.bowTime += dt; return; }
    this.useTimer += dt;
    if (this.useTimer >= 0.25) { this.useTimer = 0; this.onUse(false); }
  },
  dropHeld(all) {
    const p = Game.player, s = p.held;
    if (!s) return;
    const n = all ? s.count : 1;
    Game.dropFromPlayer(Object.assign({}, s, { count: n }));
    s.count -= n; if (s.count <= 0) p.inv[p.selected] = null;
    UI.dirty = true;
  },
  pickBlock() {
    const t = this.target, p = Game.player;
    if (!t) return;
    let id = t.id;
    const map = { [B.lit_furnace]: B.furnace, [B.wheat]: I.wheat_seeds, [B.redstone_wire]: I.redstone, [B.oak_door]: I.oak_door_item, [B.repeater]: I.repeater_item, [B.powered_repeater]: I.repeater_item, [B.lit_redstone_lamp]: B.redstone_lamp, [B.unlit_redstone_torch]: B.redstone_torch };
    if (map[id] !== undefined) id = map[id];
    if (!ITEMS[id] || ITEMS[id].noItem) return;
    for (let i = 0; i < 9; i++) if (p.inv[i] && p.inv[i].id === id) { p.selected = i; return; }
    if (p.creative) { const slot = p.inv[p.selected] ? (p.inv.findIndex((s, i) => i < 9 && !s) + 1 || p.selected + 1) - 1 : p.selected; p.selected = slot; p.inv[slot] = mkStack(id, maxStack(id)); UI.dirty = true; }
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// §16 PERSISTENCE — localStorage (and JSON export/import)
// Worlds are stored as seed + per-chunk edit lists, so saves stay small.
// ═══════════════════════════════════════════════════════════════════════════
const SAVE_KEY = 'blockcraft_world';
const Persist = {
  serialize() {
    const g = Game, p = g.player;
    const worlds = {};
    for (const [dim, w] of Object.entries(g.worlds)) {
      const edits = {};
      for (const [k, m] of w.edits) { const a = []; for (const [i, v] of m) a.push(i, v); edits[k] = a; }
      const tiles = {};
      for (const [k, t] of w.tiles) tiles[k] = t;
      worlds[dim] = { edits, tiles, struct: [...w.structSpawned], dragonKilled: w.dragonKilled, crystalsDead: [...w.crystalsDead] };
    }
    return {
      v: 1, seed: g.seed, mode: g.mode, time: g.time, totalTicks: g.totalTicks, dim: g.world.dim,
      weather: { raining: g.weather.raining, timer: g.weather.timer },
      player: { x: p.x, y: p.y, z: p.z, yaw: p.yaw, pitch: p.pitch, health: p.health, food: p.food, sat: p.sat, xp: p.xp, level: p.level, spawn: p.spawn, inv: p.inv, selected: p.selected, flying: p.flying, armor: p.armor, effects: p.effects, enchSeed: p.enchSeed },
      worlds,
    };
  },
  restoreWorld(w, data) {
    if (!data) return;
    for (const k in data.edits) {
      const a = data.edits[k], m = new Map();
      for (let i = 0; i < a.length; i += 2) m.set(a[i], a[i + 1]);
      w.edits.set(Number(k), m);
    }
    for (const k in data.tiles) w.tiles.set(k, data.tiles[k]);
    for (const k of data.struct || []) w.structSpawned.add(k);
    w.dragonKilled = !!data.dragonKilled;
    for (const k of data.crystalsDead || []) w.crystalsDead.add(k);
  },
  save(silent) {
    if (!Game.running) return false;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.serialize()));
      if (!silent) chat('World saved.', '#afa');
      return true;
    } catch (e) {
      chat('Could not save to localStorage (' + (e.name || e) + '). Use Export JSON instead.', '#f88');
      return false;
    }
  },
  load() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  exportFile() {
    const blob = new Blob([JSON.stringify(this.serialize())], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `blockcraft-${Game.seed}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// §17 GAME LOOP & BOOTSTRAP
// ═══════════════════════════════════════════════════════════════════════════
const Game = {
  running: false, paused: false, world: null, worlds: {}, player: null, entities: [], mode: 'survival',
  time: 0, totalTicks: 0, seed: 0, acc: 0, weather: { raining: false, strength: 0, timer: 600 }, spiral: null, spiralR: -1, unloadTimer: 0,

  // ─── helpers used by many systems ─────────────────────────────────────
  dropItem(x, y, z, stack, vx, vy, vz) {
    if (!stack || stack.count <= 0) return;
    const e = new ItemEntity(x, y, z, stack, vx !== undefined ? vx : (Math.random() - 0.5) * 2, vy !== undefined ? vy : 3, vz !== undefined ? vz : (Math.random() - 0.5) * 2);
    this.entities.push(e);
  },
  dropFromPlayer(stack) {
    const p = this.player, [dx, dy, dz] = Input.lookDir();
    this.dropItem(p.x + dx * 0.3, p.y + p.eye - 0.3, p.z + dz * 0.3, Object.assign({}, stack), dx * 5, dy * 5 + 2, dz * 5);
    const e = this.entities[this.entities.length - 1];
    if (e) e.pickupDelay = 1.5;
  },
  dropBlockItems(world, x, y, z, id, meta, tool) {
    const def = BLOCKS[id];
    if (!def) return;
    let drops;
    const t = toolOf(tool);
    if (t && t.type === 'shears' && (LEAVES[id] || id === B.short_grass || id === B.fern || id === B.dead_bush)) drops = [[id, 1]];
    else if (def.drop === undefined) drops = def.noItem ? [] : [[id, 1]];
    else if (def.drop === null) drops = [];
    else drops = def.drop({ rng: Math.random, tool, meta });
    for (const [i, n] of drops) if (n > 0 && ITEMS[i] && !ITEMS[i].noItem) this.dropItem(x + 0.5, y + 0.4, z + 0.5, mkStack(i, n));
  },
  /** Break a block without a player (support lost, leaves decay, water). */
  breakBlockNatural(world, x, y, z) {
    const id = world.getBlock(x, y, z), meta = world.getMeta(x, y, z);
    if (!id) return;
    world.setBlock(x, y, z, 0);
    if (id === B.oak_door) { const oy = (meta & 8) ? y - 1 : y + 1; if (world.getBlock(x, oy, z) === B.oak_door) world.setBlock(x, oy, z, 0); }
    this.dropBlockItems(world, x, y, z, id, meta, null);
  },
  spillTile(t, x, y, z) {
    const items = t.type === 'chest' ? t.items : t.type === 'furnace' ? [t.input, t.fuel, t.output] : t.type === 'brewing' ? [...t.bottles, t.ingredient, t.fuel] : [];
    for (const s of items) if (s) this.dropItem(x + 0.5, y + 0.5, z + 0.5, s);
    if (UI.screen && UI.screen.tile === t) UI.close();
  },
  primeTNT(x, y, z, fuse) { this.entities.push(new PrimedTNT(x, y, z, fuse)); },
  spawnMob(type, x, y, z) { const m = type === 'ender_dragon' ? new EnderDragon(x, y, z) : new Mob(type, x, y, z); this.entities.push(m); if (type === 'ender_dragon') this.dragon = m; return m; },
  growTree(world, x, y, z, type) {
    // Check room, then stamp the same tree shapes as the generator.
    for (let i = 1; i < 6; i++) if (world.getBlock(x, y + i, z) !== 0 && !LEAVES[world.getBlock(x, y + i, z)]) return false;
    const tmp = new Chunk(0, 0);
    const lx = 8, lz = 8, ly = 60;
    world.gen.tree ? world.gen.tree(tmp, type, lx, ly, lz, hash3(x, y, z, 1)) : OverworldGen.prototype.tree.call(null, tmp, type, lx, ly, lz, hash3(x, y, z, 1));
    world.setBlock(x, y, z, 0);
    for (let dy = 0; dy < 14; dy++) for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) {
      const id = tmp.blocks[idx(lx + dx, ly + dy, lz + dz)];
      if (!id) continue;
      const cur = world.getBlock(x + dx, y + dy, z + dz);
      if (cur === 0 || REPLACEABLE[cur] || LEAVES[cur] || BLOCKS[cur].plant) world.setBlock(x + dx, y + dy, z + dz, id);
    }
    return true;
  },
  toggleDoor(world, x, y, z, open) {
    let meta = world.getMeta(x, y, z);
    if (meta & 8) { y--; meta = world.getMeta(x, y, z); }
    if (world.getBlock(x, y, z) !== B.oak_door) return;
    const nm = open === undefined ? meta ^ 4 : (open ? meta | 4 : meta & ~4);
    world.setBlock(x, y, z, B.oak_door, nm & 7);
    if (world.getBlock(x, y + 1, z) === B.oak_door) world.setBlock(x, y + 1, z, B.oak_door, (nm & 7) | 8);
    Sound.play('door', x, y, z);
  },
  /** Bookshelves in the ring 2 blocks around an enchanting table (max 15 count). */
  countShelves(x, y, z) {
    let n = 0;
    for (let dy = 0; dy <= 1; dy++) for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
      if (Math.abs(dx) < 2 && Math.abs(dz) < 2) continue;
      if (this.world.getBlock(x + dx, y + dy, z + dz) === B.bookshelf) n++;
    }
    return Math.min(15, n);
  },
  isInteractable(id) {
    return [B.brewing_stand, B.crafting_table, B.furnace, B.lit_furnace, B.chest, B.oak_door, B.lever, B.stone_button, B.enchanting_table, B.repeater, B.powered_repeater].includes(id);
  },

  // ─── player actions ───────────────────────────────────────────────────
  playerBreak(x, y, z) {
    const w = this.world, p = this.player;
    let id = w.getBlock(x, y, z), meta = w.getMeta(x, y, z);
    if (!id || FLUID[id]) return;
    const def = BLOCKS[id];
    if (def.hardness < 0 && !p.creative) return;
    if (id === B.bedrock && !p.creative) return;
    if (id === B.oak_door && (meta & 8)) { y--; meta = w.getMeta(x, y, z); id = w.getBlock(x, y, z); }
    const held = p.held;
    const col = Tex.avgColor[Tex.faceTile(id, meta, 2)] || [0.5, 0.5, 0.5];
    Renderer.emit(x + 0.5, y + 0.5, z + 0.5, 22, col, 0.8, 3.5, 14, 0.9);
    Sound.play('break', x, y, z, def.sound);
    const replace = (id === B.ice && !p.creative && w.getBlock(x, y - 1, z) !== 0) ? B.water : 0;
    w.setBlock(x, y, z, replace);
    if (id === B.oak_door && w.getBlock(x, y + 1, z) === B.oak_door) w.setBlock(x, y + 1, z, 0);
    if (id === B.piston && (meta & 8)) { const f = meta & 7; const hx = x + DIRS[f][0], hy = y + DIRS[f][1], hz = z + DIRS[f][2]; if (w.getBlock(hx, hy, hz) === B.piston_head) w.setBlock(hx, hy, hz, 0); }
    if (id === B.piston_head) { const f = meta & 7; const bx = x - DIRS[f][0], by = y - DIRS[f][1], bz = z - DIRS[f][2]; if (w.getBlock(bx, by, bz) === B.piston) { w.setBlock(bx, by, bz, 0); if (!p.creative) this.dropItem(bx + 0.5, by + 0.5, bz + 0.5, mkStack(B.piston, 1)); } }
    if (!p.creative) {
      if (canHarvest(def, held)) { this.dropBlockItems(w, x, y, z, id, meta, held); if (def.xp) p.addXP(randInt(Math.random, 0, def.xp)); }
      if (def.hardness > 0) p.damageHeld(toolOf(held) && toolOf(held).type === 'sword' ? 2 : 1);
    }
    this.remeshNear(x, z);
  },
  attack(mob) {
    const p = this.player;
    const t = toolOf(p.held);
    const cd = Input.attackCooldown();
    const held = p.held, sharp = enchLevel(held, 'sharpness');
    let dmg = ((t ? t.dmg : 1) + (sharp ? 0.5 * sharp + 0.5 : 0)) * (0.2 + 0.8 * cd * cd);
    const crit = cd > 0.9 && p.vy < 0 && !p.onGround && !p.inWater;
    if (crit) { dmg *= 1.5; Renderer.emit(mob.x, mob.y + mob.h * 0.7, mob.z, 12, [1, 1, 0.6], 0.8, 3, 4, 0.5); }
    if (mob.hurt(dmg, 'player', { x: p.x, z: p.z, knockback: ((p.sprinting ? 9 : 5) + enchLevel(held, 'knockback') * 4) * Math.max(0.3, cd) })) {
      const fa = enchLevel(held, 'fire_aspect');
      if (fa) mob.fire = Math.max(mob.fire, 4 * fa);
      p.damageHeld(t && (t.type === 'sword') ? 1 : 2);
      p.addExhaustion(0.1);
      if (p.sprinting) p.sprinting = false;
    }
    p.attackTimer = 0;
  },
  eat() {
    const p = this.player, s = p.held; if (!s) return;
    const d = ITEMS[s.id];
    if (d.drink) {
      const pd = d.drink;
      if (pd.effect) p.addEffect(pd.effect[0], pd.effect[1], pd.effect[2]);
      if (pd.instant === 'heal') p.heal(4);
      Sound.play('burp', p.x, p.y, p.z);
      if (!p.creative) p.inv[p.selected] = mkStack(I.glass_bottle, 1);
      UI.dirty = true;
      return;
    }
    if (d.effect) p.addEffect(d.effect[0], d.effect[1], d.effect[2]);
    const f = d.food;
    p.food = Math.min(20, p.food + f[0]);
    p.sat = Math.min(p.food, p.sat + f[1]);
    Sound.play('burp', p.x, p.y, p.z);

  },
  place(hit, placeId) {
    const p = this.player, w = this.world;
    const def = BLOCKS[placeId];
    let { x, y, z, d } = hit;
    if (!REPLACEABLE[hit.id] || FLUID[hit.id] && false) { x += DIRS[d][0]; y += DIRS[d][1]; z += DIRS[d][2]; }
    else d = 2;
    if (y < 0 || y >= HEIGHT) return;
    const cur = w.getBlock(x, y, z);
    if (cur && !REPLACEABLE[cur]) return;
    // Orientation / metadata.
    let meta = 0;
    const look = Input.lookFacing();
    if (def.orient === 'facing') meta = placeId === B.repeater ? look : (look + 2) & 3;
    else if (def.orient === 'wall') {
      if (def.shape === 'ladder' && (d === 2 || d === 3)) return;
      if (d === 3) return;
      meta = d;
    } else if (def.orient === 'any') {
      meta = p.pitch < -0.8 ? 2 : p.pitch > 0.8 ? 3 : FACING_TO_D[(look + 2) & 3];
    }
    if (LEAVES[placeId]) meta = 1;
    // Support rules.
    const below = w.getBlock(x, y - 1, z);
    const hd = ITEMS[p.held.id];
    if (hd.placeOn && !hd.placeOn.some((n) => B[n] === below)) return;
    if (placeId === B.oak_door) {
      if (y + 1 >= HEIGHT) return;
      if (w.getBlock(x, y + 1, z) !== 0 && !REPLACEABLE[w.getBlock(x, y + 1, z)]) return;
      if (!SOLID[below]) return;
      meta = look;
    }

    const saved = [cur, w.getMeta(x, y, z)];
    w.setBlock(x, y, z, placeId, meta, { update: false });
    if (placeId === B.oak_door) w.setBlock(x, y + 1, z, B.oak_door, meta | 8, { update: false });
    let ok = Blocks.hasSupport(w, x, y, z, placeId);
    if (ok && SOLID[placeId]) {
      const boxes = Blocks.collision(placeId, meta) || [];
      const ents = [p, ...this.entities.filter((e) => e instanceof Mob && e.deathTime < 0)];
      for (const e of ents) {
        const bb = e.aabb();
        for (const b of boxes) if (bb[0] < x + b[3] - 0.001 && bb[3] > x + b[0] + 0.001 && bb[1] < y + b[4] - 0.001 && bb[4] > y + b[1] + 0.001 && bb[2] < z + b[5] - 0.001 && bb[5] > z + b[2] + 0.001) ok = false;

  /** Rebuild dirty chunk meshes around an edit immediately (no frame of lag). */
  remeshNear(x, z) {
    const w = this.world;
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      const c = w.getChunk((x >> 4) + dx, (z >> 4) + dz);
      if (c && c.dirty && c.meshed) Renderer.buildChunkMesh(w, c);
    }
  },

  // ─── chunk streaming ──────────────────────────────────────────────────
  buildSpiral(R) {
    const s = [];
    for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) { const d = Math.hypot(dx, dz); if (d <= R + 0.5) s.push([dx, dz, d]); }

  },
  neighborsGenerated(w, cx, cz) {
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) if (!w.getChunk(cx + dx, cz + dz)) return false;
    return true;
  },
  updateChunks(budget) {
    const w = this.world, p = this.player;
    const R = SETTINGS.renderDistance;
    if (this.spiralR !== R + 1) this.buildSpiral(R + 1);
    const pcx = Math.floor(p.x) >> 4, pcz = Math.floor(p.z) >> 4;
    const t0 = performance.now();
    let work = 0;
    for (const [dx, dz, d] of this.spiral) {
      if (performance.now() - t0 > budget) break;
      const cx = pcx + dx, cz = pcz + dz;
      const ch = w.getChunk(cx, cz);
      if (!ch) { w.generateChunk(cx, cz); work++; continue; }
      if (d > R + 0.5) continue;
      if (ch.state === CH_GENERATED) { if (this.neighborsGenerated(w, cx, cz)) { Light.lightChunk(w, ch); work++; this.onChunkReady(w, ch); } continue; }
      if ((!ch.meshed || ch.dirty) && this.neighborsGenerated(w, cx, cz)) { Renderer.buildChunkMesh(w, ch); work++; }
    }
    // Unload far chunks.
    this.unloadTimer -= budget;
    if (this.unloadTimer <= 0) {
      this.unloadTimer = 1000;
      for (const ch of [...w.chunks.values()]) if (Math.hypot(ch.cx - pcx, ch.cz - pcz) > R + 3) w.unloadChunk(ch);
      for (const e of this.entities) if ((e instanceof Mob && !(e instanceof EnderDragon)) || e instanceof ItemEntity) { if (!w.isLoaded(Math.floor(e.x), Math.floor(e.z))) e.remove(); }
    }
    return work;
  },
  onChunkReady(w, ch) {

      }

  spawnDragon() {

  onDragonKilled() {
    const w = this.world, p = this.player;
    w.dragonKilled = true; w.dragonKilledMsg = true;
    this.dragon = null;
    this.forceLoad(w, 0, 0, 1);
    let y0 = 0;

  },
  /** Synchronously generate + light chunks around (x,z) (used for teleports). */
  forceLoad(w, x, z, r) {

    for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) { const c = w.getChunk(cx0 + dx, cz0 + dz); if (c.state === CH_GENERATED) Light.lightChunk(w, c); }
  },
  chunkReadyAt(x, z) { const c = this.world.chunkAt(Math.floor(x) >> 4, Math.floor(z) >> 4); return c && c.meshed; },

  // ─── mob spawning ─────────────────────────────────────────────────────

        if (w.getBlock(x, y, z) === B.grass_block || w.getBlock(x, y, z) === B.snowy_grass_block) {
          const type = ['pig', 'cow', 'sheep', 'chicken'][Math.floor(rng() * 4)];
          const n = 2 + Math.floor(rng() * 3);
          for (let i = 0; i < n; i++) {
            const sx = x + Math.floor(rng() * 5) - 2, sz = z + Math.floor(rng() * 5) - 2, sy = w.topY(sx, sz) + 1;
            if (Path.standable(w, sx, sy, sz) && w.getBlock(sx, sy - 1, sz) !== B.water) this.spawnMob(type, sx + 0.5, sy, sz + 0.5);
          }
        }
      }
    }
    if (!p.creative && hostile < 14) {
      for (let tries = 0; tries < 6; tries++) {
        const a = rng() * Math.PI * 2, r = 22 + rng() * 26;
        const x = Math.floor(p.x + Math.cos(a) * r), z = Math.floor(p.z + Math.sin(a) * r);
        if (!w.isLoaded(x, z)) continue;
        const top = w.topY(x, z);
        const y = rng() < 0.5 ? top + 1 : 5 + Math.floor(rng() * Math.max(1, top - 5));
        if (!Path.standable(w, x, y, z) || FLUID[w.getBlock(x, y, z)]) continue;
        const light = Math.max(w.getSky(x, y, z) * daylight, w.getBlockLight(x, y, z));
        if (light >= 7) continue;
        const k = rng();
        const type = k < 0.33 ? 'zombie' : k < 0.58 ? 'skeleton' : k < 0.78 ? 'creeper' : k < 0.93 ? 'spider' : 'enderman';
        const m = this.spawnMob(type, x + 0.5, y, z + 0.5);
        if (Physics.collides(w, m.aabb())) m.remove();
        break;
      }
    }
  },

  // ─── main loop ────────────────────────────────────────────────────────
  tick() {
    const w = this.world, p = this.player;
    w.tick++; this.time = (this.time + 1) % DAY_TICKS; this.totalTicks++;
    const daylight = Renderer.daylight === undefined ? 1 : Renderer.daylight;
    p.tick(w);
    for (const e of this.entities) if (e instanceof Mob && !e.dead && e.deathTime < 0) e.think(w, p, daylight);
    Ticks.processScheduled(w);
    Ticks.random(w, p, daylight);
    TileEntities.tick(w, p);
    Redstone.update(w);
    Weather.tick(this.weather);
    if (this.totalTicks % 20 === 0) this.spawnTick(daylight);
    if (this.totalTicks % 1200 === 0) Persist.save(true);
    if (UI.screen && this.totalTicks % 4 === 0 && (UI.screen.type === 'furnace' || UI.screen.type === 'brewing' || UI.dirty)) UI.render();
  },
  frame(dt) {
    const p = this.player, w = this.world;
    const ready = this.chunkReadyAt(p.x, p.z);
    if (!this.paused) {
      // Physics runs in sub-steps of at most 50 ms so slow frames stay stable
      // and game speed stays real-time; game logic runs at a fixed 20 TPS.
      const steps = Math.max(1, Math.ceil(dt / 0.05)), sdt = dt / steps;
      const inp = UI.screen ? {} : Input.state();
      for (let k = 0; k < steps && this.world === w; k++) {
        if (ready) p.update(sdt, inp, w);
        for (const e of this.entities) if (!e.dead) e.update(sdt, w, p);
      }
      this.acc += dt;
      let n = 0;
      while (this.acc >= TICK && n < 6) { this.acc -= TICK; if (ready && this.world === w) this.tick(); n++; }
      if (n >= 6) this.acc = 0;
      this.entities = this.entities.filter((e) => !e.dead);
      if (Input.locked()) { Input.updateTarget(); Input.updateMining(dt); Input.updateUse(dt); }
      else { Renderer.showSelection(null); }
      Input.swing = Math.max(0, Input.swing - dt * 3.5);
    }
    // Chunk streaming: larger budget when the area around the player is incomplete.
    this.updateChunks(ready ? 7 : 25);
    // Camera.
    const cam = Renderer.camera;
    cam.position.set(p.x, p.y + p.eye + p.camOffset + (p.onGround && Math.hypot(p.vx, p.vz) > 1 ? Math.abs(Math.sin(p.bob * 2)) * 0.035 : 0), p.z);
    cam.rotation.set(p.pitch, p.yaw, 0);
    if (cam.fov !== SETTINGS.fov * (p.sprinting ? 1.1 : 1)) { cam.fov += (SETTINGS.fov * (p.sprinting ? 1.1 : 1) - cam.fov) * Math.min(1, dt * 10); cam.updateProjectionMatrix(); }
    const under = FLUID[w.getBlock(Math.floor(cam.position.x), Math.floor(cam.position.y), Math.floor(cam.position.z))];
    Renderer.updateEnvironment(this.time, cam, w, under, this.weather.strength);
    Renderer.updateParticles(dt);
    Renderer.updateWeather(dt, w, p, Weather.kind(w, p), this.weather.strength);
    const b = w.brightness(Math.floor(p.x), Math.floor(p.y + 1), Math.floor(p.z), Renderer.daylight);
    Renderer.updateHand(p.held, Input.swing, p.bob, 0.2 + 0.8 * b, !p.dead);
    HUD.update(dt);
    Renderer.render();
  },

  // ─── lifecycle ────────────────────────────────────────────────────────
  findSpawn(gen) {
    for (let r = 0; r < 4000; r += 16) {
      for (let a = 0; a < Math.max(1, r / 8); a++) {
        const ang = a / Math.max(1, r / 8) * Math.PI * 2;
        const x = Math.round(Math.cos(ang) * r), z = Math.round(Math.sin(ang) * r);
        const c = gen.column(x, z);
        if (c.h >= SEA_LEVEL + 1 && c.biome !== BIOME.OCEAN && c.biome !== BIOME.RIVER && c.biome !== BIOME.MOUNTAINS) return [x + 0.5, c.h + 1, z + 0.5];
      }
    }
    return [0.5, 90, 0.5];
  },
  async start(opts) {
    this.stop();
    $('mainMenu').classList.add('hidden');
    $('loading').classList.remove('hidden');
    const save = opts.save;
    this.seed = save ? save.seed : opts.seed;
    this.mode = save ? save.mode : opts.mode;
    this.time = save ? save.time : 1000;
    this.totalTicks = save ? (save.totalTicks || save.time) : 0;
    this.weather = { raining: save && save.weather ? save.weather.raining : false, strength: 0, timer: save && save.weather ? save.weather.timer : 600 + Math.random() * 600 };
    this.worlds = {};
    const dim = save ? save.dim || 'overworld' : 'overworld';
    for (const d of ['overworld', 'nether', 'end']) {
      if (save && save.worlds && save.worlds[d]) { const w = new World(this.seed, d); Persist.restoreWorld(w, save.worlds[d]); this.worlds[d] = w; }
    }
    if (!this.worlds.overworld) this.worlds.overworld = new World(this.seed, 'overworld');
    if (!this.worlds[dim]) this.worlds[dim] = new World(this.seed, dim);
    this.world = this.worlds[dim];
    this.entities = [];
    let p;
    if (save) {
      const s = save.player;
      p = new Player(s.x, s.y, s.z);
      Object.assign(p, { yaw: s.yaw, pitch: s.pitch, health: s.health, food: s.food, sat: s.sat, xp: s.xp || 0, level: s.level || 0, spawn: s.spawn, selected: s.selected || 0, flying: !!s.flying });
      p.inv = (s.inv || []).concat(new Array(36).fill(null)).slice(0, 36);
      p.armor = (s.armor || []).concat([null, null, null, null]).slice(0, 4);
      p.effects = s.effects || {};
      if (s.enchSeed) p.enchSeed = s.enchSeed;
    } else {
      const sp = this.findSpawn(this.world.gen);
      p = new Player(sp[0], sp[1], sp[2]);
      p.spawn = sp.slice();
      if (this.mode === 'creative') for (const [n, k] of [['stone', 64], ['oak_planks', 64], ['glass', 64], ['torch', 64], ['cobblestone', 64], ['oak_log', 64], ['tnt', 64], ['flint_and_steel', 1], ['diamond_pickaxe', 1]]) p.give(I[n], k);
    }
    this.player = p;
    UI.dirty = true;
    // Load the area around the player before handing over control.
    const total = (() => { let n = 0; const R = Math.min(SETTINGS.renderDistance, 3); for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) if (Math.hypot(dx, dz) <= R) n++; return n; })();
    for (let guard = 0; guard < 2000; guard++) {
      this.updateChunks(40);
      let done = 0; const R = Math.min(SETTINGS.renderDistance, 3);
      const pcx = Math.floor(p.x) >> 4, pcz = Math.floor(p.z) >> 4;
      for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) if (Math.hypot(dx, dz) <= R) { const c = this.world.getChunk(pcx + dx, pcz + dz); if (c && c.meshed) done++; }
      $('loadingBar').style.width = (done / total * 100) + '%';
      $('loadingText').textContent = `Generating terrain… ${done}/${total} chunks`;
      if (done >= total) break;
      await new Promise((r) => requestAnimationFrame(r));
    }
    // Make sure a new player is not standing inside terrain.
    if (!save) { while (p.y < HEIGHT - 2 && Physics.collides(this.world, p.aabb())) p.y += 1; }
    $('loading').classList.add('hidden');
    $('hud').classList.remove('hidden');
    this.running = true; this.paused = false;
    Renderer.refreshHand = true;
    if (this.world.dim === 'end' && !this.world.dragonKilled) this.spawnDragon();
    chat(`Welcome to BlockCraft! Seed: ${this.seed}. Press E for inventory, / for commands.`, '#ff8');
    if (this.mode === 'survival') chat('Punch a tree to get started. Monsters come out at night!', '#ccc');
    Input.lock();
    setTimeout(() => { if (!Input.locked() && this.running && !UI.screen) Menus.pause(true); }, 400);
  },
  stop() {
    UI.close(true);
    for (const e of this.entities) if (e.remove) e.remove();
    this.entities = [];
    Renderer.clearChunks();
    if (this.worlds) for (const w of Object.values(this.worlds)) for (const c of w.chunks.values()) { c.mesh = null; c.waterMesh = null; }
    this.running = false;
  },
  setMode(m) {
    this.mode = m;
    if (m === 'survival') this.player.flying = false;
    chat('Game mode: ' + m, '#ff8');
    UI.dirty = true;
  },
  /** Switch the active dimension; `place(world)` returns the arrival [x,y,z]. */
  switchDimension(dim, place) {
    const old = this.world;
    this.dragon = null;
    for (const c of old.chunks.values()) Renderer.disposeChunk(c);
    old.chunks.clear(); old._lc = null;
    for (const e of this.entities) if (e.remove) e.remove();
    this.entities = [];
    // STUB: mobs and dropped items are not persisted across dimension changes (or in saves).
    if (!this.worlds[dim]) this.worlds[dim] = new World(this.seed, dim);
    this.world = this.worlds[dim];
    const pos = place(this.world);
    const p = this.player;
    p.x = pos[0]; p.y = pos[1]; p.z = pos[2]; p.vx = p.vy = p.vz = 0; p.fallDist = 0;
    Sound.play('portal');
    if (dim !== 'end') chat(dim === 'nether' ? 'Entering the Nether…' : 'Returning to the Overworld…', '#c8f');
  },
  onPlayerDeath(source) {
    const p = this.player;
    p.dead = true;
    if (!p.creative) {
      for (let i = 0; i < 36; i++) if (p.inv[i]) { this.dropItem(p.x, p.y + 1, p.z, p.inv[i], (Math.random() - 0.5) * 6, 4, (Math.random() - 0.5) * 6); p.inv[i] = null; }
      for (let i = 0; i < 4; i++) if (p.armor[i]) { this.dropItem(p.x, p.y + 1, p.z, p.armor[i], (Math.random() - 0.5) * 6, 4, (Math.random() - 0.5) * 6); p.armor[i] = null; }
      p.xp = 0; p.level = 0;
    }
    const msgs = { fall: 'hit the ground too hard', lava: 'tried to swim in lava', fire: 'burned to death', drown: 'drowned', starve: 'starved to death', explosion: 'blew up', void: 'fell out of the world', cactus: 'was pricked to death', arrow: 'was shot by a Skeleton', zombie: 'was slain by a Zombie', spider: 'was slain by a Spider' };
    $('deathMsg').textContent = 'You ' + (msgs[source] || 'died') + '.';
    if (document.pointerLockElement) document.exitPointerLock();
    UI.close(true);
    $('deathScreen').classList.remove('hidden');
  },
  respawn() {
    const p = this.player;
    $('deathScreen').classList.add('hidden');
    if (this.world.dim !== 'overworld') this.switchDimension('overworld', (w) => { this.forceLoad(w, p.spawn[0], p.spawn[2], 1); return p.spawn; });
    Object.assign(p, { x: p.spawn[0], y: p.spawn[1], z: p.spawn[2], vx: 0, vy: 0, vz: 0, health: 20, food: 20, sat: 5, air: 300, fire: 0, dead: false, fallDist: 0, invul: 2, exhaustion: 0, effects: {} });
    this.forceLoad(this.world, p.x, p.z, 1);
    while (p.y < HEIGHT - 2 && Physics.collides(this.world, p.aabb())) p.y += 1;
    UI.dirty = true;
    Input.lock();
  },
  /** Tiny command console (press / or T). */
  command() {
    this.inCommand = true;
    if (document.pointerLockElement) document.exitPointerLock();
    const line = window.prompt('Command (e.g. /time set night, /give diamond 5, /gamemode creative, /tp x y z, /summon zombie, /weather rain, /seed, /locate, /dimension end):', '/');
    this.inCommand = false;
    if (line) this.runCommand(line.trim().replace(/^\//, ''));
    Input.lock();
  },
  runCommand(line) {
    const [cmd, ...a] = line.split(/\s+/);
    const p = this.player;
    switch (cmd) {
      case 'time': { const v = { day: 1000, noon: 6000, sunset: 12000, night: 13000, midnight: 18000 }[a[1]]; this.time = v !== undefined ? v : (+a[1] || 0) % DAY_TICKS; chat('Time set to ' + this.time); break; }
      case 'gamemode': case 'gm': this.setMode(/^(c|creative|1)$/.test(a[0]) ? 'creative' : 'survival'); break;
      case 'give': { const id = I[a[0]]; if (id === undefined) { chat('Unknown item: ' + a[0], '#f88'); break; } p.give(id, +a[1] || 1); chat(`Gave ${+a[1] || 1} × ${itemName(id)}`); break; }
      case 'tp': p.x = +a[0]; p.y = +a[1]; p.z = +a[2]; p.vy = 0; break;
      case 'weather': this.weather.raining = a[0] !== 'clear'; this.weather.timer = 600; break;
      case 'seed': chat('Seed: ' + this.seed); break;
      case 'dimension': case 'dim': {
        const d = a[0];
        if (d === 'end') { this.player.portalCooldown = 3; Portals.travelEnd(this.player); }
        else if (d === 'nether' || d === 'overworld') { if (this.world.dim !== d) Portals.travel(this.player); }
        break;
      }
      case 'locate': { const s = Strongholds.nearest(this.seed, p.x, p.z); chat(`Nearest stronghold: ${Math.round(s[0])} ${s[1]} ${Math.round(s[2])}`); break; }
      case 'summon': if (a[0] === 'ender_dragon') { this.spawnDragon(); break; } else if (MOB_TYPES[a[0]]) { const [dx, , dz] = Input.lookDir(); this.spawnMob(a[0], p.x + dx * 3, p.y + 0.5, p.z + dz * 3); } else chat('Mobs: ' + Object.keys(MOB_TYPES).join(', '), '#f88'); break;
      case 'kill': p.hurt(1000, 'void'); break;
      case 'spawnpoint': p.spawn = [p.x, p.y, p.z]; chat('Spawn point set.'); break;
      case 'save': Persist.save(); break;
      default: chat('Unknown command: ' + cmd, '#f88');
    }
  },
};

// ─── Menus ────────────────────────────────────────────────────────────────
const HELP_HTML = `
<b>WASD</b> move · <b>Mouse</b> look<br><b>Space</b> jump / swim up<br><b>Space ×2</b> toggle flying (creative)<br>
<b>Shift</b> sneak / fly down · <b>Ctrl</b> or <b>W×2</b> sprint<br><b>Left click</b> mine / attack (hold)<br>
<b>Right click</b> place / use / eat (hold) / open<br><b>Middle click</b> pick block<br><b>1-9 / wheel</b> hotbar<br>
<b>E</b> inventory · <b>Q</b> drop (Ctrl+Q stack)<br><b>/</b> or <b>T</b> commands · <b>F3</b> debug<br><b>F4</b> toggle creative/survival · <b>F1</b> hide HUD<br>
<b>Esc</b> pause / release mouse<br>In inventories: shift-click quick move, right-click split, drag to move, 1-9 swap with hotbar.<br>
Nether: build a 4×5 obsidian frame and light it with flint &amp; steel.`;
const Menus = {
  init() {
    $('helpMain').innerHTML = HELP_HTML; $('helpPause').innerHTML = HELP_HTML;
    $('btnNew').onclick = () => { Sound.init(); const s = $('seedInput').value.trim(); Game.start({ seed: s ? hashString(s) : (Math.random() * 2 ** 31) | 0, mode: $('modeSelect').value }); };
    $('btnContinue').onclick = () => { Sound.init(); const s = Persist.load(); if (s) Game.start({ save: s }); else chat('No saved world found.'); };
    $('btnImport').onclick = () => $('importFile').click();
    $('importFile').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { try { Game.start({ save: JSON.parse(r.result) }); } catch (err) { alert('Invalid world file: ' + err.message); } };
      r.readAsText(f);
      e.target.value = '';
    };
    const dz = $('dropZone');
    dz.onclick = () => $('packFile').click();
    $('packFile').onchange = (e) => { if (e.target.files[0]) this.loadPack(e.target.files[0]); e.target.value = ''; };
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) this.loadPack(f); });
    // Allow dropping a pack anywhere on the page too.
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f && /\.zip$/i.test(f.name)) this.loadPack(f); });
    $('btnContinue').style.display = Persist.load() ? '' : 'none';
    // Pause menu.
    $('btnResume').onclick = () => this.pause(false);
    $('btnSave').onclick = () => Persist.save();
    $('btnExport').onclick = () => Persist.exportFile();
    $('btnMode').onclick = () => Game.setMode(Game.mode === 'creative' ? 'survival' : 'creative');
    $('btnPack').onclick = () => $('packFile').click();
    $('btnQuit').onclick = () => { Persist.save(true); Game.stop(); $('pauseMenu').classList.add('hidden'); $('hud').classList.add('hidden'); $('mainMenu').classList.remove('hidden'); $('btnContinue').style.display = Persist.load() ? '' : 'none'; };
    $('btnRespawn').onclick = () => Game.respawn();
    const bind = (id, key, fmt, apply) => {
      const el = $(id);
      const sync = () => { if (fmt) $(fmt).textContent = SETTINGS[key]; };
      if (el.type === 'checkbox') { el.checked = SETTINGS[key]; el.onchange = () => { SETTINGS[key] = el.checked; saveSettings(); if (apply) apply(); }; }
      else { el.value = SETTINGS[key]; sync(); el.oninput = () => { SETTINGS[key] = +el.value; sync(); saveSettings(); if (apply) apply(); }; }
    };
    bind('rdRange', 'renderDistance', 'rdVal');
    bind('fovRange', 'fov', 'fovVal', () => { Renderer.camera.fov = SETTINGS.fov; Renderer.camera.updateProjectionMatrix(); });
    bind('sensRange', 'sensitivity');
    bind('volRange', 'volume');
    bind('optLeaves', 'fancyLeaves', null, () => { if (Game.world) for (const c of Game.world.chunks.values()) c.dirty = true; });
    bind('optStep', 'autoStep');
  },
  pause(on) {
    Game.paused = on;
    $('pauseMenu').classList.toggle('hidden', !on);
    if (!on) Input.lock();
  },
  async loadPack(file) {
    const info = $('packInfo');
    if (typeof JSZip === 'undefined') { info.textContent = 'JSZip failed to load (offline?) — resource packs unavailable.'; return; }
    info.textContent = 'Reading ' + file.name + '…';
    try {
      const pack = await loadResourcePack(file, (f) => { info.textContent = `Reading ${file.name}… ${Math.round(f * 100)}%`; });
      Tex.pack = pack;
      Tex.build();
      Renderer.applyAtlas();
      for (const w of Object.values(Game.worlds || {})) for (const c of w.chunks.values()) c.dirty = true;
      for (const e of Game.entities || []) if (e instanceof ItemEntity) { Renderer.entityGroup.remove(e.mesh); e.mesh = Renderer.itemMesh(e.stack.id, 0.25); Renderer.entityGroup.add(e.mesh); }
      UI.dirty = true;
      info.textContent = `Loaded "${pack.name}" (${pack.count} textures${pack.skipped ? `, ignored ${pack.skipped} OptiFine/extra files` : ''}) at ${Tex.T}×${Tex.T}. ${pack.desc || ''}`;
      if (Game.running) chat('Resource pack loaded: ' + pack.name, '#afa');
    } catch (e) {
      console.error(e);
      info.textContent = 'Could not read that pack: ' + (e.message || e);
    }
  },
};

// ─── bootstrap ────────────────────────────────────────────────────────────
(function boot() {
  if (typeof THREE === 'undefined') {
    document.getElementById('packInfo').textContent = 'Three.js could not be loaded from the CDN. Check your internet connection and reload.';
    document.getElementById('btnNew').disabled = true;
    return;
  }
  Tex.build();
  Renderer.init(document.getElementById('game'));
  HUD.init();
  Input.init();
  Menus.init();
  if (typeof JSZip === 'undefined') $('packInfo').textContent = 'JSZip unavailable — using built-in textures.';
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    if (!Game.running) return;
    try { Game.frame(dt); }
    catch (e) { console.error(e); if (!Game._errShown) { Game._errShown = true; chat('Error: ' + e.message + ' (see console)', '#f66'); } }
  }
  requestAnimationFrame(loop);
  window.addEventListener('beforeunload', () => { if (Game.running) Persist.save(true); });
  // Expose for debugging from the console.
  window.BlockCraft = { Game, Tex, Renderer, BLOCKS, ITEMS, I, B };
})();
</script>
</body>
</html>
