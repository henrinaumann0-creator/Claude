    case 2: return [x0, y0, z0, x1, y1, z1];
    case 3: return [x0, 1 - y1, z0, x1, 1 - y0, z1];
    case 4: return [x0, z0, y0, x1, z1, y1];           // up → +z (against north wall)
    case 5: return [x0, z0, 1 - y1, x1, z1, 1 - y0];   // up → -z
    case 0: return [y0, z0, x0, y1, z1, x1];           // up → +x
    case 1: return [1 - y1, z0, x0, 1 - y0, z1, x1];   // up → -x
  }
  return b;
}

// ═══════════════════════════════════════════════════════════════════════════
// §6 LIGHTING — flood-fill sky light and block light (0..15)
// ---------------------------------------------------------------------------
// Sky light: 15 straight down from the sky through non-opaque cells, then
// spreads sideways losing 1 per step. Block light: emitted by torches, lava,
// glowstone, etc. Leaves and water attenuate extra (FILTER table).
// Initial lighting runs per chunk once its 8 neighbours exist; later edits use
// incremental removal + re-propagation (the classic two-queue algorithm).
// ═══════════════════════════════════════════════════════════════════════════
const Light = {
  addQ: new IntQueue(), remQ: new IntQueue(),
  get(c, i, sky) { return sky ? c.light[i] >> 4 : c.light[i] & 15; },
  set(c, i, sky, v) { c.light[i] = sky ? (c.light[i] & 15) | (v << 4) : (c.light[i] & 0xF0) | v; },

  /** Propagate light outwards from every cell in addQ. */
  propagate(w, sky) {
    const q = this.addQ;
    while (q.h < q.n) {
      const x = q.a[q.h++], y = q.a[q.h++], z = q.a[q.h++];
      const c = w.chunkAt(x >> 4, z >> 4);
      if (!c) continue;
      const L = this.get(c, idx(x & 15, y, z & 15), sky);
      if (L <= 1) continue;
      for (let d = 0; d < 6; d++) {
        const ny = y + DIRS[d][1];
        if (ny < 0 || ny >= HEIGHT) continue;
        const nx = x + DIRS[d][0], nz = z + DIRS[d][2];
        const nc = ((nx >> 4) === c.cx && (nz >> 4) === c.cz) ? c : w.chunkAt(nx >> 4, nz >> 4);
        if (!nc) continue;
        const ni = idx(nx & 15, ny, nz & 15);
        const b = nc.blocks[ni];
        if (OPAQUE[b]) continue;
        let nl = L - 1 - FILTER[b];
        if (sky && d === 3 && L === 15 && FILTER[b] === 0) nl = 15;
        if (nl > this.get(nc, ni, sky)) {
          this.set(nc, ni, sky, nl);
          nc.dirty = true;
          if ((nx & 15) === 0 || (nx & 15) === 15 || (nz & 15) === 0 || (nz & 15) === 15) w.markDirty(nx, nz);
          q.push3(nx, ny, nz);
        }
      }
    }
    q.reset();
  },
  /** Remove light spreading from cells in remQ (entries x,y,z,oldValue). */
  unpropagate(w, sky) {
    const q = this.remQ;
    while (q.h < q.n) {
      const x = q.a[q.h++], y = q.a[q.h++], z = q.a[q.h++], v = q.a[q.h++];
      for (let d = 0; d < 6; d++) {
        const ny = y + DIRS[d][1];
        if (ny < 0 || ny >= HEIGHT) continue;
        const nx = x + DIRS[d][0], nz = z + DIRS[d][2];
        const nc = w.chunkAt(nx >> 4, nz >> 4);
        if (!nc) continue;
        const ni = idx(nx & 15, ny, nz & 15);
        const cur = this.get(nc, ni, sky);
        if (cur === 0) continue;
        if (cur < v || (sky && d === 3 && v === 15 && cur === 15)) {
          this.set(nc, ni, sky, 0);
          w.markDirty(nx, nz);
          q.push4(nx, ny, nz, cur);
        } else {
          this.addQ.push3(nx, ny, nz);
        }
      }
    }
    q.reset();
  },
  /** Incremental update after the block at (x,y,z) changed. */
  onChange(w, x, y, z) {
    const c = w.chunkAt(x >> 4, z >> 4);
    const i = idx(x & 15, y, z & 15);
    const id = c.blocks[i];
    for (const sky of [false, true]) {
      if (sky && !w.hasSky) continue;
      const old = this.get(c, i, sky);
      if (old > 0) { this.set(c, i, sky, 0); this.remQ.push4(x, y, z, old); this.unpropagate(w, sky); }
      if (!sky && EMIT[id]) { this.set(c, i, false, EMIT[id]); this.addQ.push3(x, y, z); }
      if (!OPAQUE[id]) {
        for (let d = 0; d < 6; d++) {
          const nx = x + DIRS[d][0], ny = y + DIRS[d][1], nz = z + DIRS[d][2];
          if (ny >= HEIGHT) { if (sky) { this.set(c, i, true, Math.max(0, 15 - FILTER[id])); this.addQ.push3(x, y, z); } continue; }
          if (ny < 0) continue;
          const nc = w.chunkAt(nx >> 4, nz >> 4);
          if (nc && this.get(nc, idx(nx & 15, ny, nz & 15), sky) > 0) this.addQ.push3(nx, ny, nz);
        }
      }
      this.propagate(w, sky);
    }
  },
  /** Full initial lighting for a freshly generated chunk. */
  lightChunk(w, c) {
    const x0 = c.cx * 16, z0 = c.cz * 16;
    const q = this.addQ;
    if (w.hasSky) {
      const tops = new Int16Array(256);
      for (let lz = 0; lz < 16; lz++) for (let lx = 0; lx < 16; lx++) {
        let v = 15, y = HEIGHT - 1;
        // Full sky light only travels straight down through unfiltered cells; from the
        // first opaque/filtering block on, the flood fill below applies the same
        // "-1 - filter" rule that incremental updates use.
        for (; y >= 0; y--) {
          const i = idx(lx, y, lz), b = c.blocks[i];
          if (OPAQUE[b] || FILTER[b]) break;
          if ((c.light[i] >> 4) < v) this.set(c, i, true, v);
        }
        tops[lz * 16 + lx] = y;
      }
      // Seed the BFS from lit cells that may need to spread sideways.
      for (let lz = 0; lz < 16; lz++) for (let lx = 0; lx < 16; lx++) {
        let maxN = -1;
        for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const ax = lx + dx, az = lz + dz;
          maxN = Math.max(maxN, (ax < 0 || ax > 15 || az < 0 || az > 15) ? HEIGHT - 1 : tops[az * 16 + ax]);
        }
        const top = tops[lz * 16 + lx];
        for (let y = top + 1; y <= Math.min(HEIGHT - 1, maxN + 1); y++) if ((c.light[idx(lx, y, lz)] >> 4) > 1) q.push3(x0 + lx, y, z0 + lz);
      }
      // Pull in light from already-lit neighbours.
      this.seedBorders(w, c, true);
      this.propagate(w, true);
    }
    for (let i = 0; i < CHUNK_VOL; i++) {
      const e = EMIT[c.blocks[i]];
      if (e) { this.set(c, i, false, e); q.push3(x0 + (i & 15), i >> 8, z0 + ((i >> 4) & 15)); }
    }
    this.seedBorders(w, c, false);
    this.propagate(w, false);
    c.state = CH_LIT;
    c.dirty = true;
  },
  seedBorders(w, c, sky) {
    const q = this.addQ;
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const n = w.getChunk(c.cx + dx, c.cz + dz);
      if (!n || n.state < CH_LIT) continue;
      for (let k = 0; k < 16; k++) for (let y = 0; y < HEIGHT; y++) {
        const lx = dx === 1 ? 0 : dx === -1 ? 15 : k, lz = dz === 1 ? 0 : dz === -1 ? 15 : k;
        if (this.get(n, idx(lx, y, lz), sky) > 1) q.push3(n.cx * 16 + lx, y, n.cz * 16 + lz);
      }
    }
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// §7 CHUNK MESHER — per-face culling + greedy meshing + special shapes
// ---------------------------------------------------------------------------
// For each chunk we copy its cells plus a 1-block border from the 8
// neighbours into a padded 18×130×18 buffer, so meshing needs no map lookups.
//
// Full cubes go through the greedy mesher: for each of the 6 face directions
// and each slice we build a 2D mask of visible faces (a face is visible when
// the neighbour in that direction does not hide it). Each mask entry is a
// numeric key made of the atlas tile + the smooth-light/AO values of its 4
// corners, so only faces that would look identical are merged into one quad.
// Merged quads use UVs in *block units*; the fragment shader wraps them with
// fract() inside the atlas tile, so a 5×3 quad repeats the texture 5×3 times.
//
// Everything else (plants, torches, fluids, doors, redstone, …) is emitted
// per block by small box/quad helpers into the same vertex format.
// Vertex format: position(3) aUV(2, block units) aTile(1) aLight(3: sky, block, shade·AO)
// ═══════════════════════════════════════════════════════════════════════════

const PS = 18, PSY = HEIGHT + 2, PAD_N = PS * PS * PSY;
const pidx = (x, y, z) => ((y + 1) * PS + (z + 1)) * PS + (x + 1);
const PSTRIDE = [1, PS * PS, PS]; // strides for x, y, z in the padded buffer
const PAD = { id: new Uint8Array(PAD_N), meta: new Uint8Array(PAD_N), light: new Uint8Array(PAD_N) };

/** Face definitions: normal axis, tangent axes (a,b), vertex corner order, UV flip. */
const FACES = [
  { na: 0, a: 2, b: 1, pos: true, c: [[1, 0], [0, 0], [0, 1], [1, 1]], flipU: true },   // +X
  { na: 0, a: 2, b: 1, pos: false, c: [[0, 0], [1, 0], [1, 1], [0, 1]], flipU: false }, // -X
  { na: 1, a: 0, b: 2, pos: true, c: [[0, 0], [0, 1], [1, 1], [1, 0]], flipU: false },  // +Y
  { na: 1, a: 0, b: 2, pos: false, c: [[0, 0], [1, 0], [1, 1], [0, 1]], flipU: false }, // -Y
  { na: 2, a: 0, b: 1, pos: true, c: [[0, 0], [1, 0], [1, 1], [0, 1]], flipU: false },  // +Z
  { na: 2, a: 0, b: 1, pos: false, c: [[1, 0], [0, 0], [0, 1], [1, 1]], flipU: true },  // -Z
];
for (const f of FACES) {
  f.no = PSTRIDE[f.na] * (f.pos ? 1 : -1);
  // Padded offsets (relative to the neighbour cell) for side1, side2, corner of each vertex.
  f.ao = f.c.map(([ca, cb]) => {
    const s1 = PSTRIDE[f.a] * (ca ? 1 : -1), s2 = PSTRIDE[f.b] * (cb ? 1 : -1);
    return [s1, s2, s1 + s2];
  });
}
const FACE_SHADE = [0.62, 0.62, 1.0, 0.5, 0.8, 0.8];
const AO_CURVE = [0.42, 0.62, 0.8, 1.0];

/** Growable vertex/index buffers for one mesh. */
class MeshBuf {
  constructor() { this.pos = new GrowF32(); this.uv = new GrowF32(); this.tile = new GrowF32(); this.light = new GrowF32(); this.idx = new GrowU32(); this.v = 0; }
  reset() { this.pos.reset(); this.uv.reset(); this.tile.reset(); this.light.reset(); this.idx.reset(); this.v = 0; }
  vert(x, y, z, u, v, tile, sky, blk, shade) {
    this.pos.push(x); this.pos.push(y); this.pos.push(z);
    this.uv.push(u); this.uv.push(v); this.tile.push(tile);
    this.light.push(sky); this.light.push(blk); this.light.push(shade);
    return this.v++;
  }
  quad(v0, flip, double) {
    const I = this.idx;
    if (flip) { I.push(v0 + 1); I.push(v0 + 2); I.push(v0 + 3); I.push(v0 + 1); I.push(v0 + 3); I.push(v0); }
    else { I.push(v0); I.push(v0 + 1); I.push(v0 + 2); I.push(v0); I.push(v0 + 2); I.push(v0 + 3); }
    if (double) { I.push(v0); I.push(v0 + 2); I.push(v0 + 1); I.push(v0); I.push(v0 + 3); I.push(v0 + 2); }
  }
}
const BUF_OPAQUE = new MeshBuf(), BUF_WATER = new MeshBuf();
const MASK_KEY = new Float64Array(16 * HEIGHT), MASK_TILE = new Int16Array(16 * HEIGHT), MASK_V = new Int32Array(16 * HEIGHT * 4);

const Mesher = {
  /** Copy chunk + 1-cell border into PAD. Returns false if a neighbour is missing. */
  fillPad(world, ch) {
    const skyTop = world.hasSky ? 0xF0 : 0;
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      const n = world.getChunk(ch.cx + dx, ch.cz + dz);
      if (!n) return false;
      const xs = dx === -1 ? 15 : 0, xe = dx === 1 ? 0 : 15, zs = dz === -1 ? 15 : 0, ze = dz === 1 ? 0 : 15;
      const ox = dx * 16, oz = dz * 16;
      for (let y = 0; y < HEIGHT; y++) for (let z = zs; z <= ze; z++) {
        let ci = idx(xs, y, z), pi = pidx(xs + ox, y, z + oz);
        for (let x = xs; x <= xe; x++, ci++, pi++) { PAD.id[pi] = n.blocks[ci]; PAD.meta[pi] = n.meta[ci]; PAD.light[pi] = n.light[ci]; }
      }
    }
    for (let z = -1; z <= 16; z++) for (let x = -1; x <= 16; x++) {
      let p = pidx(x, -1, z); PAD.id[p] = B.bedrock; PAD.light[p] = 0;
      p = pidx(x, HEIGHT, z); PAD.id[p] = 0; PAD.light[p] = skyTop;
    }
    return true;
  },
  /** Does block `nid` hide the face of block `id` that touches it? */
  hides(id, nid) {
    if (OPAQUE[nid]) return true;
    if (id === nid && (CULLSAME[id] || (LEAVES[id] && !SETTINGS.fancyLeaves))) return true;
    return false;
  },
  /** Build both mesh buffers for a chunk. */
  build(world, ch) {
    if (!this.fillPad(world, ch)) return false;
    BUF_OPAQUE.reset(); BUF_WATER.reset();
    // Only mesh up to the highest non-air cell: everything above is empty sky.
    let top = HEIGHT - 1;
    while (top > 0) {
      let any = false;
      const base = top << 8;
      for (let i = 0; i < 256; i++) if (ch.blocks[base + i]) { any = true; break; }
      if (any) break;
      top--;
    }
    this.maxY = top;
    this.greedy();
    this.special(world);
    return true;
  },
  greedy() {
    const dims = [16, this.maxY + 1, 16];
    const pid = PAD.id, pl = PAD.light, pm = PAD.meta;
    const buf = BUF_OPAQUE;
    const c = [0, 0, 0];
    for (let d = 0; d < 6; d++) {
      const F = FACES[d], Na = dims[F.na], Da = dims[F.a], Db = dims[F.b];
      const no = F.no, ao = F.ao;
      for (let s = 0; s < Na; s++) {
        c[F.na] = s;
        let n = 0, any = false;
        for (let j = 0; j < Db; j++) {
          c[F.b] = j;
          for (let i = 0; i < Da; i++, n++) {
            c[F.a] = i;
            const p = pidx(c[0], c[1], c[2]);
            const id = pid[p];
            if (!GREEDY[id]) { MASK_KEY[n] = 0; continue; }
            const q = p + no, nid = pid[q];
            if (this.hides(id, nid)) { MASK_KEY[n] = 0; continue; }
            const tile = Tex.faceTile(id, pm[p], d);
            const L0 = pl[q];
            let lo = 0, v3 = 0;
            for (let k = 0; k < 4; k++) {
              const o = ao[k];
              const i1 = q + o[0], i2 = q + o[1], i3 = q + o[2];
              const o1 = OPAQUE[pid[i1]], o2 = OPAQUE[pid[i2]], o3 = OPAQUE[pid[i3]];
              const aov = (o1 && o2) ? 0 : 3 - (o1 + o2 + o3);
              let sky = L0 >> 4, blk = L0 & 15, cnt = 1;
              if (!o1) { sky += pl[i1] >> 4; blk += pl[i1] & 15; cnt++; }
              if (!o2) { sky += pl[i2] >> 4; blk += pl[i2] & 15; cnt++; }
              if (!o3 && !(o1 && o2)) { sky += pl[i3] >> 4; blk += pl[i3] & 15; cnt++; }
              const vb = Math.round(sky / cnt) | (Math.round(blk / cnt) << 4) | (aov << 8);
              MASK_V[n * 4 + k] = vb;
              if (k === 0) lo = vb; else if (k === 1) lo += vb * 1024; else if (k === 2) lo += vb * 1048576; else v3 = vb;
            }
            MASK_TILE[n] = tile;
            MASK_KEY[n] = ((tile + 1) * 1024 + v3) * 1073741824 + lo;
            any = true;
          }
        }
        if (!any) continue;
        // Greedy merge over the mask.
        const plane = s + (F.pos ? 1 : 0), shade = FACE_SHADE[d];
        for (let j = 0; j < Db; j++) {
          for (let i = 0; i < Da;) {
            const m = j * Da + i, key = MASK_KEY[m];
            if (!key) { i++; continue; }
            let w = 1;
            while (i + w < Da && MASK_KEY[m + w] === key) w++;
            let h = 1;
            outer: while (j + h < Db) {
              const r = (j + h) * Da + i;
              for (let t = 0; t < w; t++) if (MASK_KEY[r + t] !== key) break outer;
              h++;
            }
            // Emit.
            const tile = MASK_TILE[m];
            let v0 = -1, br = [0, 0, 0, 0];
            for (let k = 0; k < 4; k++) {
              const [ca, cb] = F.c[k];
              const vb = MASK_V[m * 4 + k];
              const sky = vb & 15, blk = (vb >> 4) & 15, a = vb >> 8;
              c[F.na] = plane; c[F.a] = i + ca * w; c[F.b] = j + cb * h;
              const u = F.flipU ? (1 - ca) * w : ca * w, v = cb * h;
              const vi = buf.vert(c[0], c[1], c[2], u, v, tile, sky / 15, blk / 15, shade * AO_CURVE[a]);
              if (k === 0) v0 = vi;
              br[k] = a * 32 + sky + blk;
            }
            buf.quad(v0, br[0] + br[2] < br[1] + br[3]);
            for (let hh = 0; hh < h; hh++) for (let ww = 0; ww < w; ww++) MASK_KEY[(j + hh) * Da + i + ww] = 0;
            i += w;
          }
        }
      }
    }
  },
  /** Emit one face of an axis-aligned box (block-local coords) at cell origin (ox,oy,oz). */
  boxFace(buf, d, bx, uvb, ox, oy, oz, tile, sky, blk, shadeMul = 1, double = false) {
    const F = FACES[d];
    const mn = [bx[0], bx[1], bx[2]], mx = [bx[3], bx[4], bx[5]];
    const umn = [uvb[0], uvb[1], uvb[2]], umx = [uvb[3], uvb[4], uvb[5]];
    const plane = F.pos ? mx[F.na] : mn[F.na];
    const p = [0, 0, 0];
    let v0 = -1;
    for (let k = 0; k < 4; k++) {
      const [ca, cb] = F.c[k];
      p[F.na] = plane; p[F.a] = ca ? mx[F.a] : mn[F.a]; p[F.b] = cb ? mx[F.b] : mn[F.b];
      const ua = ca ? umx[F.a] : umn[F.a], vb = cb ? umx[F.b] : umn[F.b];
      const u = F.flipU ? 1 - ua : ua;
      const vi = buf.vert(ox + p[0], oy + p[1], oz + p[2], u, vb, tile, sky, blk, FACE_SHADE[d] * shadeMul);
      if (k === 0) v0 = vi;
    }
    buf.quad(v0, false, double);
  },
  /** Emit all 6 faces of a box, optionally culling against neighbours. */
  box(buf, bx, ox, oy, oz, tileFn, sky, blk, cullFn, uvb) {
    for (let d = 0; d < 6; d++) {
      if (cullFn && cullFn(d)) continue;
      this.boxFace(buf, d, bx, uvb || bx, ox, oy, oz, tileFn(d), sky, blk);
    }
  },
  /** Raw quad (for diagonal plant planes). */
  rawQuad(buf, pts, tile, sky, blk, shade) {
    const uvs = [[0, 0], [1, 0], [1, 1], [0, 1]];
    let v0 = -1;
    for (let k = 0; k < 4; k++) { const vi = buf.vert(pts[k][0], pts[k][1], pts[k][2], uvs[k][0], uvs[k][1], tile, sky, blk, shade); if (k === 0) v0 = vi; }
    buf.quad(v0, false, true);
  },
  /** Non-greedy shapes. */
  special(world) {
    const pid = PAD.id, pm = PAD.meta, pl = PAD.light;
    for (let y = 0; y <= this.maxY; y++) for (let z = 0; z < 16; z++) for (let x = 0; x < 16; x++) {
      const p = pidx(x, y, z), id = pid[p];
      if (!id || GREEDY[id]) continue;
      const def = BLOCKS[id], meta = pm[p];
      const L = pl[p], sky = (L >> 4) / 15, blk = (L & 15) / 15;
      const nb = (d) => pid[p + FACES[d].no];
      const tileFn = (d) => Tex.faceTile(id, meta, d);
      switch (def.shape) {
        case 'cross': {
          const t = Tex.faceTile(id, meta, 0);
          if (id === B.wheat) {
            for (const o of [0.25, 0.75]) {
              this.rawQuad(BUF_OPAQUE, [[x + o, y, z], [x + o, y, z + 1], [x + o, y + 1, z + 1], [x + o, y + 1, z]], t, sky, blk, 0.9);
              this.rawQuad(BUF_OPAQUE, [[x, y, z + o], [x + 1, y, z + o], [x + 1, y + 1, z + o], [x, y + 1, z + o]], t, sky, blk, 0.9);
            }
          } else {
            const a = 0.15, b = 0.85;
            this.rawQuad(BUF_OPAQUE, [[x + a, y, z + a], [x + b, y, z + b], [x + b, y + 1, z + b], [x + a, y + 1, z + a]], t, sky, blk, 0.9);
            this.rawQuad(BUF_OPAQUE, [[x + a, y, z + b], [x + b, y, z + a], [x + b, y + 1, z + a], [x + a, y + 1, z + b]], t, sky, blk, 0.9);
          }
          break;
        }
        case 'torch': {
          const d = meta & 7, t = Tex.faceTile(id, meta, 0);
          const base = [7 / 16, 0, 7 / 16, 9 / 16, 10 / 16, 9 / 16];
          const bx = rotBox(base, d, true);
          for (let f = 0; f < 6; f++) {
            if (f === 3 && d === 2) continue;
            const uvb = f === 2 ? [7 / 16, 0, 8 / 16, 9 / 16, 10 / 16, 10 / 16] : base;
            this.boxFace(BUF_OPAQUE, f, bx, uvb, x, y, z, t, sky, Math.max(blk, 0.9), 1.2);
          }
          break;
        }
        case 'ladder': {
          const d = meta & 7, bx = rotBox([0, 0, 0, 1, 1, 1 / 16], d, false, true), t = Tex.faceTile(id, meta, 0);
          this.boxFace(BUF_OPAQUE, d, bx, bx, x, y, z, t, sky, blk, 1, true);
          break;
        }
        case 'fluid': {
          const water = FLUID[id] === 1;
          const buf = water ? BUF_WATER : BUF_OPAQUE;
          /** Surface height of a fluid cell at padded index q. */
          const fh = (q) => {
            if (FLUID[pid[q + PSTRIDE[1]]] === FLUID[pid[q]]) return 1;
            const m = pm[q], l = m & 7;
            return (l === 0 || (m & 8)) ? 0.875 : Math.max(0.12, (8 - l) / 8 * 0.875);
          };
          const h = fh(p);
          const t = Tex.faceTile(id, meta, 2);
          for (let d = 0; d < 6; d++) {
            const n = nb(d);
            if (FLUID[n] === FLUID[id]) {
              // Neighbouring fluid is lower: draw the exposed strip of this side.
              if (d === 2 || d === 3) continue;
              const hn = fh(p + FACES[d].no);
              if (hn < h - 0.01) {
                const q = p + FACES[d].no, Lq = pl[q];
                this.boxFace(buf, d, [0, hn, 0, 1, h, 1], [0, hn, 0, 1, h, 1], x, y, z, t, (Lq >> 4) / 15, Math.max((Lq & 15) / 15, water ? 0 : 0.8), 1);
              }
              continue;
            }
            if (d !== 2 && OPAQUE[n]) continue;
            if (d === 2 && OPAQUE[n] && h >= 1) continue;
            if (water && n === B.ice) continue;
            const q = p + FACES[d].no, Lq = OPAQUE[pid[q]] ? L : pl[q];
            this.boxFace(buf, d, [0, 0, 0, 1, h, 1], [0, 0, 0, 1, h, 1], x, y, z, t, (Lq >> 4) / 15, Math.max((Lq & 15) / 15, water ? 0 : 0.8), 1);
          }
          break;
        }
        case 'farmland': case 'cactus': case 'chest': case 'slabish': case 'repeater': case 'door': {
          let bx;
          if (def.shape === 'farmland') bx = [0, 0, 0, 1, 15 / 16, 1];
          else if (def.shape === 'cactus') bx = [1 / 16, 0, 1 / 16, 15 / 16, 1, 15 / 16];
          else if (def.shape === 'chest') bx = [1 / 16, 0, 1 / 16, 15 / 16, 14 / 16, 15 / 16];
          else if (def.shape === 'slabish') bx = [0, 0, 0, 1, def.height || 12 / 16, 1];
          else if (def.shape === 'repeater') bx = [0, 0, 0, 1, 2 / 16, 1];
          else bx = doorBox(meta);
          const stone = Tex.tileIndex.get('stone');
          const tf = def.shape === 'repeater' ? (d) => (d === 2 ? Tex.blockTiles[id][2] : stone) : tileFn;
          const cull = (d) => (d !== 2 || def.shape === 'cactus') && OPAQUE[nb(d)] && (def.shape === 'farmland' || def.shape === 'slabish' ? d !== 2 : d === 3);
          const uvb = def.shape === 'door' ? [0, 0, 0, 1, 1, 1] : bx;
          for (let d = 0; d < 6; d++) {
            if (cull(d)) continue;
            if (def.shape === 'cactus' && (d === 2 || d === 3) && nb(d) === B.cactus) continue;
            const q = p + FACES[d].no, Lq = (def.shape === 'farmland' && !OPAQUE[pid[q]]) ? pl[q] : L;
            this.boxFace(BUF_OPAQUE, d, bx, uvb, x, y, z, tf(d), (Lq >> 4) / 15, (Lq & 15) / 15, 1, def.shape === 'door');
          }
          break;
        }
        case 'lever': {
          const d = meta & 7, on = (meta & 8) !== 0;
          const cob = Tex.tileIndex.get('cobblestone'), t = Tex.faceTile(id, meta, 0);
          this.box(BUF_OPAQUE, rotBox([5 / 16, 0, 4 / 16, 11 / 16, 3 / 16, 12 / 16], d), x, y, z, () => cob, sky, blk);
          const off = on ? 3 / 16 : -3 / 16;
          this.box(BUF_OPAQUE, rotBox([7 / 16, 3 / 16, 7 / 16 + off, 9 / 16, 11 / 16, 9 / 16 + off], d), x, y, z, () => t, sky, blk, null, [7 / 16, 3 / 16, 7 / 16, 9 / 16, 13 / 16, 9 / 16]);
          break;
        }
        case 'button': {
          const d = meta & 7, pressed = (meta & 8) !== 0;
          const t = Tex.faceTile(id, meta, 0);
          this.box(BUF_OPAQUE, rotBox([5 / 16, 0, 6 / 16, 11 / 16, pressed ? 1 / 16 : 2 / 16, 10 / 16], d), x, y, z, () => t, sky, blk);
          break;
        }
        case 'dust': {
          const t = Tex.faceTile(id, meta, 2);
          const pw = (meta & 15) / 15;
          this.boxFace(BUF_OPAQUE, 2, [0, 0, 0, 1, 1 / 64, 1], [0, 0, 0, 1, 1, 1], x, y, z, t, sky, Math.max(blk, pw * 0.5), 1);
          break;
        }
        case 'endportal': {
          this.boxFace(BUF_OPAQUE, 2, [0, 0, 0, 1, 0.75, 1], [0, 0, 0, 1, 1, 1], x, y, z, Tex.faceTile(id, meta, 2), 1, 1, 1);
          break;
        }
        case 'brewing': {
          const base = Tex.tileIndex.get('brewing_stand_base'), t = Tex.faceTile(id, meta, 0);
          this.box(BUF_OPAQUE, [1 / 16, 0, 1 / 16, 15 / 16, 2 / 16, 15 / 16], x, y, z, () => base, sky, blk);
          this.rawQuad(BUF_OPAQUE, [[x + 0.1, y, z + 0.1], [x + 0.9, y, z + 0.9], [x + 0.9, y + 1, z + 0.9], [x + 0.1, y + 1, z + 0.1]], t, sky, blk, 0.9);
          this.rawQuad(BUF_OPAQUE, [[x + 0.1, y, z + 0.9], [x + 0.9, y, z + 0.1], [x + 0.9, y + 1, z + 0.1], [x + 0.1, y + 1, z + 0.9]], t, sky, blk, 0.9);
          break;
        }
        case 'portal': {
          const bx = (meta & 1) ? [6 / 16, 0, 0, 10 / 16, 1, 1] : [0, 0, 6 / 16, 1, 1, 10 / 16];
          const t = Tex.faceTile(id, meta, 0);
          for (let d = 0; d < 6; d++) {
            if (pid[p + FACES[d].no] === id) continue;
            this.boxFace(BUF_WATER, d, bx, [0, 0, 0, 1, 1, 1], x, y, z, t, sky, 1, 1);
          }
          break;
        }
        case 'cube': { // translucent cubes (ice)
          for (let d = 0; d < 6; d++) {
            const n = nb(d);
            if (this.hides(id, n)) continue;
            const q = p + FACES[d].no, Lq = OPAQUE[pid[q]] ? L : pl[q];
            this.boxFace(BUF_WATER, d, [0, 0, 0, 1, 1, 1], [0, 0, 0, 1, 1, 1], x, y, z, tileFn(d), (Lq >> 4) / 15, (Lq & 15) / 15);
          }
          break;
        }
      }
    }
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// §8 RENDERER — scene, custom voxel shader, sky, sun/moon, clouds, particles
// ═══════════════════════════════════════════════════════════════════════════
const CHUNK_VS = `
attribute vec2 aUV; attribute float aTile; attribute vec3 aLight;
varying vec2 vUV; varying float vTile; varying vec3 vLight; varying float vDist;
void main() {
  vUV = aUV; vTile = aTile; vLight = aLight;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vDist = length(mv.xyz);
  gl_Position = projectionMatrix * mv;
}`;
const CHUNK_FS = `
uniform sampler2D uAtlas; uniform float uCols; uniform float uDaylight; uniform float uAmbient;
uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar; uniform float uAlpha; uniform float uAlphaTest;
varying vec2 vUV; varying float vTile; varying vec3 vLight; varying float vDist;
void main() {
  vec2 t = fract(vUV);
  t.y = 1.0 - t.y;
  float tile = floor(vTile + 0.5);
  vec2 cell = vec2(mod(tile, uCols), floor(tile / uCols));
  vec4 c = texture2D(uAtlas, (cell + clamp(t, 0.0005, 0.9995)) / uCols);
  if (c.a < uAlphaTest) discard;
  float sky = vLight.x * uDaylight;
  float blk = vLight.y;
  float sb = sky / (3.0 - 2.0 * sky);
  float bb = blk / (3.0 - 2.0 * blk);
  vec3 lc = max(vec3(sb), vec3(bb, bb * 0.9, bb * 0.75));
  lc = max(lc, vec3(uAmbient));
  c.rgb *= lc * vLight.z;
  c.rgb = mix(c.rgb, uFogColor, smoothstep(uFogNear, uFogFar, vDist));
  gl_FragColor = vec4(c.rgb, c.a * uAlpha);
}`;
const SKY_VS = `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const SKY_FS = `
uniform vec3 uTop; uniform vec3 uHorizon; uniform vec3 uBottom; uniform vec3 uSunDir; uniform vec3 uGlow; uniform float uGlowAmt;
varying vec3 vDir;
void main(){
  vec3 d = normalize(vDir);
  float h = d.y;
  vec3 c = h > 0.0 ? mix(uHorizon, uTop, smoothstep(0.0, 0.45, h)) : mix(uHorizon, uBottom, smoothstep(0.0, -0.25, h));
  float g = pow(max(dot(d, uSunDir), 0.0), 6.0) * uGlowAmt * (1.0 - smoothstep(0.0, 0.5, abs(h)));
  c = mix(c, uGlow, clamp(g, 0.0, 1.0));
  gl_FragColor = vec4(c, 1.0);
}`;

const Renderer = {
  init(container) {
    const r = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    r.setSize(window.innerWidth, window.innerHeight);
    r.autoClear = false;
    container.appendChild(r.domElement);
    this.gl = r;
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(SETTINGS.fov, window.innerWidth / window.innerHeight, 0.05, 1200);
    this.camera.rotation.order = 'YXZ';
    this.chunkGroup = new THREE.Group();
    this.scene.add(this.chunkGroup);
    this.entityGroup = new THREE.Group();
    this.scene.add(this.entityGroup);
    // Lights only affect entity (Lambert) materials; voxels use the custom shader.
    this.ambient = new THREE.AmbientLight(0xffffff, 0.75);
    this.sunLight = new THREE.DirectionalLight(0xffffff, 0.45);
    this.sunLight.position.set(0.4, 1, 0.25);
    this.scene.add(this.ambient, this.sunLight);
    const uniforms = () => ({
      uAtlas: { value: null }, uCols: { value: 16 }, uDaylight: { value: 1 }, uAmbient: { value: 0.03 },
      uFogColor: { value: new THREE.Color(0xc0d8ff) }, uFogNear: { value: 60 }, uFogFar: { value: 90 }, uAlpha: { value: 1 }, uAlphaTest: { value: 0.5 },
    });
    this.chunkMat = new THREE.ShaderMaterial({ uniforms: uniforms(), vertexShader: CHUNK_VS, fragmentShader: CHUNK_FS });
    this.waterMat = new THREE.ShaderMaterial({ uniforms: uniforms(), vertexShader: CHUNK_VS, fragmentShader: CHUNK_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide });
    this.waterMat.uniforms.uAlphaTest.value = 0.02;
    this.mats = [this.chunkMat, this.waterMat];
    this.buildSky();
    this.buildOverlays();
    this.buildParticles();
    this.buildHand();
    this.applyAtlas();
    window.addEventListener('resize', () => this.resize());
  },
  resize() {
    this.gl.setSize(window.innerWidth, window.innerHeight);
    this.camera.aspect = window.innerWidth / window.innerHeight; this.camera.updateProjectionMatrix();
    this.handCam.aspect = this.camera.aspect; this.handCam.updateProjectionMatrix();
  },
  /** Called after the texture atlas changes (pack loaded). */
  applyAtlas() {
    for (const m of this.mats) { m.uniforms.uAtlas.value = Tex.atlasTexture; m.uniforms.uCols.value = Tex.cols; }
    this.crackTex = Tex.destroy.map((c) => { const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; return t; });
    const mk = (c) => { const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; return t; };
    this.sunMesh.material.map = mk(Tex.extra.sun); this.sunMesh.material.needsUpdate = true;
    this.moonMesh.material.map = mk(Tex.extra.moon); this.moonMesh.material.needsUpdate = true;
    this.itemMatCache = new Map(); this.itemGeoCache = new Map();
    this.refreshHand = true;
  },
  /** (Re)build GPU meshes for a chunk from the mesher buffers. */
  buildChunkMesh(world, ch) {
    if (!Mesher.build(world, ch)) return false;
    this.disposeChunk(ch);
    const mk = (buf, mat) => {
      if (!buf.v) return null;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(buf.pos.view(), 3));
      g.setAttribute('aUV', new THREE.BufferAttribute(buf.uv.view(), 2));
      g.setAttribute('aTile', new THREE.BufferAttribute(buf.tile.view(), 1));
      g.setAttribute('aLight', new THREE.BufferAttribute(buf.light.view(), 3));
      g.setIndex(new THREE.BufferAttribute(buf.idx.view(), 1));
      g.computeBoundingSphere();
      const m = new THREE.Mesh(g, mat);
      m.position.set(ch.cx * 16, 0, ch.cz * 16);
      m.matrixAutoUpdate = false; m.updateMatrix();
      this.chunkGroup.add(m);
      return m;
    };
    ch.mesh = mk(BUF_OPAQUE, this.chunkMat);
    ch.waterMesh = mk(BUF_WATER, this.waterMat);
    ch.meshed = true; ch.dirty = false;
    return true;
  },
  disposeChunk(ch) {
    for (const k of ['mesh', 'waterMesh']) {
      const m = ch[k];
      if (m) { this.chunkGroup.remove(m); m.geometry.dispose(); ch[k] = null; }
    }
  },
  clearChunks() { for (const m of [...this.chunkGroup.children]) { this.chunkGroup.remove(m); m.geometry.dispose(); } },

  // ─── sky ───────────────────────────────────────────────────────────────
  buildSky() {
    this.skyMat = new THREE.ShaderMaterial({
      uniforms: { uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() }, uBottom: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3(1, 0, 0) }, uGlow: { value: new THREE.Color(0xff8a3a) }, uGlowAmt: { value: 0 } },
      vertexShader: SKY_VS, fragmentShader: SKY_FS, side: THREE.BackSide, depthWrite: false, depthTest: false,
    });
    this.sky = new THREE.Mesh(new THREE.SphereGeometry(500, 24, 12), this.skyMat);
    this.sky.renderOrder = -1000; this.sky.frustumCulled = false;
    this.scene.add(this.sky);
    const bodyMat = (add) => new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, depthTest: true, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending, fog: false });
    this.sunMesh = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), bodyMat(true));
    this.moonMesh = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), bodyMat(false));
    for (const m of [this.sunMesh, this.moonMesh]) { m.renderOrder = -998; m.frustumCulled = false; this.scene.add(m); }
    // Stars.
    const sg = new THREE.BufferGeometry(), sp = [];
    const rng = mulberry32(42);
    for (let i = 0; i < 700; i++) {
      const u = rng() * 2 - 1, th = rng() * Math.PI * 2, r = Math.sqrt(1 - u * u);
      sp.push(Math.cos(th) * r * 420, u * 420, Math.sin(th) * r * 420);
    }
    sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
    this.stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, depthWrite: false, depthTest: true, fog: false }));
    this.stars.renderOrder = -999; this.stars.frustumCulled = false;
    this.scene.add(this.stars);
    // Clouds: a tiled, slowly drifting texture on a large plane.
    const cc = makeCanvas(64, 64), cctx = cc.getContext('2d'), img = cctx.createImageData(64, 64);
    const cn = new SimplexNoise(7);
    for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
      const nx = Math.cos(x / 64 * Math.PI * 2), ny = Math.sin(x / 64 * Math.PI * 2);
      const v = cn.noise3D(nx * 1.6, ny * 1.6, y / 64 * 6) + cn.noise3D(nx * 4, ny * 4, y / 64 * 14) * 0.4;
      const i = (y * 64 + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = v > 0.25 ? 220 : 0;
    }
    cctx.putImageData(img, 0, 0);
    const ct = new THREE.CanvasTexture(cc);
    ct.magFilter = ct.minFilter = THREE.NearestFilter; ct.wrapS = ct.wrapT = THREE.RepeatWrapping; ct.repeat.set(1536 / 768, 1536 / 768);
    this.cloudTex = ct;
    this.clouds = new THREE.Mesh(new THREE.PlaneGeometry(1536, 1536), new THREE.MeshBasicMaterial({ map: ct, transparent: true, opacity: 0.8, depthWrite: false, side: THREE.DoubleSide, fog: false }));
    this.clouds.rotation.x = -Math.PI / 2;
    this.clouds.renderOrder = 10;
    this.scene.add(this.clouds);
  },
  /** Update sky, fog and shader lighting uniforms. */
  updateEnvironment(time, cam, world, underFluid, weather) {
    const angle = (time / DAY_TICKS) * Math.PI * 2;
    const sunDir = new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0.2).normalize();
    const elev = sunDir.y;
    let daylight = 0.18 + 0.82 * smoothstep(-0.18, 0.22, elev);
    daylight *= 1 - weather * 0.35;
    const nether = world.dim === 'nether';
    const top = new THREE.Color(), hor = new THREE.Color();
    const dayTop = new THREE.Color(0x6f9dff), dayHor = new THREE.Color(0xbcd6ff), nightTop = new THREE.Color(0x02030a), nightHor = new THREE.Color(0x0b1024);
    const k = smoothstep(-0.2, 0.25, elev);
    top.copy(nightTop).lerp(dayTop, k); hor.copy(nightHor).lerp(dayHor, k);
    if (weather > 0) { const gray = new THREE.Color(0x6a7280).multiplyScalar(0.35 + 0.65 * k); top.lerp(gray, weather * 0.8); hor.lerp(gray, weather * 0.8); }
    const sunset = (1 - smoothstep(0, 0.35, Math.abs(elev))) * (1 - weather);
    let fog = hor.clone();
    // Fog leans towards the sunset glow when looking at the sun.
    const fwd = new THREE.Vector3(); cam.getWorldDirection(fwd);
    fog.lerp(new THREE.Color(0xff9a50), sunset * 0.5 * Math.max(0, fwd.dot(sunDir)));
    const rd = SETTINGS.renderDistance * 16;
    let near = rd * 0.55, far = rd - 6;
    if (nether) { top.set(0x2a0606); hor.set(0x3a0a0a); fog.set(0x3a0a0a); daylight = 0; near = 8; far = Math.min(far, 80); }
    const end = world.dim === 'end';
    if (end) { top.set(0x160c22); hor.set(0x0e0818); fog.set(0x0e0818); daylight = 0; near = 40; far = Math.max(far, 110); }
    if (underFluid === 1) { fog.set(0x1a3a8a).multiplyScalar(0.4 + 0.6 * daylight); near = 1; far = 22; }
    else if (underFluid === 2) { fog.set(0xd05a10); near = 0.2; far = 2.5; }
    this.skyMat.uniforms.uTop.value.copy(top);
    this.skyMat.uniforms.uHorizon.value.copy(nether || end ? hor : fog);
    this.skyMat.uniforms.uBottom.value.copy(nether || end ? hor : fog);
    this.skyMat.uniforms.uSunDir.value.copy(sunDir);
    this.skyMat.uniforms.uGlowAmt.value = nether || end ? 0 : sunset;
    for (const m of this.mats) {
      const u = m.uniforms;
      u.uDaylight.value = daylight; u.uFogColor.value.copy(fog); u.uFogNear.value = near; u.uFogFar.value = far;
      u.uAmbient.value = nether ? 0.1 : end ? 0.3 : 0.025;
    }
    this.gl.setClearColor(fog);
    const p = cam.position;
    this.sky.position.copy(p);
    this.sunMesh.visible = this.moonMesh.visible = this.clouds.visible = !nether && !end;
    this.stars.visible = !nether;
    this.sunMesh.position.copy(p).addScaledVector(sunDir, 300); this.sunMesh.lookAt(p);
    this.moonMesh.position.copy(p).addScaledVector(sunDir, -300); this.moonMesh.lookAt(p);
    this.sunMesh.material.opacity = 1 - weather;
    this.moonMesh.material.opacity = 1 - weather * 0.8;
    this.stars.position.copy(p);
    this.stars.rotation.z = angle;
    this.stars.material.opacity = end ? 0.6 : (1 - smoothstep(-0.25, 0.05, elev)) * (1 - weather);
    const cloudY = 150;
    this.clouds.position.set(Math.floor(p.x / 12) * 12, cloudY, Math.floor(p.z / 12) * 12);
    this.cloudTex.offset.set(((this.clouds.position.x + time * 0.03) / 768) % 1, (-this.clouds.position.z / 768) % 1);
    this.clouds.material.color.setScalar(0.25 + 0.75 * daylight);
    this.ambient.intensity = nether || end ? 0.6 : 0.35 + 0.4 * daylight;
    this.sunLight.intensity = nether ? 0.2 : 0.15 + 0.35 * daylight;
    this.daylight = daylight;
    return daylight;
  },

  // ─── overlays: selection box, crack overlay ────────────────────────────
  buildOverlays() {
    const eg = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
    this.selBox = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.55 }));
    this.selBox.visible = false;
    this.scene.add(this.selBox);
    this.crack = new THREE.Mesh(new THREE.BoxGeometry(1.004, 1.004, 1.004), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, opacity: 0.85 }));
    this.crack.visible = false;
    this.scene.add(this.crack);
  },
  showSelection(hit) {
    if (!hit) { this.selBox.visible = false; return; }
    const bx = Blocks.selection(hit.id, hit.meta)[0];
    this.selBox.visible = true;
    this.selBox.scale.set(bx[3] - bx[0] + 0.004, bx[4] - bx[1] + 0.004, bx[5] - bx[2] + 0.004);
    this.selBox.position.set(hit.x + (bx[0] + bx[3]) / 2, hit.y + (bx[1] + bx[4]) / 2, hit.z + (bx[2] + bx[5]) / 2);
  },
  showCrack(x, y, z, stage) {
    if (stage < 0) { this.crack.visible = false; return; }
    this.crack.visible = true;
    this.crack.position.set(x + 0.5, y + 0.5, z + 0.5);
    const t = this.crackTex[clamp(stage, 0, 9)];
    if (this.crack.material.map !== t) { this.crack.material.map = t; this.crack.material.needsUpdate = true; }
  },

  // ─── particles ─────────────────────────────────────────────────────────
  buildParticles() {
    const N = 3000;
    this.pN = N;
    this.pPos = new Float32Array(N * 3); this.pCol = new Float32Array(N * 3);
    this.pVel = new Float32Array(N * 3); this.pLife = new Float32Array(N); this.pGrav = new Float32Array(N);
    this.pCount = 0;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pPos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(this.pCol, 3));
    this.particles = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.12, vertexColors: true, sizeAttenuation: true }));
    this.particles.frustumCulled = false;
    this.scene.add(this.particles);
    // Weather (rain streaks / snow flakes) around the player.
    const W = 1400;
    this.wN = W; this.wPos = new Float32Array(W * 3); this.wSpd = new Float32Array(W);
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.BufferAttribute(this.wPos, 3));
    this.weatherPts = new THREE.Points(wg, new THREE.PointsMaterial({ size: 0.09, color: 0x8fb0ff, transparent: true, opacity: 0.7, depthWrite: false }));
    this.weatherPts.frustumCulled = false; this.weatherPts.visible = false;
    this.scene.add(this.weatherPts);
  },
  /** Spawn n particles at (x,y,z) with colour [r,g,b], spread & speed. */
  emit(x, y, z, n, col, spread = 0.4, speed = 3, gravity = 12, life = 0.8) {
    for (let k = 0; k < n; k++) {
      let i = this.pCount < this.pN ? this.pCount++ : Math.floor(Math.random() * this.pN);
      this.pPos[i * 3] = x + (Math.random() - 0.5) * spread; this.pPos[i * 3 + 1] = y + (Math.random() - 0.5) * spread; this.pPos[i * 3 + 2] = z + (Math.random() - 0.5) * spread;
      this.pVel[i * 3] = (Math.random() - 0.5) * speed; this.pVel[i * 3 + 1] = Math.random() * speed * 0.8; this.pVel[i * 3 + 2] = (Math.random() - 0.5) * speed;
      const f = 0.8 + Math.random() * 0.3;
      this.pCol[i * 3] = col[0] * f; this.pCol[i * 3 + 1] = col[1] * f; this.pCol[i * 3 + 2] = col[2] * f;
      this.pLife[i] = life * (0.6 + Math.random() * 0.6); this.pGrav[i] = gravity;
    }
  },
  updateParticles(dt) {
    let n = this.pCount;
    for (let i = 0; i < n; i++) {
      this.pLife[i] -= dt;
      if (this.pLife[i] <= 0) {
        n--; // swap-remove
        for (let k = 0; k < 3; k++) { this.pPos[i * 3 + k] = this.pPos[n * 3 + k]; this.pVel[i * 3 + k] = this.pVel[n * 3 + k]; this.pCol[i * 3 + k] = this.pCol[n * 3 + k]; }
        this.pLife[i] = this.pLife[n]; this.pGrav[i] = this.pGrav[n];
        i--; continue;
      }
      this.pVel[i * 3 + 1] -= this.pGrav[i] * dt;
      this.pPos[i * 3] += this.pVel[i * 3] * dt; this.pPos[i * 3 + 1] += this.pVel[i * 3 + 1] * dt; this.pPos[i * 3 + 2] += this.pVel[i * 3 + 2] * dt;
    }
    this.pCount = n;
    const g = this.particles.geometry;
    g.setDrawRange(0, n);
    g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true;
  },
  updateWeather(dt, world, p, kind, strength) {
    const pts = this.weatherPts;
    pts.visible = strength > 0.05 && kind !== 'none';
    if (!pts.visible) return;
    const snow = kind === 'snow';
    pts.material.color.set(snow ? 0xffffff : 0x8fb0ff);
    pts.material.size = snow ? 0.13 : 0.08;
    const active = Math.floor(this.wN * strength);
    for (let i = 0; i < this.wN; i++) {
      const j = i * 3;
      if (i >= active) { this.wPos[j + 1] = -999; continue; }
      if (this.wPos[j + 1] < -900 || Math.abs(this.wPos[j] - p.x) > 20 || Math.abs(this.wPos[j + 2] - p.z) > 20) {
        this.wPos[j] = p.x + (Math.random() - 0.5) * 40; this.wPos[j + 2] = p.z + (Math.random() - 0.5) * 40;
        this.wPos[j + 1] = p.y + 8 + Math.random() * 16; this.wSpd[i] = snow ? 2 + Math.random() : 16 + Math.random() * 6;
      }
      this.wPos[j + 1] -= this.wSpd[i] * dt;
      if (snow) this.wPos[j] += Math.sin(this.wPos[j + 1] * 0.7 + i) * dt * 0.5;
      const ground = world.topY(Math.floor(this.wPos[j]), Math.floor(this.wPos[j + 2]));
      if (this.wPos[j + 1] < ground + 1 || this.wPos[j + 1] < p.y - 12) {
        if (!snow && Math.random() < 0.03 && this.wPos[j + 1] > p.y - 6) this.emit(this.wPos[j], ground + 1.05, this.wPos[j + 2], 1, [0.6, 0.7, 1], 0.1, 1, 8, 0.2);
        this.wPos[j + 1] = -999;
      }
    }
    pts.geometry.attributes.position.needsUpdate = true;
  },

  // ─── item meshes (dropped items, held item) ────────────────────────────
  /** Geometry for a block item: a unit cube with atlas UVs per face. */
  blockItemGeometry(id) {
    const key = 'b' + id;
    if (this.itemGeoCache.has(key)) return this.itemGeoCache.get(key);
    const g = new THREE.BoxGeometry(1, 1, 1);
    const uv = g.attributes.uv;
    const cols = Tex.cols;
    for (let f = 0; f < 6; f++) {
      const tile = Tex.faceTile(id, 0, f);
      const cx = tile % cols, cy = Math.floor(tile / cols);
      for (let k = 0; k < 4; k++) {
        const i = f * 4 + k;
        const u = uv.getX(i), v = uv.getY(i);
        uv.setXY(i, (cx + 0.001 + u * 0.998) / cols, (cy + 0.001 + (1 - v) * 0.998) / cols);
      }
    }
    g.userData.shared = true;
    this.itemGeoCache.set(key, g);
    return g;
  },
  /** Material for an item (atlas material for block items, sprite for flat ones). */
  itemMaterial(id) {
    const cube = Tex.isCubeIcon(id);
    const key = cube ? 'atlas' : 'f' + id;
    if (this.itemMatCache.has(key)) return this.itemMatCache.get(key).clone();
    let m;
    if (cube) m = new THREE.MeshLambertMaterial({ map: Tex.atlasTexture, alphaTest: 0.5 });
    else {
      const t = new THREE.CanvasTexture(Tex.flat(id));
      t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
      m = new THREE.MeshLambertMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide });
    }
    this.itemMatCache.set(key, m);
    return m.clone();
  },
  /** A mesh for an item stack (cube for blocks, flat plane otherwise). */
  itemMesh(id, size = 0.25) {
    let mesh;
    if (Tex.isCubeIcon(id)) mesh = new THREE.Mesh(this.blockItemGeometry(id), this.itemMaterial(id));
    else {
      if (!this.itemGeoCache.has('plane')) { const pg = new THREE.PlaneGeometry(1, 1); pg.userData.shared = true; this.itemGeoCache.set('plane', pg); }
      mesh = new THREE.Mesh(this.itemGeoCache.get('plane'), this.itemMaterial(id));
      size *= 1.6;
    }
    mesh.scale.setScalar(size);
    return mesh;
  },
  buildHand() {
    this.handScene = new THREE.Scene();
    this.handCam = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 10);
    this.handScene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dl = new THREE.DirectionalLight(0xffffff, 0.5); dl.position.set(-0.5, 1, 0.6); this.handScene.add(dl);
    this.handPivot = new THREE.Group();
    this.handScene.add(this.handPivot);
    this.handId = -1;
  },
  /** Update the first-person held item / arm. */
  updateHand(stack, swing, bob, brightness, visible) {
    const id = stack ? stack.id : 0;
    if (id !== this.handId || this.refreshHand) {
      this.refreshHand = false;
      this.handId = id;
      while (this.handPivot.children.length) { const old = this.handPivot.children[0]; this.handPivot.remove(old); disposeTree(old); }
      let m;
      if (!id) {
        m = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.7), new THREE.MeshLambertMaterial({ color: 0xc89a78 }));
        m.userData.base = new THREE.Color(0xc89a78);
        m.position.set(0.1, -0.08, 0.1);
        m.rotation.set(0.15, 0.1, 0);
      } else if (Tex.isCubeIcon(id)) {
        m = this.itemMesh(id, 0.3);
        m.rotation.set(0.1, Math.PI / 4, 0);
      } else {
        m = this.itemMesh(id, 0.28);
        m.rotation.set(0, -Math.PI / 2 + 0.4, 0.5);
      }
      this.handPivot.add(m);
      this.handMesh = m;
    }
    this.handPivot.visible = visible;
    const s = Math.sin(swing * Math.PI);
    this.handPivot.position.set(0.56 - s * 0.25, -0.5 + Math.sin(bob * 2) * 0.02 + s * 0.12, -0.95 - s * 0.2);
    this.handPivot.rotation.set(-s * 0.9, -s * 0.3, s * 0.2);
    if (this.handMesh && this.handMesh.material && this.handMesh.material.color) {
      const k = clamp(brightness, 0.15, 1), base = this.handMesh.userData.base;
      if (base) this.handMesh.material.color.copy(base).multiplyScalar(k); else this.handMesh.material.color.setScalar(k);
    }
  },
  render() {
    const g = this.gl;
    g.clear();
    g.render(this.scene, this.camera);
    g.clearDepth();
    g.render(this.handScene, this.handCam);
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// §9 PHYSICS — swept AABB against per-block collision boxes (Minecraft-style:
// resolve Y, then X, then Z; step-up retry when blocked horizontally).
// ═══════════════════════════════════════════════════════════════════════════
const Physics = {
  _boxes: [],
  /** Collect world-space collision boxes intersecting the given region. */
  gather(world, x0, y0, z0, x1, y1, z1) {
    const out = this._boxes; out.length = 0;
    for (let x = Math.floor(x0); x <= Math.floor(x1); x++) for (let z = Math.floor(z0); z <= Math.floor(z1); z++) {
      const loaded = world.isLoaded(x, z);
      for (let y = Math.floor(y0); y <= Math.floor(y1); y++) {
        if (!loaded) { out.push([x, y, z, x + 1, y + 1, z + 1]); continue; }
        if (y >= HEIGHT) continue;
        const id = world.getBlock(x, y, z);
        if (!id || !SOLID[id]) continue;
        const bs = Blocks.collision(id, world.getMeta(x, y, z));
        if (bs) for (const b of bs) out.push([x + b[0], y + b[1], z + b[2], x + b[3], y + b[4], z + b[5]]);
      }
    }
    return out;
  },
  clip(boxes, bb, axis, d) {
    if (d === 0) return 0;
    const o1 = (axis + 1) % 3, o2 = (axis + 2) % 3, eps = 1e-7;
    for (const b of boxes) {
      if (bb[3 + o1] <= b[o1] + eps || bb[o1] >= b[3 + o1] - eps || bb[3 + o2] <= b[o2] + eps || bb[o2] >= b[3 + o2] - eps) continue;
      if (d > 0 && bb[3 + axis] <= b[axis] + eps) d = Math.min(d, b[axis] - bb[3 + axis]);
      else if (d < 0 && bb[axis] >= b[3 + axis] - eps) d = Math.max(d, b[3 + axis] - bb[axis]);
    }
    return d;
  },
  shift(bb, axis, d) { bb[axis] += d; bb[3 + axis] += d; },
  /** Does the box overlap any collision box? */
  collides(world, bb) {
    const bs = this.gather(world, bb[0], bb[1], bb[2], bb[3] - 1e-6, bb[4] - 1e-6, bb[5] - 1e-6);
    for (const b of bs) if (bb[0] < b[3] && bb[3] > b[0] && bb[1] < b[4] && bb[4] > b[1] && bb[2] < b[5] && bb[5] > b[2]) return true;
    return false;
  },
  /** Move entity e by (dx,dy,dz) with collision. Updates e.x/y/z, onGround, hit flags. */
  move(world, e, dx, dy, dz) {
    const hw = e.w / 2;
    // Sneak edge protection: don't walk off ledges while sneaking on the ground.
    if (e.sneaking && e.onGround && !e.flying) {
      const probe = (ox, oz) => this.collides(world, [e.x - hw + ox, e.y - 0.6, e.z - hw + oz, e.x + hw + ox, e.y, e.z + hw + oz]);
      const step = 0.05;
      while (dx !== 0 && !probe(dx, 0)) dx = Math.abs(dx) < step ? 0 : dx - Math.sign(dx) * step;
      while (dz !== 0 && !probe(0, dz)) dz = Math.abs(dz) < step ? 0 : dz - Math.sign(dz) * step;
      while (dx !== 0 && dz !== 0 && !probe(dx, dz)) { dx = Math.abs(dx) < step ? 0 : dx - Math.sign(dx) * step; dz = Math.abs(dz) < step ? 0 : dz - Math.sign(dz) * step; }
    }
    const odx = dx, ody = dy, odz = dz;
    const bb0 = [e.x - hw, e.y, e.z - hw, e.x + hw, e.y + e.h, e.z + hw];
    const run = (bb, mx, my, mz, stepUp) => {
      const boxes = this.gather(world, Math.min(bb[0], bb[0] + mx) - 1, Math.min(bb[1], bb[1] + my) - 1 - (stepUp ? 0 : 0), Math.min(bb[2], bb[2] + mz) - 1,
        Math.max(bb[3], bb[3] + mx) + 1, Math.max(bb[4], bb[4] + my + (stepUp || 0)) + 1, Math.max(bb[5], bb[5] + mz) + 1);
      let sy = 0;
      if (stepUp) { sy = this.clip(boxes, bb, 1, stepUp); this.shift(bb, 1, sy); }
      my = this.clip(boxes, bb, 1, my); this.shift(bb, 1, my);
      mx = this.clip(boxes, bb, 0, mx); this.shift(bb, 0, mx);
      mz = this.clip(boxes, bb, 2, mz); this.shift(bb, 2, mz);
      if (stepUp) { const down = this.clip(boxes, bb, 1, -sy); this.shift(bb, 1, down); }
      return [mx, my, mz];
    };
    let bb = bb0.slice();
    let [mx, my, mz] = run(bb, dx, dy, dz, 0);
    const hitH = mx !== odx || mz !== odz;
    const landed = ody < 0 && my !== ody;
    e.stepped = 0;
    if (hitH && e.stepHeight > 0 && (e.onGround || landed) && !e.inWater) {
      const bb2 = bb0.slice();
      const [sx, , sz] = run(bb2, dx, Math.min(0, dy), dz, e.stepHeight);
      if (sx * sx + sz * sz > mx * mx + mz * mz + 1e-6) {
        e.stepped = bb2[1] - bb[1];
        bb = bb2; mx = sx; mz = sz; my = bb2[1] - bb0[1];
      }
    }
    e.x = (bb[0] + bb[3]) / 2; e.y = bb[1]; e.z = (bb[2] + bb[5]) / 2;
    e.hitX = mx !== odx; e.hitZ = mz !== odz;
    e.hitH = e.hitX || e.hitZ;
    const hitY = Math.abs(my - ody) > 1e-9 && e.stepped === 0;
    e.onGround = (ody < 0 && hitY) || (e.stepped > 0);
    if (hitY) e.vy = 0;
    if (e.hitX) e.vx = 0;
    if (e.hitZ) e.vz = 0;
    return my;
  },
};

/** Ray vs axis-aligned box: returns {t, d} (entry distance and face) or null. */
function rayBox(ox, oy, oz, dx, dy, dz, b) {
  let tmin = -Infinity, tmax = Infinity, face = -1;
  const o = [ox, oy, oz], d = [dx, dy, dz];
  for (let a = 0; a < 3; a++) {
    if (Math.abs(d[a]) < 1e-9) { if (o[a] < b[a] || o[a] > b[3 + a]) return null; continue; }
    let t1 = (b[a] - o[a]) / d[a], t2 = (b[3 + a] - o[a]) / d[a];
    let f = a * 2 + 1; // entering through the min side → face pointing negative
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; f = a * 2; }
    if (t1 > tmin) { tmin = t1; face = f; }
    if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return null;
  }
  if (tmax < 0) return null;
  // face index mapping: axis 0 → d 0/1, axis 1 → d 2/3, axis 2 → d 4/5
  return { t: Math.max(0, tmin), d: face };
}

/**
 * Voxel raycast (Amanatides & Woo DDA) testing each cell's selection boxes.
 * Returns {x,y,z,id,meta,d,dist} or null. opts.fluids: also hit fluid blocks.
 */
function raycast(world, ox, oy, oz, dx, dy, dz, maxDist, opts = {}) {
  let x = Math.floor(ox), y = Math.floor(oy), z = Math.floor(oz);
  const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
  const tdx = Math.abs(1 / dx), tdy = Math.abs(1 / dy), tdz = Math.abs(1 / dz);
  let tmx = (dx > 0 ? x + 1 - ox : ox - x) * tdx, tmy = (dy > 0 ? y + 1 - oy : oy - y) * tdy, tmz = (dz > 0 ? z + 1 - oz : oz - z) * tdz;
  for (let i = 0; i < 256; i++) {
    if (y >= 0 && y < HEIGHT) {
      const id = world.getBlock(x, y, z);
      if (id && (FLUID[id] ? (opts.fluids && (world.getMeta(x, y, z) & 7) === 0) : true)) {
        const meta = world.getMeta(x, y, z);
        let best = null;
        for (const b of Blocks.selection(id, meta)) {
          const r = rayBox(ox, oy, oz, dx, dy, dz, [x + b[0], y + b[1], z + b[2], x + b[3], y + b[4], z + b[5]]);
          if (r && (!best || r.t < best.t)) best = r;
        }
        if (best && best.t <= maxDist) return { x, y, z, id, meta, d: best.d, dist: best.t };
      }
    }
    if (Math.min(tmx, tmy, tmz) > maxDist) break;
    if (tmx < tmy) { if (tmx < tmz) { x += sx; tmx += tdx; } else { z += sz; tmz += tdz; } }
    else { if (tmy < tmz) { y += sy; tmy += tdy; } else { z += sz; tmz += tdz; } }
  }
  return null;
}

// ─── A* pathfinding for mobs ──────────────────────────────────────────────
const Path = {
  blocked(w, x, y, z) {
    const id = w.getBlock(x, y, z);
    return SOLID[id] === 1 || id === B.lava || id === B.fire || id === B.cactus;
  },
  standable(w, x, y, z) {
    if (!w.isLoaded(x, z)) return false;
    if (this.blocked(w, x, y, z) || this.blocked(w, x, y + 1, z)) return false;
    const below = w.getBlock(x, y - 1, z);
    return (SOLID[below] === 1 && below !== B.cactus) || FLUID[w.getBlock(x, y, z)] === 1;
  },
  /** Grid A* from feet cell to target cell; returns array of [x,y,z] or null. */
  find(w, sx, sy, sz, tx, ty, tz, maxNodes = 350) {
    const key = (x, y, z) => x + ',' + y + ',' + z;
    const h = (x, y, z) => Math.abs(x - tx) + Math.abs(y - ty) * 0.5 + Math.abs(z - tz);
    const open = [], seen = new Map();
    const start = { x: sx, y: sy, z: sz, g: 0, f: h(sx, sy, sz), p: null };
    open.push(start); seen.set(key(sx, sy, sz), start);
    let best = start, n = 0;
    const pop = () => { // tiny binary heap on f
      const top = open[0], last = open.pop();
      if (open.length) {
        open[0] = last;
        for (let i = 0; ;) {
          const l = i * 2 + 1, r = l + 1; let m = i;
          if (l < open.length && open[l].f < open[m].f) m = l;
          if (r < open.length && open[r].f < open[m].f) m = r;
          if (m === i) break;
          [open[i], open[m]] = [open[m], open[i]]; i = m;
        }
      }
      return top;
    };
    const push = (node) => {
      open.push(node);
      for (let i = open.length - 1; i > 0;) { const p = (i - 1) >> 1; if (open[p].f <= open[i].f) break; [open[p], open[i]] = [open[i], open[p]]; i = p; }
    };
    while (open.length && n++ < maxNodes) {
      const c = pop();
      if (c.closed) continue;
      c.closed = true;
      if (h(c.x, c.y, c.z) < h(best.x, best.y, best.z)) best = c;
      if (c.x === tx && c.z === tz && Math.abs(c.y - ty) <= 1) { best = c; break; }
      for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = c.x + dx, nz = c.z + dz;
        let ny = null;
        if (this.standable(w, nx, c.y, nz)) ny = c.y;
        else if (!this.blocked(w, c.x, c.y + 2, c.z) && this.standable(w, nx, c.y + 1, nz)) ny = c.y + 1;
        else for (let dd = 1; dd <= 3; dd++) {
          if (this.blocked(w, nx, c.y - dd + 1, nz) || this.blocked(w, nx, c.y - dd + 2, nz)) break;
          if (this.standable(w, nx, c.y - dd, nz)) { ny = c.y - dd; break; }
        }
        if (ny === null) continue;
        const k = key(nx, ny, nz);
        const g = c.g + 1 + (ny !== c.y ? 0.5 : 0);
        const ex = seen.get(k);
        if (ex && (ex.closed || ex.g <= g)) continue;
        const node = { x: nx, y: ny, z: nz, g, f: g + h(nx, ny, nz), p: c };
        seen.set(k, node); push(node);
      }
    }
    if (best === start) return null;
    const path = [];
    for (let c = best; c && c !== start; c = c.p) path.push([c.x, c.y, c.z]);
    return path.reverse();
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// §10 ENTITIES — base class, player, dropped items, mobs, arrows, primed TNT
// ═══════════════════════════════════════════════════════════════════════════
const GRAVITY = 30;

class Entity {
  constructor(x, y, z) {
    this.x = x; this.y = y; this.z = z;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.w = 0.6; this.h = 1.8;
    this.onGround = false; this.stepHeight = 0.6;
    this.inWater = false; this.inLava = false; this.eyeInWater = false;
    this.fallDist = 0; this.fire = 0; this.dead = false; this.yaw = 0;
    this.health = 20; this.maxHealth = 20; this.invul = 0; this.hurtTime = 0; this.knockTime = 0;
  }
  aabb() { const hw = this.w / 2; return [this.x - hw, this.y, this.z - hw, this.x + hw, this.y + this.h, this.z + hw]; }
  /** Update fluid contact flags. */
  senseFluids(world) {

    const shaft = new THREE.Mesh(sharedBox(0.05, 0.05, 0.6), new THREE.MeshLambertMaterial({ color: 0x8a6a3a }));
